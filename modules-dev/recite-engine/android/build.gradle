// Recite on the phone (Revisely Dev only: plugins/withDevModules links modules-dev/ into Dev's builds alone).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.revisely.reciteengine'
version = '0.1.0'

// The engine (recite-core) is private: core/fetch.js brings its compiled libraries into build/recite-core when the build
// holds RECITE_CORE_TOKEN, checked against core/recite-core.lock, and otherwise puts a stub there, which CMake compiles
// (the app then uses the server path). build/ is gitignored and left out of the fingerprint.
def reciteCoreOut = layout.buildDirectory.dir('recite-core').get().asFile
def fetchReciteCore = tasks.register('fetchReciteCore', Exec) {
  commandLine 'node', file('../core/fetch.js').absolutePath, 'android', reciteCoreOut.absolutePath
  standardOutput = new ByteArrayOutputStream()
  outputs.upToDateWhen { false }
}
tasks.matching { it.name == 'preBuild' || it.name.startsWith('configureCMake') || it.name.startsWith('buildCMake') }
  .configureEach { dependsOn fetchReciteCore }

android {
  namespace "app.revisely.reciteengine"
  ndkVersion rootProject.ext.has('ndkVersion') ? rootProject.ext.ndkVersion : '27.1.12297006'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    ndk {
      abiFilters(*(findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').split(',').collect { it.trim() })
    }
    externalNativeBuild {
      cmake {
        arguments "-DRECITE_CORE_OUT=${reciteCoreOut.absolutePath}", '-DANDROID_STL=c++_shared'
      }
    }
  }
  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }
  packagingOptions {
    jniLibs {
      // React Native's own copy is the app's; a second one from this library would clash.
      excludes += ['**/libc++_shared.so']
    }
  }
}

dependencies {
  // One version, the checker's (onnxruntime==1.31.1), from Maven Central: CPU, XNNPACK and NNAPI providers.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'
}
