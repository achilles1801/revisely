name: CI

on:
  push:
    branches: [develop, main]
  # ready_for_review: a draft (no E2E) marked ready runs everything.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge queue's group (needs an organization-owned repo; ready if it moves).
  merge_group:
    types: [checks_requested]
  # Claude's fix PRs (claude-fix.yml) are opened with the workflow token, which starts no workflows;
  # that workflow starts CI on the branch this way.
  workflow_dispatch:

permissions:
  contents: read

# A newer push or PR update cancels the older run, except on develop: there every flow runs on both
# platforms after each merge (an hour on iOS), and a run cancelled by the next merge would never
# finish. So develop's runs go one at a time, the newest waiting one replacing older ones, and each
# covers everything merged since the last one that ran.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

# The one required check is `Required` (the last job): it passes only when every job this change
# needs passed. The long E2E flows gate production, not TestFlight (Majd, Nov 7 2026): every check
# stays, only where it runs changed. What runs where:
#   - every PR, push and merge group: the fast checks (one job: secret scan,
#     typecheck, unit, functions, rules) and the scenario suite in four shards;
#   - E2E (e2e.yml, called below), decided by `plan`:
#       a draft PR: none, unless it has the `e2e` label (marking it ready runs everything);
#       a lower layer of a GitHub stack: none (the top layer tests the whole stack);
#       a PR into develop, single or the top of a stack (or claude-fix's run by hand), and a
#       merge group: the Android smoke set; a change to code flows share adds the flows using it,
#       on Android, twice;
#       a push to develop (what just landed): every flow, iOS and Android. It holds up nothing
#       (Preview publishes on the scenario gate); a failure opens or updates the develop-red
#       issue with its suspects, and Revert a suspect is ready;
#       a PR into main (the release to production): every flow, iOS and Android, with the
#       visual baselines;
#     nightly and by hand: e2e.yml's own schedule and Run workflow.
# "Bug fixes add a scenario" is its own workflow (spec.yml), so a label or title
# edit re-runs it alone.

jobs:
  plan:
    name: CI plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
      only: ${{ steps.plan.outputs.only }}
      repeat: ${{ steps.plan.outputs.repeat }}
      scenario_repeat: ${{ steps.plan.outputs.scenario_repeat }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .maestro
            .github
      # Test the tests: what a PR changes in the code flows and scenarios share
      # (.github/scripts/affected-flows.js). Its flows run on both platforms,
      # twice, with no reruns; a change to the scenario harness runs the suite
      # twice. #286 changed swipe-page.yaml, passed 06 once in the smoke set and
      # broke 06 on develop.
      - id: infra
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK_BASE_SHA: ${{ github.event.pull_request.stack.base.sha }}
        run: |
          if [ -n "$STACK_BASE_SHA" ]; then
            files=$(gh api "repos/$REPO/compare/$STACK_BASE_SHA...$HEAD_SHA" --jq '.files[] | .filename, (.previous_filename // empty)')
          else
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          fi
          out=$(printf '%s\n' "$files" | node .github/scripts/affected-flows.js)
          echo "Shared test code: $out"
          echo "flows=$(jq -c .flows <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "scenarios=$(jq -r .scenarios <<<"$out")" >> "$GITHUB_OUTPUT"
      # A stacked PR carries `stack` (position 1 is the bottom; the top has
      # position == size; base.ref is the branch the whole stack targets).
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          BASE: ${{ github.base_ref }}
          STACK_SIZE: ${{ github.event.pull_request.stack.size }}
          STACK_POSITION: ${{ github.event.pull_request.stack.position }}
          STACK_BASE: ${{ github.event.pull_request.stack.base.ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          INFRA_FLOWS: ${{ steps.infra.outputs.flows }}
          INFRA_SCENARIOS: ${{ steps.infra.outputs.scenarios }}
        run: |
          ios=none; android=none; only=""; repeat=1; scenario_repeat=1
          case "$EVENT" in
            pull_request)
              target=${STACK_BASE:-$BASE}
              if [ "$DRAFT" = true ] && ! echo "$LABELS" | jq -e 'index("e2e")' >/dev/null; then
                what="a draft PR: the fast checks and scenarios, no E2E (add the e2e label and push, or mark it ready)"
              elif [ -n "$STACK_SIZE" ] && [ "$STACK_POSITION" != "$STACK_SIZE" ]; then
                what="layer $STACK_POSITION of $STACK_SIZE of a stack into $target: fast checks (the top layer runs E2E for the whole stack)"
              elif [ "$target" = main ]; then
                ios=full; android=full; what="a PR into main: every flow"
              elif [ "$target" = develop ] && [ -n "$STACK_SIZE" ]; then
                android=smoke; what="the top of a stack of $STACK_SIZE into develop: the Android smoke set (every flow runs once it lands)"
              elif [ "$target" = develop ]; then
                android=smoke; what="a PR into develop: the Android smoke set (every flow runs once it lands)"
              else
                what="a PR into $target: fast checks (E2E runs once it targets develop)"
              fi
              # Test the tests (not for drafts, nor a stack's lower layers, nor PRs into main,
              # which run every flow anyway): the flows using the shared code it changed, on
              # Android, twice (iOS runs every flow once it lands).
              if [ "$target" = develop ] && [ "$DRAFT" != true ] && { [ -z "$STACK_SIZE" ] || [ "$STACK_POSITION" = "$STACK_SIZE" ]; }; then
                if [ -n "$INFRA_FLOWS" ] && [ "$INFRA_FLOWS" != '[]' ]; then
                  android=infra; repeat=2
                  # With the smoke set a single PR runs anyway (each flow once in the list).
                  only=$(jq -r --arg smoke "$(ls .maestro/flows/0[2456]-*.yaml | tr '\n' ' ')" \
                    'if . == "all" then "all" else (. + ($smoke | split(" ") | map(select(. != "")))) | unique | join(" ") end' <<<"$INFRA_FLOWS")
                  what="$what; it changes code flows share: $only, on Android, twice"
                fi
                if [ "$INFRA_SCENARIOS" = true ]; then
                  scenario_repeat=2; what="$what; it changes the scenario harness: the suite twice"
                fi
              fi ;;
            merge_group) android=smoke; what="a merge group: the Android smoke set (every flow runs once it lands)" ;;
            push)
              if [ "$REF" = develop ]; then
                ios=full; android=full; what="what landed on develop: every flow, iOS and Android (it holds up nothing; a failure opens develop-red)"
              else
                what="a push to $REF: no E2E (its PR ran it)"
              fi ;;
            workflow_dispatch) android=smoke; what="a run by hand: the Android smoke set" ;;
            *) what="$EVENT: no E2E" ;;
          esac
          e2e=true; [ "$ios$android" = nonenone ] && e2e=false
          echo "$what (iOS: $ios, Android: $android)"
          { echo "ios=$ios"; echo "android=$android"; echo "e2e=$e2e"; echo "only=$only"; echo "repeat=$repeat"; echo "scenario_repeat=$scenario_repeat"; } >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # The fast checks, one job: the secret scan, typechecks, the app's unit and
  # component tests, the Cloud Functions' tests and the Firestore rules tests,
  # one step each. They were five jobs of under a minute to three, and each one
  # waited for a runner of its own (30-43 minutes, Nov 7 2026, with eight
  # sessions pushing) and installed the app again. Every check runs even when
  # one before it failed, and the job fails if any did: each step's result
  # shows on its own in the run.
  # -----------------------------------------------------------------------
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/scenarios/package-lock.json
            functions/package-lock.json
            tests/firestore-rules/package-lock.json

      # The repository is public: fail if a tracked file holds something that
      # looks like a secret (scripts/check-secrets.sh; no dependencies).
      - name: Secret scan
        id: secrets
        run: bash scripts/check-secrets.sh --self-test && bash scripts/check-secrets.sh

      - name: Install (app, scenarios, functions, rules)
        id: install
        if: ${{ !cancelled() }}
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix tests/scenarios
          npm ci --prefix functions
          npm ci --prefix tests/firestore-rules

      # The app (tests/scenarios with it; fast-check is its own dependency), and
      # the Cloudflare worker (worker/, wrangler.jsonc). functions/ and
      # tests/firestore-rules/ have their own and are checked below.
      - name: Typecheck (app, worker)
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit && npx tsc --noEmit -p worker

      - name: Unit + component tests (app)
        id: unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --ci --coverage

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        with:
          name: app-coverage
          path: coverage/

      - name: Cloud Functions (build, tests)
        id: functions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: functions
        run: npm run build && npm test -- --ci

      # Against the Firestore emulator, which needs Java 21 and the Firebase CLI.
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore rules tests
        id: rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: tests/firestore-rules
        run: npm install -g firebase-tools && npm test

  # -----------------------------------------------------------------------
  # Scenario and property tests (tests/scenarios, BEHAVIOUR.md): the app's own
  # code and screens against the Firebase emulators, with a test clock and
  # time zone. preview.yml runs the same before it publishes.
  # -----------------------------------------------------------------------
  scenarios:
    name: Scenarios
    needs: plan
    uses: ./.github/workflows/scenarios.yml
    with:
      repeat: ${{ fromJSON(needs.plan.outputs.scenario_repeat || '1') }}

  # -----------------------------------------------------------------------
  # The real app on the simulator and the emulator (e2e.yml), as `plan` says.
  # -----------------------------------------------------------------------
  e2e:
    name: E2E
    needs: plan
    if: ${{ needs.plan.outputs.e2e == 'true' }}
    # actions and issues: the develop-red issue (e2e.yml), written only for pushes to develop.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
    uses: ./.github/workflows/e2e.yml
    with:
      ios: ${{ needs.plan.outputs.ios }}
      android: ${{ needs.plan.outputs.android }}
      only: ${{ needs.plan.outputs.only }}
      repeat: ${{ needs.plan.outputs.repeat || '1' }}

  # -----------------------------------------------------------------------
  # The required check. It runs after a failure too (never missing), and fails
  # unless every job passed: a job skipped because another failed is not a
  # pass. The one job that may be skipped is E2E, when `plan` didn't ask for it.
  # -----------------------------------------------------------------------
  required:
    name: Required
    needs: [plan, fast, scenarios, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          E2E_PLANNED: ${{ needs.plan.outputs.e2e }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r --arg e2e "$E2E_PLANNED" '
            to_entries[] | select(.value.result != "success")
            | select(.key != "e2e" or $e2e == "true" or .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then echo "::error::Not passed: $(echo $bad)"; exit 1; fi
          echo "Every job this change needs passed."
