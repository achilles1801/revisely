name: CI

on:
  push:
    branches: [develop, main]
  # ready_for_review: a draft (no E2E) marked ready runs everything.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge queue's group (needs an organization-owned repo; ready if it moves).
  merge_group:
    types: [checks_requested]
  # Claude's fix PRs (claude-fix.yml) are opened with the workflow token, which starts no workflows;
  # that workflow starts CI on the branch this way.
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run before it, except on develop: there a started run finishes and the newest
# push waits (GitHub keeps one waiting run per group, so a newer one takes its place). Until Nov 23 2026 each
# merge cancelled the run in progress: 147 of the 259 hours of develop-push Android E2E in ten days ended
# cancelled, and in a burst of merges no run finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

# The one required check on develop is `Required` (the last job): it passes only
# when every job this change needs passed. What runs where:
#   - every PR, push and merge group: the fast checks (one job: secret scan,
#     typecheck, unit, functions, rules) and the scenario suite in four shards
#     (a push to develop or a run by hand reuses a pass on the same tree, `reuse`);
#   - E2E (e2e.yml, called below), decided by `plan`:
#       a draft PR: none, unless it has the `e2e` label (marking it ready runs everything);
#       a lower layer of a GitHub stack: none (the top layer tests the whole stack);
#       a PR into develop whose commits another open PR into develop holds (branches built
#         on one another, without GitHub's stacks): none, and its check is "Required (under
#         #N)", so it merges with #N, or alone once #N's run has passed (`layers`, `pass-lower`);
#         `supersede` cancels its runs once #N's starts;
#       the top of a stack into develop, a PR into main, a merge group: every flow, iOS and Android;
#       a single PR into develop (or claude-fix's run by hand): the Android smoke set;
#       a change to test code (`infra`): the flows it touches (once, one retry); a change to
#         the workflows, run.sh or config.yaml: every flow on Android, the smoke set on iOS;
#       a push to develop (what just landed): every Android flow, and the iOS native
#       build kept for PRs (no iOS flows); a newer push waits for it;
#     nightly and by hand: e2e.yml's own schedule and Run workflow.
# "Bug fixes add a scenario" is its own workflow (spec.yml), so a label or title
# edit re-runs it alone.

jobs:
  plan:
    name: CI plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read # `reuse` reads the scenario artifacts and Preview's runs
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
      only: ${{ steps.plan.outputs.only }}
      only_ios: ${{ steps.plan.outputs.only_ios }}
      upper: ${{ steps.layers.outputs.upper }}
      lower: ${{ steps.layers.outputs.lower }}
      draft: ${{ steps.live.outputs.draft }}
      repeat: ${{ steps.plan.outputs.repeat }}
      scenario_repeat: ${{ steps.plan.outputs.scenario_repeat }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
      preview_run: ${{ steps.reuse.outputs.preview_run }}
      tree: ${{ steps.reuse.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .maestro
            .github
            scripts/e2e
      # Whether the PR is a draft now, read from GitHub, not from the event that started the run. On #674 a
      # push and `gh pr ready` seconds apart made one run, with the push's draft payload, and no
      # ready_for_review run came: it ran no E2E and posted "Required (draft)", and the PR sat BLOCKED with
      # every check green until it was made a draft and ready again (run 43876874743, Nov 16 2026).
      # `layers`, `plan` and the required check's name read this; the payload's value if the read fails.
      - id: live
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PAYLOAD_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          draft=$(gh api "repos/$REPO/pulls/$PR" --jq .draft 2>/dev/null) || draft=""
          case "$draft" in
            true|false) ;;
            *) draft=$PAYLOAD_DRAFT; echo "::warning title=CI::Couldn't read whether #$PR is a draft; the event's value ($draft) stands." ;;
          esac
          [ "$draft" = "$PAYLOAD_DRAFT" ] || echo "::notice title=CI::The event says draft=$PAYLOAD_DRAFT; #$PR is now draft=$draft, which this run follows."
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      # Test the tests: what a PR changes in the code flows and scenarios share
      # (.github/scripts/affected-flows.js). Its flows run on both platforms, once
      # with run.sh's one retry (a pass on the retry passes, and the weekly flake
      # report counts it); a change to the scenario harness runs the suite twice.
      # #286 changed swipe-page.yaml, passed 06 once in the smoke set and broke 06
      # on develop. Each touched flow ran twice with no reruns until Nov 16 2026,
      # which doubled the macOS minutes of every PR that edits a flow.
      - id: infra
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK_BASE_SHA: ${{ github.event.pull_request.stack.base.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$STACK_BASE_SHA" ]; then
            files=$(gh api "repos/$REPO/compare/$STACK_BASE_SHA...$HEAD_SHA" --jq '.files[] | .filename, (.previous_filename // empty)')
          else
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          fi
          # The E2E job lists as they are on the base: a change to them runs the flows whose job changed
          # (affected-flows.js), or, with nothing to compare, every flow.
          before=""
          if printf '%s\n' "$files" | grep -qx 'scripts/e2e/jobs.json'; then
            before="$RUNNER_TEMP/jobs-before.json"
            gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/scripts/e2e/jobs.json?ref=${STACK_BASE_SHA:-$BASE_SHA}" > "$before" || before=""
          fi
          out=$(printf '%s\n' "$files" | E2E_JOBS_BEFORE="$before" node .github/scripts/affected-flows.js)
          echo "Shared test code: $out"
          { echo "flows=$(jq -c .flows <<<"$out")"; echo "ios_flows=$(jq -c .ios <<<"$out")"; echo "scenarios=$(jq -r .scenarios <<<"$out")"; } >> "$GITHUB_OUTPUT"
          # Whether the scenario run can tell this PR anything: false only when every file it changes is one
          # the suite never reads (.github/scripts/scenarios-needed.js, conservative). Anything else runs it.
          needed=$(printf '%s\n' "$files" | node .github/scripts/scenarios-needed.js) || needed=true
          echo "scenarios_needed=$needed" >> "$GITHUB_OUTPUT"
      # PRs into develop built on one another's branches without GitHub's stacks: the Recite PRs of
      # Nov 15 2026 (#621 → #625 → #628 → #629 → #630 → #659, #632 → #633 → #635) each ran every
      # flow it touched on iOS for commits the PR above held too, and sessions cancelled the
      # lower runs by hand. Here, an open, non-draft PR into develop whose branch holds all of this
      # PR's commits is `upper`: this PR runs no E2E, and its check is "Required (under #N)", not
      # "Required", so it doesn't merge on that run alone: it merges when #N does (GitHub marks a PR
      # merged once its commits reach its base), or on its own once #N's run has passed, which posts
      # "Required" on its head (`pass-lower`). The PRs whose commits this one holds are `lower`, and
      # `supersede` cancels their runs. If #N's run fails, a lower PR merges alone after the one above
      # is marked a draft (or closed) and the lower PR's CI is run again.
      # Commits only (no trees or files): about a second and 1.3 MB for 20 open PRs. Anything that
      # fails here leaves the plan as it was.
      - id: layers
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.base_ref }}
          STACK_SIZE: ${{ github.event.pull_request.stack.size }}
          DRAFT: ${{ steps.live.outputs.draft }}
        run: |
          if [ "$BASE" != develop ] || [ -n "$STACK_SIZE" ] || [ "$DRAFT" = true ]; then printf 'upper=\nlower=[]\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          prs=$(gh pr list --repo "$REPO" --base develop --state open --limit 200 --json number,headRefOid,isDraft \
            --jq "[.[] | select(.number != $PR and .isDraft == false and .headRefOid != \"$HEAD_SHA\")] | sort_by(.number)") || prs='[]'
          heads="$RUNNER_TEMP/heads"
          git init -q --bare "$heads"
          mapfile -t shas < <(jq -r '.[].headRefOid' <<<"$prs")
          if [ "$prs" = '[]' ] || ! git -C "$heads" fetch -q --filter=tree:0 "https://github.com/$REPO.git" "$HEAD_SHA" "${shas[@]}"; then
            printf 'upper=\nlower=[]\n' >> "$GITHUB_OUTPUT"; echo "No other open PR into develop to compare with."; exit 0
          fi
          above=(); lower='[]'
          while read -r n sha; do
            if git -C "$heads" merge-base --is-ancestor "$HEAD_SHA" "$sha"; then above+=("$n $sha")
            elif git -C "$heads" merge-base --is-ancestor "$sha" "$HEAD_SHA"; then
              lower=$(jq -c --argjson n "$n" --arg sha "$sha" '. + [{number: $n, sha: $sha}]' <<<"$lower")
            fi
          done < <(jq -r '.[] | "\(.number) \(.headRefOid)"' <<<"$prs")
          # Of the PRs above, the top one: no other PR above holds its commits.
          upper=""
          for a in "${above[@]}"; do
            top=true
            for b in "${above[@]}"; do
              [ "$a" = "$b" ] && continue
              if git -C "$heads" merge-base --is-ancestor "${a#* }" "${b#* }"; then top=false; break; fi
            done
            if [ "$top" = true ]; then upper=${a%% *}; break; fi
          done
          [ -z "$upper" ] || echo "#$upper holds this PR's commits: it tests them, and this PR merges with it."
          [ "$lower" = '[]' ] || echo "This PR holds the commits of $(jq -r 'map("#\(.number)") | join(", ")' <<<"$lower"): their runs are cancelled."
          { echo "upper=$upper"; echo "lower=$lower"; } >> "$GITHUB_OUTPUT"
      # A develop push starts CI and Preview together, and until Nov 23 2026 both ran the scenario suite
      # on the same commit (146 hours of CI's in ten days). The same tree gives the same result, so:
      # a pass on this tree already (scenarios-passed-<tree>, this repository's runs only) counts here;
      # with Preview's run for this commit still going, `scenarios-wait` waits for its result; with no
      # such run (a push Preview ignores), the suite runs here. A run by hand follows the same rule.
      - id: reuse
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          TREE=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null || true)
          [ -n "$TREE" ] || { echo "Couldn't read this commit's tree: the suite runs here."; exit 0; }
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          passed() {
            gh api "repos/$REPO/actions/artifacts?name=scenarios-passed-$TREE&per_page=30" \
              --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .workflow_run.id // empty' 2>/dev/null || true
          }
          # The testing half of Preview on this commit, not yet finished (its other halves' titles say so).
          running() {
            gh api "repos/$REPO/actions/workflows/preview.yml/runs?head_sha=$SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.status != "completed") | select(.display_title | startswith("Preview · ") | not)] | first | .id // empty' 2>/dev/null || true
          }
          RUN=$(passed)
          if [ -n "$RUN" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Scenarios::This tree ($TREE) passed the scenario suite in run $RUN: not run again."
            exit 0
          fi
          PREVIEW=$(running)
          # Started by the same push, it can take a moment to be listed.
          if [ -z "$PREVIEW" ] && [ "$EVENT" = push ]; then sleep 15; PREVIEW=$(running); fi
          if [ -n "$PREVIEW" ]; then
            echo "preview_run=$PREVIEW" >> "$GITHUB_OUTPUT"
            echo "Preview's run $PREVIEW tests this commit: waiting for its result."
          else
            echo "No passing run on this tree and no Preview run going: the suite runs here."
          fi
      # A stacked PR carries `stack` (position 1 is the bottom; the top has
      # position == size; base.ref is the branch the whole stack targets).
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          BASE: ${{ github.base_ref }}
          STACK_SIZE: ${{ github.event.pull_request.stack.size }}
          STACK_POSITION: ${{ github.event.pull_request.stack.position }}
          STACK_BASE: ${{ github.event.pull_request.stack.base.ref }}
          DRAFT: ${{ steps.live.outputs.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          INFRA_FLOWS: ${{ steps.infra.outputs.flows }}
          INFRA_IOS_FLOWS: ${{ steps.infra.outputs.ios_flows }}
          UPPER: ${{ steps.layers.outputs.upper }}
          INFRA_SCENARIOS: ${{ steps.infra.outputs.scenarios }}
          INFRA_SCENARIOS_NEEDED: ${{ steps.infra.outputs.scenarios_needed }}
          REUSED: ${{ steps.reuse.outputs.tested }}
        run: |
          ios=none; android=none; only=""; only_ios=""; repeat=1; scenario_repeat=1
          case "$EVENT" in
            pull_request)
              target=${STACK_BASE:-$BASE}
              if [ "$DRAFT" = true ] && ! echo "$LABELS" | jq -e 'index("e2e")' >/dev/null; then
                what="a draft PR: the fast checks and scenarios, no E2E (add the e2e label and push, or mark it ready)"
              elif [ -n "$STACK_SIZE" ] && [ "$STACK_POSITION" != "$STACK_SIZE" ]; then
                what="layer $STACK_POSITION of $STACK_SIZE of a stack into $target: fast checks (the top layer runs E2E for the whole stack)"
              elif [ -n "$UPPER" ]; then
                what="a PR into develop whose commits #$UPPER holds: fast checks and scenarios (#$UPPER's run tests both, and this PR merges with it)"
              elif [ "$target" = main ]; then
                ios=full; android=full; what="a PR into main: every flow"
              elif [ "$target" = develop ] && [ -n "$STACK_SIZE" ]; then
                ios=full; android=full; what="the top of a stack of $STACK_SIZE into develop: every flow"
              elif [ "$target" = develop ]; then
                android=smoke; what="a PR into develop: the Android smoke set"
              else
                what="a PR into $target: fast checks (E2E runs once it targets develop)"
              fi
              # Test the tests (not for drafts, nor a stack's lower layers, nor PRs into main,
              # which run every flow anyway): the flows using the shared code it changed, both
              # platforms, once with a retry.
              if [ "$target" = develop ] && [ "$DRAFT" != true ] && [ -z "$UPPER" ] && { [ -z "$STACK_SIZE" ] || [ "$STACK_POSITION" = "$STACK_SIZE" ]; }; then
                if [ -n "$INFRA_FLOWS" ] && [ "$INFRA_FLOWS" != '[]' ]; then
                  ios=infra; android=infra
                  # Android: with the smoke set a single PR runs anyway (each flow once in the list).
                  only=$(jq -r --arg smoke "$(ls .maestro/flows/0[2456]-*.yaml | tr '\n' ' ')" \
                    'if . == "all" then "all" else (. + ($smoke | split(" ") | map(select(. != "")))) | unique | join(" ") end' <<<"$INFRA_FLOWS")
                  # iOS: only the flows it touches (a single PR runs no iOS smoke set: 18 alone for a
                  # Recite PR, not 02 04 05 06 18 in three macOS jobs), and for a change to the workflows
                  # the smoke set (affected-flows.js).
                  only_ios=$(jq -r 'join(" ")' <<<"${INFRA_IOS_FLOWS:-[]}")
                  [ -n "$only_ios" ] || ios=none
                  what="$what; it changes test code: on Android $only, on iOS ${only_ios:-nothing}"
                fi
                if [ "$INFRA_SCENARIOS" = true ]; then
                  scenario_repeat=2; what="$what; it changes the scenario harness: the suite twice"
                fi
              fi ;;
            merge_group) ios=full; android=full; what="a merge group: every flow" ;;
            push)
              if [ "$REF" = develop ]; then
                ios=build; android=full; what="what landed on develop: every Android flow, and the iOS native build kept for PRs"
              else
                what="a push to $REF: no E2E (its PR ran it)"
              fi ;;
            workflow_dispatch) android=smoke; what="a run by hand: the Android smoke set" ;;
            *) what="$EVENT: no E2E" ;;
          esac
          e2e=true; [ "$ios$android" = nonenone ] && e2e=false
          # A PR that changes nothing the scenario suite reads skips it (only an explicit `false` skips). No
          # run means no scenarios-passed-<tree> artifact, so this never counts as a pass for Preview's
          # publishing gate. A push to develop or a run by hand whose tree already passed reuses that (`reuse`).
          scenarios=true
          if [ "$EVENT" = pull_request ] && [ "$INFRA_SCENARIOS_NEEDED" = false ]; then
            scenarios=false; what="$what; it changes nothing the scenarios read: no scenario run"
          elif [ "$REUSED" = true ]; then
            scenarios=false; what="$what; this tree already passed the scenario suite"
          fi
          echo "$what (iOS: $ios, Android: $android)"
          { echo "ios=$ios"; echo "android=$android"; echo "e2e=$e2e"; echo "only=$only"; echo "only_ios=$only_ios"; echo "repeat=$repeat"; echo "scenario_repeat=$scenario_repeat"; echo "scenarios=$scenarios"; } >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # The runs of the PRs whose commits this PR holds (`layers` in `plan`): this run tests them, so
  # theirs only hold macOS runners. Their check stays "Required (under #N)" or cancelled, and they
  # merge with this PR. Not part of `Required`: a cancel that fails changes nothing here.
  # -----------------------------------------------------------------------
  supersede:
    name: Cancel the runs this PR's run covers
    needs: plan
    if: ${{ needs.plan.outputs.lower != '' && needs.plan.outputs.lower != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LOWER: ${{ needs.plan.outputs.lower }}
          RUN_ID: ${{ github.run_id }}
        run: |
          jq -r '.[] | "\(.number) \(.sha)"' <<<"$LOWER" | while read -r n sha; do
            [[ "$n" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            for r in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=pull_request&per_page=20" \
                         --jq ".workflow_runs[] | select(.status != \"completed\" and .id != $RUN_ID) | .id"); do
              if gh api -X POST "repos/$REPO/actions/runs/$r/cancel" >/dev/null; then
                echo "::notice title=CI::Cancelled run $r of #$n: this PR holds its commits, and this run tests them."
              else
                echo "::warning title=CI::Couldn't cancel run $r of #$n."
              fi
            done
          done

  # -----------------------------------------------------------------------
  # The fast checks, one job: the secret scan, typechecks, the app's unit and
  # component tests, the Cloud Functions' tests and the Firestore rules tests,
  # one step each. They were five jobs of under a minute to three, and each one
  # waited for a runner of its own (30-43 minutes, Nov 7 2026, with eight
  # sessions pushing) and installed the app again. Every check runs even when
  # one before it failed, and the job fails if any did: each step's result
  # shows on its own in the run.
  # -----------------------------------------------------------------------
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/scenarios/package-lock.json
            functions/package-lock.json
            tests/firestore-rules/package-lock.json
            scripts/lint/package-lock.json

      # npm 10, which Node 20 comes with, can give two of its cache's temporary files the same
      # name, and `npm ci` then fails with EEXIST (npm/cli#7308; a scenario shard in #422's CI).
      # npm 11.12 fixed it (cacache 20.0.4).
      - name: npm 11
        run: npm install -g npm@11.21.1 --no-audit --no-fund

      # The repository is public: fail if a tracked file holds something that
      # looks like a secret (scripts/check-secrets.sh; no dependencies).
      - name: Secret scan
        id: secrets
        run: bash scripts/check-secrets.sh --self-test && bash scripts/check-secrets.sh

      - name: Install (app, scenarios, functions, rules, lint)
        id: install
        if: ${{ !cancelled() }}
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix tests/scenarios
          npm ci --prefix functions
          npm ci --prefix tests/firestore-rules
          npm ci --prefix scripts/lint

      # The store app's fingerprints (CLAUDE.md "Runtime version is a fingerprint"): a change that
      # moves one makes Preview build and submit a new store binary on the merge. A PR meant to move
      # them commits scripts/store-fingerprints.json (`node scripts/check-store-fingerprints.js --write`).
      - name: Store fingerprints
        id: storefp
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-store-fingerprints.js

      # The app (tests/scenarios with it; fast-check is its own dependency), and
      # the Cloudflare worker (worker/, wrangler*.jsonc). functions/ and
      # tests/firestore-rules/ have their own and are checked below.
      - name: Typecheck (app, worker)
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit && npx tsc --noEmit -p worker

      # ESLint on the app (scripts/lint/README.md: its own package, so the app's package.json, part of
      # the store fingerprint, never changes for it). Errors fail; warnings are left to come down over time.
      - name: Lint (app)
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --prefix scripts/lint eslint -c scripts/lint/eslint.config.mjs --quiet .

      # Prettier on the folders formatted so far (scripts/lint/formatted.txt): the rest is formatted a
      # folder at a time, never all at once. A failure prints the files; `npx --prefix scripts/lint prettier
      # --config scripts/lint/prettier.config.mjs --write <file>` fixes them.
      - name: Format (formatted folders)
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --prefix scripts/lint prettier --config scripts/lint/prettier.config.mjs --check $(grep -v '^#' scripts/lint/formatted.txt)

      - name: Unit + component tests (app)
        id: unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --ci --coverage

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        with:
          name: app-coverage
          path: coverage/

      - name: Cloud Functions (build, tests)
        id: functions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: functions
        run: npm run build && npm test -- --ci

      # Against the Firestore emulator, which needs Java 21 and the Firebase CLI.
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore rules tests
        id: rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: tests/firestore-rules
        run: npm install -g firebase-tools && npm test

      # Open Door's review (functions/src/support/review.ts) and the console's role changes
      # against the Auth and Firestore emulators: the real transactions, queries and cursors.
      - name: Open Door review (emulators)
        id: review
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: functions
        run: bash ../scripts/emulators.sh exec auth,firestore demo-revisely 'npx jest --ci review.emulator'

  # -----------------------------------------------------------------------
  # Scenario and property tests (tests/scenarios, BEHAVIOUR.md): the app's own
  # code and screens against the Firebase emulators, with a test clock and
  # time zone. preview.yml runs the same before it publishes.
  # -----------------------------------------------------------------------
  # A develop push whose Preview run is testing the same commit: wait for that result instead of running
  # the suite a second time. One machine, asking once a minute. Passed: not run here. Replaced by a newer
  # push while it waited: that push's run tests a tree holding this one. Failed, or still not done after
  # 35 minutes: the suite runs here, so this run's own check says what happened.
  scenarios-wait:
    name: Scenarios (Preview's run of this commit)
    needs: plan
    if: ${{ needs.plan.outputs.preview_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.wait.outputs.tested }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ needs.plan.outputs.preview_run }}
          TREE: ${{ needs.plan.outputs.tree }}
        run: |
          conclusion=""
          for _ in $(seq 1 35); do
            state=$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.status + " " + (.conclusion // "")' 2>/dev/null || true)
            case "$state" in completed*) conclusion=${state#completed }; break ;; esac
            sleep 60
          done
          PASSED=$(gh api "repos/$REPO/actions/artifacts?name=scenarios-passed-$TREE&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .workflow_run.id // empty' 2>/dev/null || true)
          if [ -n "$PASSED" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Scenarios::This tree ($TREE) passed the scenario suite in run $PASSED: not run again."
          elif [ "$conclusion" = cancelled ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Scenarios::Preview's run $RUN was replaced by a newer push, whose run tests a tree holding this one."
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "Preview's run $RUN ended '${conclusion:-not finished}' with no pass on this tree: the suite runs here."
          fi

  scenarios:
    name: Scenarios
    needs: [plan, scenarios-wait]
    # Skipped when `plan` says so (a PR that changes nothing the suite reads, a tree that already passed)
    # or when Preview's run of this commit gave the result.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.scenarios != 'false' && needs.scenarios-wait.outputs.tested != 'true' }}
    uses: ./.github/workflows/scenarios.yml
    with:
      repeat: ${{ fromJSON(needs.plan.outputs.scenario_repeat || '1') }}

  # -----------------------------------------------------------------------
  # The real app on the simulator and the emulator (e2e.yml), as `plan` says.
  # -----------------------------------------------------------------------
  e2e:
    name: E2E
    needs: plan
    if: ${{ needs.plan.outputs.e2e == 'true' }}
    # actions and issues: the develop-red issue (e2e.yml), written only for pushes to develop.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
    uses: ./.github/workflows/e2e.yml
    with:
      ios: ${{ needs.plan.outputs.ios }}
      android: ${{ needs.plan.outputs.android }}
      only: ${{ needs.plan.outputs.only }}
      only_ios: ${{ needs.plan.outputs.only_ios }}
      repeat: ${{ needs.plan.outputs.repeat || '1' }}

  # -----------------------------------------------------------------------
  # The required check. It runs after a failure too (never missing), and fails
  # unless every job passed: a job skipped because another failed is not a
  # pass. The one job that may be skipped is E2E, when `plan` didn't ask for it.
  # -----------------------------------------------------------------------
  required:
    # The check branch protection requires: "Required" on develop; on main, "Release gate", which only a
    # PR into main whose run tested every flow on both platforms posts (a lower layer of a stack into
    # main runs the fast checks, so it posts "Required"). GitHub matches a required check by name on the
    # commit, from any run: #496 (develop into main) merged 8 s after it opened, on the green "Required"
    # develop's own push run (Android flows, no iOS) had posted on the same commit, before its full run
    # had started (Nov 10 2026).
    # A draft's run is "Required (draft)": it runs no E2E, and its green check counted for the commit once
    # the PR was marked ready, until the ready run posted its own; #499 merged on it the moment it was
    # marked ready with auto-merge on (Nov 10 2026). Marked ready, the PR waits for that run's "Required".
    # A PR another PR's branch holds (`layers`) is "Required (under #N)": it merges with #N, or alone once
    # #N's run has passed (`pass-lower`). Whether it's a draft is GitHub's answer at the run (`live` in plan).
    name: "${{ needs.plan.outputs.draft == 'true' && 'Required (draft)' || (needs.plan.outputs.upper != '' && format('Required (under #{0})', needs.plan.outputs.upper)) || ((github.event.pull_request.stack.base.ref || github.base_ref) == 'main' && needs.plan.outputs.ios == 'full' && needs.plan.outputs.android == 'full' && 'Release gate' || 'Required') }}"
    needs: [plan, fast, scenarios-wait, scenarios, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          E2E_PLANNED: ${{ needs.plan.outputs.e2e }}
          SCENARIOS_PLANNED: ${{ needs.plan.outputs.scenarios }}
          PREVIEW_TESTED: ${{ needs.scenarios-wait.outputs.tested }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Skipped passes only for a job the plan left out: E2E when e2e is false, Scenarios when scenarios is
          # exactly false or Preview's run gave the result. Skipped for any other reason (a job before it
          # failed) is not a pass. `scenarios-wait` only decides whether the suite runs here: if it fails, it does.
          [ "$PREVIEW_TESTED" = true ] && SCENARIOS_PLANNED=false
          bad=$(echo "$NEEDS" | jq -r --arg e2e "$E2E_PLANNED" --arg scen "$SCENARIOS_PLANNED" '
            to_entries[] | select(.key != "scenarios-wait") | select(.value.result != "success")
            | select(.key != "e2e" or $e2e == "true" or .value.result != "skipped")
            | select(.key != "scenarios" or $scen != "false" or .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then echo "::error::Not passed: $(echo $bad)"; exit 1; fi
          echo "Every job this change needs passed."

  # -----------------------------------------------------------------------
  # The PRs whose commits this PR holds (`lower` in `plan`) planned no E2E, and their check is "Required
  # (under #N)". Once this run has passed, it has tested their commits too, and each gets "Required" on
  # its head, so it can merge on its own as well as with this PR (.github/scripts/pass-lower.js says which:
  # still open, the same head, and no run of its own failed). From #676 until Nov 16 2026 a lower PR merged
  # only with the PR above it: two separate PRs into develop, one of which happened to hold the other's
  # commits, kept the lower one waiting for the upper to merge.
  # `!cancelled()` is needed: without a status function GitHub adds success(), which is false when any job
  # before it was skipped, and `scenarios-wait` is skipped on almost every PR. So until Nov 26 2026 this job
  # never ran (100 PR runs; #987 waited on #1010's green run and merged only with it).
  # -----------------------------------------------------------------------
  pass-lower:
    name: Pass the PRs this run tested
    needs: [plan, required]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.outputs.draft != 'true' && needs.plan.outputs.upper == '' && needs.plan.outputs.lower != '' && needs.plan.outputs.lower != '[]' && needs.required.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LOWER: ${{ needs.plan.outputs.lower }}
          UPPER_PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/pass-lower.js
