name: Health report

# Daily at 13:00 UTC (8 am in Texas, summer time): the last 24 hours from Sentry (new and regressed
# issues, the busiest issues, problem reports, crash-free sessions and users per release in
# production and preview) as a comment on the pinned "App health (daily report)" issue, mentioning the
# owner so GitHub emails it. scripts/sentry/report.js. Needs SENTRY_API_TOKEN.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a Sentry API token
        env:
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
        run: |
          if [ -z "$SENTRY_API_TOKEN" ]; then
            echo "::error::Add a SENTRY_API_TOKEN repository secret (see CLAUDE.md, Health)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Post the report
        env:
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MENTION: '@${{ github.repository_owner }}'
        run: node scripts/sentry/report.js
