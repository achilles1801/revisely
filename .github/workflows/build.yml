name: EAS Build

# A native build, started by hand from the Actions tab, e.g. to replace a TestFlight build before it
# expires (90 days). Rarely needed otherwise: Preview (preview.yml) starts one by itself when a push to
# develop changes native code. Runs on a GitHub macOS runner (ios-build.yml), so it uses no EAS build credits.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit to TestFlight once built
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build production (ios)
    uses: ./.github/workflows/ios-build.yml
    with:
      submit: ${{ inputs.submit }}
    secrets: inherit
