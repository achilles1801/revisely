name: Preview

# Every push to develop goes to TestFlight first: its JavaScript and assets are published as an
# over-the-air update on the `preview` channel, plus a new TestFlight build whenever the push changed
# native code. TestFlight installs follow `preview` (src/lib/updateChannel.ts); App Store installs
# follow `production`, which only ever gets an update from here once it has been tried in TestFlight
# and promoted unchanged (promote.yml, on a merge of develop into main).
#
# Each update's message ends with "[app <hash>]", a hash of every file that goes into the app
# (.github/scripts/app-hash.sh), so promote.yml can find exactly the update that was tested for what
# it is asked to release. Docs, store and scripts changes don't change it.
#
# The runtime version is a fingerprint of the native side (app.config.js, fingerprint.config.js), and
# an update reaches only binaries with the same one. So before publishing, the fingerprint is looked
# up; one with no build gets a build on a GitHub macOS runner (ios-build.yml, no EAS build credits),
# submitted to TestFlight. Raise `version` in app.config.js with any native change: the new binary is
# what goes to App Store review (manually) once tested.
#
# Config values (Firebase keys, client ids, Sentry) come from the `production` environment on EAS,
# the same one production builds read, so an update carries the config its binary was built with.
#
# Android works the same way when the repository variable ANDROID_RELEASES is 'true' (Settings >
# Secrets and variables > Actions > Variables; on since Nov 1 2026): its fingerprint is looked up too
# (tag android-fp/<hash>), a Linux runner builds one with no build and uploads it to Google Play's
# internal testing track (android-build.yml, when ANDROID_SUBMIT is 'true'), and the update is
# published for both platforms. The two runtimes differ, so EAS makes one update group per platform,
# both with the same [app <hash>]; promote.yml promotes them together. Android testers follow
# `preview` by their account alone (updateChannel.ts).
#
# Two halves, one file. A push runs the testing half (gate, scenarios); once it passes, it starts
# this workflow again by hand (workflow_dispatch) with `publish` = the commit it tested, which runs
# the publishing half (fingerprint, builds, update). Testing runs go one at a time per branch and
# are never cancelled once started: a push that comes meanwhile waits, and a newer push takes the
# waiting one's place before it starts (GitHub keeps one waiting run per concurrency group). So in a
# burst of merges each finished run publishes, and the newest push is always the next one tested:
# its tree holds everything the skipped ones do. Until Nov 8 2026 a newer push cancelled the running
# test instead, and a burst (7 merges in 30 minutes) cancelled every run: nothing reached testers
# for hours. Publishing runs are one at a time (eas-preview) and never cancelled, so updates go out
# in order and a native build is never started twice. Before (Nov 7 2026) the whole run held
# eas-preview, and in a burst of merges each push waited for every older push's scenario run first:
# 19–24 minutes from a merge to its update instead of 5–15. One file because GitHub dispatches only
# workflows that are on the default branch (main) already.
#
# The publishing half checks for itself that the scenario suite passed on the commit's tree, and
# that the commit is on the branch, so a run by hand can't skip the gate. `dry_run` (by hand) goes
# through both halves without building or publishing anything.
#
# Revisely Dev (CLAUDE.md "Dev stack"), when the repository variable DEV_APP is 'true': the second
# app, on the dev Firebase project, gets the same commit after preview's update, on its own `dev`
# channel. Its runtimes are its own (APP_VARIANT=dev, the EAS development environment), so its
# binaries are built here too when they're missing (tags ios-dev-fp/<hash>, android-dev-fp/<hash>;
# Android only once DEV_ANDROID_SUBMIT is on, after its first bundle went to Play Console by hand).
# Nothing on the dev side can stop or change preview's update: preview's jobs never wait for it, and
# Promote reads only the preview branch.
run-name: ${{ inputs.publish && format('Preview · publish {0}', inputs.publish) || '' }}
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'functions/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.maestro/**'
      - 'store/**'
      - 'scripts/**'
      - '**/*.md'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publishing half only, for this tested commit (the testing half starts it; leave empty)
        required: false
        default: ''
      message:
        description: The update's message (with publish; the push's first line)
        required: false
        default: ''
      dry_run:
        description: Build and publish nothing (to try the workflow itself)
        type: boolean
        default: false

# Testing: one at a time per branch, and a started run finishes (a newer push replaces only a run
# still waiting). Publishing: one at a time, never cancelled.
concurrency:
  group: ${{ inputs.publish && (inputs.dry_run && 'eas-preview-dry-run' || 'eas-preview') || format('preview-tests-{0}{1}', github.ref, inputs.dry_run && '-dry-run' || '') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing is built or published unless the scenario tests pass (BEHAVIOUR.md): here, or on
  # exactly this tree. A PR merged with nothing else landing meanwhile has a merge commit whose
  # tree is the one its CI tested (refs/pull/N/merge); that run kept an artifact named after the
  # tree (scenarios.yml). Same tree, same suite, same result: the suite isn't run again, and the
  # update reaches TestFlight about ten minutes sooner. Only this repository's own runs count (a
  # fork's PR runs its own workflow files).
  gate:
    name: Scenarios passed on this tree already?
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    # Seconds of work. Short, because a newer push's run waits for this one to stop: a job cancelled
    # before its runner had started it sat until its timeout (two runs dispatched a second apart).
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TREE=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null || true)
          RUN=""
          if [ -n "$TREE" ]; then
            RUN=$(gh api "repos/$REPO/actions/artifacts?name=scenarios-passed-$TREE&per_page=30" \
              --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .workflow_run.id // empty' 2>/dev/null || true)
          fi
          if [ -n "$RUN" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Scenarios::This tree ($TREE) passed the scenario suite in run $RUN: not run again."
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "No passing run of the scenario suite on tree ${TREE:-?}: running it."
          fi

  scenarios:
    name: Scenarios
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.tested != 'true' }}
    uses: ./.github/workflows/scenarios.yml

  # Tested: the publishing half takes it from here, in its turn.
  handover:
    name: Hand over to publishing
    needs: [gate, scenarios]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.gate.outputs.tested == 'true' || needs.scenarios.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message || format('Manual update from {0}', github.ref_name) }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          # First line only, short enough that the hash survives: EAS caps an update's message at
          # 1024 characters and lists them cut at 512.
          SUBJECT=$(printf '%s\n' "$MESSAGE" | head -n 1 | cut -c 1-300)
          gh workflow run preview.yml --repo "$REPO" --ref "$REF" \
            -f publish="$SHA" -f message="$SUBJECT" -f dry_run="$DRY_RUN"
          echo "::notice title=Preview::Tested. Publishing $SHA is queued (Preview · publish $SHA)."

  # The publishing half (a run with `publish`): is that commit tested, and on this branch? Builds
  # use the branch as it is now (ios-build.yml and android-build.yml check out this run's commit),
  # so they run only if what goes into the app there is what was tested; otherwise a newer push
  # changed the app, and its own run builds.
  check:
    name: Tested?
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      can_build: ${{ steps.check.outputs.can_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED: ${{ inputs.publish }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          case "$TESTED" in *[!0-9a-f]*|'') echo "::error::publish: a full commit hash"; exit 1 ;; esac
          [ ${#TESTED} -eq 40 ] || { echo "::error::publish: a full commit hash"; exit 1; }
          if ! git merge-base --is-ancestor "$TESTED" "$HEAD_SHA" 2>/dev/null; then
            echo "::error::$TESTED is not on $REF: nothing is published."
            exit 1
          fi
          TREE=$(git rev-parse "$TESTED^{tree}")
          RUN=$(gh api "repos/$REPO/actions/artifacts?name=scenarios-passed-$TREE&per_page=30" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .workflow_run.id // empty')
          if [ -z "$RUN" ]; then
            echo "::error::The scenario suite hasn't passed on $TESTED (tree $TREE): nothing is published."
            exit 1
          fi
          echo "The scenario suite passed on tree $TREE in run $RUN."
          echo "sha=$TESTED" >> "$GITHUB_OUTPUT"
          cp .github/scripts/app-hash.sh "$RUNNER_TEMP/app-hash.sh"
          git checkout -q "$TESTED"; TESTED_APP=$(sh "$RUNNER_TEMP/app-hash.sh")
          git checkout -q "$HEAD_SHA"; HEAD_APP=$(sh "$RUNNER_TEMP/app-hash.sh")
          if [ "$TESTED_APP" = "$HEAD_APP" ]; then
            echo "can_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_build=false" >> "$GITHUB_OUTPUT"
            echo "$REF has moved on to $HEAD_SHA with other app changes: a native build, if one is needed, comes from that push's run."
          fi

  fingerprint:
    name: Fingerprint
    needs: check
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.fp.outputs.hash }}
      needs_build: ${{ steps.fp.outputs.needs_build }}
      android_hash: ${{ steps.android.outputs.hash }}
      android_needs_build: ${{ steps.android.outputs.needs_build }}
      dev_ios_hash: ${{ steps.dev.outputs.ios_hash }}
      dev_ios_needs_build: ${{ steps.dev.outputs.ios_needs_build }}
      dev_android_hash: ${{ steps.dev.outputs.android_hash }}
      dev_android_needs_build: ${{ steps.dev.outputs.android_needs_build }}
    steps:
      - name: Require an Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      # Resolving the native config needs the plist, which is gitignored.
      - name: Write the Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$PLIST" | base64 -d > GoogleService-Info.plist

      # A fingerprint has a build if a runner build tagged it (ios-fp/<hash>), or if EAS built it
      # (build 11 and earlier; new, queued and running builds count too).
      - name: Look for a build
        id: fp
        run: |
          HASH=$(eas env:exec production 'npx expo-updates fingerprint:generate --platform ios' --non-interactive | grep '^{' | jq -r .hash)
          if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
            echo "::error::Could not compute the fingerprint."
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/ios-fp/$HASH")" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "A runner build exists for $HASH, publishing an update only."
            exit 0
          fi
          FOUND=$(eas build:list --platform ios --buildProfile production --runtimeVersion "$HASH" \
            --limit 5 --json --non-interactive \
            | jq '[.[] | select(.status == "NEW" or .status == "IN_QUEUE" or .status == "IN_PROGRESS" or .status == "FINISHED")] | length')
          if [ "$FOUND" != "0" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "An EAS build exists for $HASH, publishing an update only."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=New iOS build::Native code changed (fingerprint $HASH). Building on the runner and submitting to TestFlight."
          fi

      # Android (opt-in). Only a runner build counts: there were never EAS builds for Android.
      - name: Look for an Android build
        id: android
        if: ${{ vars.ANDROID_RELEASES == 'true' }}
        run: |
          HASH=$(eas env:exec production 'npx expo-updates fingerprint:generate --platform android' --non-interactive | grep '^{' | jq -r .hash)
          if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
            echo "::error::Could not compute the Android fingerprint."
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/android-fp/$HASH")" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "An Android build exists for $HASH, publishing an update only."
          elif [ "${{ vars.ANDROID_SUBMIT }}" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=New Android build::Native code changed (fingerprint $HASH). Building on a Linux runner."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android build by hand::No Play build is tagged for fingerprint $HASH and ANDROID_SUBMIT is off. If native code changed since the build on Play, run EAS Build (android) and upload it in Play Console; the update reaches only binaries with this fingerprint."
          fi

      # Revisely Dev (DEV_APP): its runtimes, from its own config. A failure here leaves the dev side
      # out of this run (its jobs need these outputs) and never fails preview's.
      - name: Look for Revisely Dev builds
        id: dev
        if: ${{ vars.DEV_APP == 'true' }}
        continue-on-error: true
        env:
          APP_VARIANT: dev
          ANDROID_RELEASES: ${{ vars.ANDROID_RELEASES }}
        run: |
          for P in ios android; do
            if [ "$P" = android ] && [ "$ANDROID_RELEASES" != true ]; then continue; fi
            HASH=$(eas env:exec development "npx expo-updates fingerprint:generate --platform $P" --non-interactive | grep '^{' | jq -r .hash)
            if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
              echo "::error::Could not compute Revisely Dev's $P fingerprint."
              exit 1
            fi
            echo "${P}_hash=$HASH" >> "$GITHUB_OUTPUT"
            if [ -n "$(git ls-remote --tags origin "refs/tags/$P-dev-fp/$HASH")" ]; then
              echo "${P}_needs_build=false" >> "$GITHUB_OUTPUT"
              echo "A Revisely Dev $P build exists for $HASH."
            else
              echo "${P}_needs_build=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=New Revisely Dev build ($P)::Fingerprint $HASH has no build yet."
            fi
          done

  build:
    name: Build
    needs: [check, fingerprint]
    if: ${{ !cancelled() && !inputs.dry_run && needs.check.outputs.can_build == 'true' && needs.fingerprint.outputs.needs_build == 'true' }}
    permissions:
      contents: write # pushes the ios-fp/<hash> tag
    uses: ./.github/workflows/ios-build.yml
    with:
      submit: true
      fingerprint: ${{ needs.fingerprint.outputs.hash }}
    secrets: inherit

  # Only once builds go to Google Play by themselves (ANDROID_SUBMIT): a build is tagged when it is
  # uploaded, so before that every push would build again, and no tester would get it. Until then a
  # native change needs EAS Build (android) by hand and an upload in Play Console (the notice says so).
  android-build:
    name: Build (android)
    needs: [check, fingerprint]
    if: ${{ !cancelled() && !inputs.dry_run && needs.check.outputs.can_build == 'true' && vars.ANDROID_RELEASES == 'true' && vars.ANDROID_SUBMIT == 'true' && needs.fingerprint.outputs.android_needs_build == 'true' }}
    permissions:
      contents: write # pushes the android-fp/<hash> tag
      id-token: write # android-build.yml's available job proves itself to playBuildAvailable
    uses: ./.github/workflows/android-build.yml
    with:
      submit: true
      fingerprint: ${{ needs.fingerprint.outputs.android_hash }}
    secrets: inherit

  # Revisely Dev's binaries, when its runtime has none. Preview's update doesn't wait for these.
  dev-build:
    name: Build Revisely Dev
    needs: [check, fingerprint]
    if: ${{ !cancelled() && !inputs.dry_run && needs.check.outputs.can_build == 'true' && vars.DEV_APP == 'true' && needs.fingerprint.outputs.dev_ios_needs_build == 'true' }}
    permissions:
      contents: write # pushes the ios-dev-fp/<hash> tag
    uses: ./.github/workflows/ios-build.yml
    with:
      submit: true
      fingerprint: ${{ needs.fingerprint.outputs.dev_ios_hash }}
      variant: dev
    secrets: inherit

  dev-android-build:
    name: Build Revisely Dev (android)
    needs: [check, fingerprint]
    if: ${{ !cancelled() && !inputs.dry_run && needs.check.outputs.can_build == 'true' && vars.DEV_APP == 'true' && vars.ANDROID_RELEASES == 'true' && vars.DEV_ANDROID_SUBMIT == 'true' && needs.fingerprint.outputs.dev_android_needs_build == 'true' }}
    permissions:
      contents: write # pushes the android-dev-fp/<hash> tag
      id-token: write # asked for by android-build.yml's available job, which never runs for dev
    uses: ./.github/workflows/android-build.yml
    with:
      submit: true
      fingerprint: ${{ needs.fingerprint.outputs.dev_android_hash }}
      variant: dev
    secrets: inherit

  # Published even when the build failed: an update for a fingerprint with no build reaches nobody,
  # and does no harm.
  update:
    name: Publish update
    needs: [check, fingerprint, build, android-build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.fingerprint.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      MESSAGE: ${{ inputs.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write the Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$PLIST" | base64 -d > GoogleService-Info.plist

      - name: eas update (preview)
        env:
          PLATFORM: ${{ vars.ANDROID_RELEASES == 'true' && 'all' || 'ios' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          SKIPPED_BUILD: ${{ needs.check.outputs.can_build != 'true' && (needs.fingerprint.outputs.needs_build == 'true' || (vars.ANDROID_SUBMIT == 'true' && needs.fingerprint.outputs.android_needs_build == 'true')) }}
        run: |
          # Short enough that the hash survives: EAS lists messages cut at 512 characters. A run by
          # hand with no message: the commit's own first line.
          [ -n "$MESSAGE" ] || MESSAGE=$(git log -1 --format=%s HEAD)
          SUBJECT=$(echo "$MESSAGE" | head -n 1 | cut -c 1-300)
          APP=$(.github/scripts/app-hash.sh)
          if [ "$SKIPPED_BUILD" = true ]; then
            echo "::notice title=No build here::Native code changed, and ${{ github.ref_name }} has moved on with other app changes: the newer push's run builds. This update waits for that build."
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: would publish $(git rev-parse HEAD) to preview ($PLATFORM) as: $SUBJECT [app $APP]"
            exit 0
          fi
          eas update --channel preview --environment production --platform "$PLATFORM" \
            --message "$SUBJECT [app $APP]" --non-interactive

      # Source maps for the bundle just published (left in dist/ by eas update), so Sentry shows
      # crashes from updates with file names and line numbers. Skipped without the secret.
      - name: Upload source maps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && !inputs.dry_run }}
        continue-on-error: true
        env:
          SENTRY_ORG: revisely
          SENTRY_PROJECT: react-native
          # Required with org/project, or the script looks for the Sentry plugin's
          # config in app.config.js (deliberately not set there) and gives up.
          SENTRY_URL: https://sentry.io/
        run: npx sentry-expo-upload-sourcemaps dist

  # Revisely Dev's update: the same commit, after preview's, on the `dev` channel, with the dev
  # project's config (EAS development environment) and APP_VARIANT=dev, so it runs only on Revisely
  # Dev's runtime. Published even when its build failed, as preview's is.
  dev-update:
    name: Publish Revisely Dev update
    needs: [check, fingerprint, update, dev-build, dev-android-build]
    if: ${{ !cancelled() && vars.DEV_APP == 'true' && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      MESSAGE: ${{ inputs.message }}
      APP_VARIANT: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write Revisely Dev's Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV }}
        run: |
          if [ -z "$PLIST" ]; then
            echo "::error::Add the GOOGLE_SERVICE_INFO_PLIST_DEV repository secret (base64 of the dev project's plist), or turn DEV_APP off."
            exit 1
          fi
          echo "$PLIST" | base64 -d > GoogleService-Info.plist

      - name: eas update (dev)
        env:
          PLATFORM: ${{ vars.ANDROID_RELEASES == 'true' && 'all' || 'ios' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          [ -n "$MESSAGE" ] || MESSAGE=$(git log -1 --format=%s HEAD)
          SUBJECT=$(echo "$MESSAGE" | head -n 1 | cut -c 1-300)
          APP=$(.github/scripts/app-hash.sh)
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: would publish $(git rev-parse HEAD) to dev ($PLATFORM) as: $SUBJECT [app $APP]"
            exit 0
          fi
          eas update --channel dev --environment development --platform "$PLATFORM" \
            --message "$SUBJECT [app $APP]" --non-interactive

      - name: Upload source maps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && !inputs.dry_run }}
        continue-on-error: true
        env:
          SENTRY_ORG: revisely
          SENTRY_PROJECT: react-native
          SENTRY_URL: https://sentry.io/
        run: npx sentry-expo-upload-sourcemaps dist
