name: Preview

# Every push to develop goes to TestFlight first: its JavaScript and assets are published as an
# over-the-air update on the `preview` channel, plus a new TestFlight build whenever the push changed
# native code. TestFlight installs follow `preview` (src/lib/updateChannel.ts); App Store installs
# follow `production`, which only ever gets an update from here once it has been tried in TestFlight
# and promoted unchanged (promote.yml, on a merge of develop into main).
#
# Each update's message ends with "[app <hash>]", a hash of every file that goes into the app
# (.github/scripts/app-hash.sh), so promote.yml can find exactly the update that was tested for what
# it is asked to release. Docs, store and scripts changes don't change it.
#
# The runtime version is a fingerprint of the native side (app.config.js, fingerprint.config.js), and
# an update reaches only binaries with the same one. So before publishing, the fingerprint is looked
# up; one with no build gets a build on a GitHub macOS runner (ios-build.yml, no EAS build credits),
# submitted to TestFlight. Raise `version` in app.config.js with any native change: the new binary is
# what goes to App Store review (manually) once tested.
#
# Config values (Firebase keys, client ids, Sentry) come from the `production` environment on EAS,
# the same one production builds read, so an update carries the config its binary was built with.
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'functions/**'
      - '.maestro/**'
      - 'store/**'
      - 'scripts/**'
      - '**/*.md'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: eas-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fingerprint:
    name: Fingerprint
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.fp.outputs.hash }}
      needs_build: ${{ steps.fp.outputs.needs_build }}
    steps:
      - name: Require an Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      # Resolving the native config needs the plist, which is gitignored.
      - name: Write the Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$PLIST" | base64 -d > GoogleService-Info.plist

      # A fingerprint has a build if a runner build tagged it (ios-fp/<hash>), or if EAS built it
      # (build 11 and earlier; new, queued and running builds count too).
      - name: Look for a build
        id: fp
        run: |
          HASH=$(eas env:exec production 'npx expo-updates fingerprint:generate --platform ios' --non-interactive | grep '^{' | jq -r .hash)
          if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
            echo "::error::Could not compute the fingerprint."
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/ios-fp/$HASH")" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "A runner build exists for $HASH, publishing an update only."
            exit 0
          fi
          FOUND=$(eas build:list --platform ios --buildProfile production --runtimeVersion "$HASH" \
            --limit 5 --json --non-interactive \
            | jq '[.[] | select(.status == "NEW" or .status == "IN_QUEUE" or .status == "IN_PROGRESS" or .status == "FINISHED")] | length')
          if [ "$FOUND" != "0" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "An EAS build exists for $HASH, publishing an update only."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=New iOS build::Native code changed (fingerprint $HASH). Building on the runner and submitting to TestFlight."
          fi

  build:
    name: Build
    needs: fingerprint
    if: ${{ needs.fingerprint.outputs.needs_build == 'true' }}
    permissions:
      contents: write # pushes the ios-fp/<hash> tag
    uses: ./.github/workflows/ios-build.yml
    with:
      submit: true
      fingerprint: ${{ needs.fingerprint.outputs.hash }}
    secrets: inherit

  # Published even when the build failed: an update for a fingerprint with no build reaches nobody,
  # and does no harm.
  update:
    name: Publish update
    needs: [fingerprint, build]
    if: ${{ !cancelled() && needs.fingerprint.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # First line only: EAS caps an update's message at 1024 characters.
      MESSAGE: ${{ github.event.head_commit.message || format('Manual update from {0}', github.ref_name) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write the Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$PLIST" | base64 -d > GoogleService-Info.plist

      - name: eas update (preview)
        run: |
          # Short enough that the hash survives: EAS lists messages cut at 512 characters.
          SUBJECT=$(echo "$MESSAGE" | head -n 1 | cut -c 1-300)
          APP=$(.github/scripts/app-hash.sh)
          eas update --channel preview --environment production --platform ios \
            --message "$SUBJECT [app $APP]" --non-interactive

      # Source maps for the bundle just published (left in dist/ by eas update), so Sentry shows
      # crashes from updates with file names and line numbers. Skipped without the secret.
      - name: Upload source maps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        continue-on-error: true
        env:
          SENTRY_ORG: revisely
          SENTRY_PROJECT: react-native
          # Required with org/project, or the script looks for the Sentry plugin's
          # config in app.config.js (deliberately not set there) and gives up.
          SENTRY_URL: https://sentry.io/
        run: npx sentry-expo-upload-sourcemaps dist
