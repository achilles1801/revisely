name: Preview

# Every push to develop goes to TestFlight first: its JavaScript and assets are published as an
# over-the-air update on the `preview` channel, plus a new TestFlight build whenever the push changed
# native code. TestFlight installs follow `preview` (src/lib/updateChannel.ts); App Store installs
# follow `production`, which only ever gets an update from here once it has been tried in TestFlight
# and promoted unchanged (promote.yml, on a merge of develop into main).
#
# Each update's message ends with "[app <hash>]", a hash of every file that goes into the app
# (.github/scripts/app-hash.sh), so promote.yml can find exactly the update that was tested for what
# it is asked to release. Docs, store and scripts changes don't change it.
#
# The runtime version is a fingerprint of the native side (app.config.js, fingerprint.config.js), and
# an update reaches only binaries with the same one. So before publishing, the fingerprint is looked
# up; one with no build gets a build on a GitHub macOS runner (ios-build.yml, no EAS build credits),
# submitted to TestFlight. Raise `version` in app.config.js with any native change: the new binary is
# what goes to App Store review (manually) once tested.
#
# Config values (Firebase keys, client ids, Sentry) come from the `production` environment on EAS,
# the same one production builds read, so an update carries the config its binary was built with.
#
# Android works the same way when the repository variable ANDROID_RELEASES is 'true' (Settings >
# Secrets and variables > Actions > Variables; on since Nov 1 2026): its fingerprint is looked up too
# (tag android-fp/<hash>), a Linux runner builds one with no build and uploads it to Google Play's
# internal testing track (android-build.yml, when ANDROID_SUBMIT is 'true'), and the update is
# published for both platforms. The two runtimes differ, so EAS makes one update group per platform,
# both with the same [app <hash>]; promote.yml promotes them together. Android testers follow
# `preview` by their account alone (updateChannel.ts).
#
# Two halves, one file. A push runs the testing half (gate, scenarios); once it passes, it starts
# this workflow again by hand (workflow_dispatch) with `publish` = the commit it tested, which runs
# the publishing half (fingerprint, builds, update). Testing runs go one at a time per branch and
# are never cancelled once started: a push that comes meanwhile waits, and a newer push takes the
# waiting one's place before it starts (GitHub keeps one waiting run per concurrency group). So in a
# burst of merges each finished run publishes, and the newest push is always the next one tested:
# its tree holds everything the skipped ones do. Until Nov 8 2026 a newer push cancelled the running
# test instead, and a burst (7 merges in 30 minutes) cancelled every run: nothing reached testers
# for hours. Publishing runs are one at a time (eas-preview) and never cancelled, so updates go out
# in order and a native build is never started twice. Before (Nov 7 2026) the whole run held
# eas-preview, and in a burst of merges each push waited for every older push's scenario run first:
# 19–24 minutes from a merge to its update instead of 5–15. One file because GitHub dispatches only
# workflows that are on the default branch (main) already.
#
# The publishing half checks for itself that the scenario suite passed on the commit's tree, and
# that the commit is on the branch, so a run by hand can't skip the gate. `dry_run` (by hand) goes
# through both halves without building or publishing anything.
#
# Revisely Dev (CLAUDE.md "Dev stack"), when the repository variable DEV_APP is 'true': the second
# app, on the dev Firebase project, on its own `dev` channel. A merged PR whose own CI passed reaches
# it at the merge (dev-at-merge.yml, Majd, Nov 23 2026); this workflow publishes to dev only what that
# didn't (a push with no PR, a native change). Its runtimes are its own (APP_VARIANT=dev, the EAS
# development environment), so its binaries are built here when they're missing (tags
# ios-dev-fp/<hash>, android-dev-fp/<hash>; Android only once DEV_ANDROID_SUBMIT is on, after its first
# bundle went to Play Console by hand). Those builds and Dev's update run in a lane of their own: the
# publishing half starts this workflow again with `dev` = the commit (`Preview · Dev <sha>`, group
# eas-dev-builds, one run at a time, so a native build never starts twice), and finishes without waiting.
# Until Nov 23 2026 a Dev build held eas-preview: #936's waited for a Mac with #937's preview update
# queued behind it. Nothing on the dev side can stop or change preview's update, and Promote reads only
# the preview branch.
run-name: ${{ inputs.dev && format('Preview · Dev {0}', inputs.dev) || inputs.publish && format('Preview · publish {0}', inputs.publish) || '' }}
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'functions/**'
      - 'worker/**'
      - 'admin/**'
      - 'wrangler*.jsonc'
      - '.maestro/**'
      - 'store/**'
      - 'scripts/**'
      - '**/*.md'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publishing half only, for this tested commit (the testing half starts it; leave empty)
        required: false
        default: ''
      dev:
        description: Revisely Dev's builds and update only, for this tested commit (the publishing half starts it; leave empty)
        required: false
        default: ''
      message:
        description: The update's message (with publish or dev; the push's first line)
        required: false
        default: ''
      dry_run:
        description: Build and publish nothing (to try the workflow itself)
        type: boolean
        default: false

# Testing: one at a time per branch, and a started run finishes (a newer push replaces only a run
# still waiting). Publishing: one at a time, never cancelled. Revisely Dev's half: its own lane, the same way.
concurrency:
  group: ${{ inputs.dev && (inputs.dry_run && 'eas-dev-builds-dry-run' || 'eas-dev-builds') || inputs.publish && (inputs.dry_run && 'eas-preview-dry-run' || 'eas-preview') || format('preview-tests-{0}{1}', github.ref, inputs.dry_run && '-dry-run' || '') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing is built or published unless the scenario tests pass (BEHAVIOUR.md): here, or on
  # exactly this tree. A PR merged with nothing else landing meanwhile has a merge commit whose
  # tree is the one its CI tested (refs/pull/N/merge); that run kept an artifact named after the
  # tree (scenarios.yml). Same tree, same suite, same result: the suite isn't run again, and the
  # update reaches TestFlight about ten minutes sooner. Only this repository's own runs count (a
  # fork's PR runs its own workflow files).
  gate:
    name: Scenarios passed on this tree already?
    if: ${{ !inputs.publish && !inputs.dev }}
    runs-on: ubuntu-latest
    # Seconds of work. Short, because a newer push's run waits for this one to stop: a job cancelled
    # before its runner had started it sat until its timeout (two runs dispatched a second apart).
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TREE=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null || true)
          RUN=""
          if [ -n "$TREE" ]; then
            RUN=$(gh api "repos/$REPO/actions/artifacts?name=scenarios-passed-$TREE&per_page=30" \
              --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | first | .workflow_run.id // empty' 2>/dev/null || true)
          fi
          if [ -n "$RUN" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Scenarios::This tree ($TREE) passed the scenario suite in run $RUN: not run again."
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "No passing run of the scenario suite on tree ${TREE:-?}: running it."
          fi

  scenarios:
    name: Scenarios
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.tested != 'true' }}
    uses: ./.github/workflows/scenarios.yml

  # Tested: the publishing half takes it from here, in its turn.
  handover:
    name: Hand over to publishing
    needs: [gate, scenarios]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.gate.outputs.tested == 'true' || needs.scenarios.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write # the develop-red issue, below
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message || format('Manual update from {0}', github.ref_name) }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          # First line only, short enough that the hash survives: EAS caps an update's message at
          # 1024 characters and lists them cut at 512.
          SUBJECT=$(printf '%s\n' "$MESSAGE" | head -n 1 | cut -c 1-300)
          gh workflow run preview.yml --repo "$REPO" --ref "$REF" \
            -f publish="$SHA" -f message="$SUBJECT" -f dry_run="$DRY_RUN"
          echo "::notice title=Preview::Tested. Publishing $SHA is queued (Preview · publish $SHA)."

      # The suite passed on what landed: clears its line in the develop-red issue, if it was red. After
      # the hand-over, and a failure here changes nothing.
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        continue-on-error: true
        with:
          sparse-checkout: |
            scripts
            .github
            .maestro
      - name: Scenarios in the develop-red issue
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MENTION: '@${{ github.repository_owner }}'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          SCENARIOS: 'true:true:success'
        run: node scripts/e2e/develop-red.js

  # The suite failed on what landed. Revisely Dev may already have it (dev-at-merge.yml), so this says
  # so at once: the develop-red issue, with the PRs merged since the suite last passed.
  scenarios-red:
    name: Scenarios (develop-red issue)
    needs: [gate, scenarios]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.scenarios.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            .github
            .maestro
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          MENTION: '@${{ github.repository_owner }}'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          SCENARIOS: 'true:true:failure'
        run: node scripts/e2e/develop-red.js

  # The publishing half (a run with `publish`), on one machine when no native build is needed: is that
  # commit tested and on this branch, its fingerprints, preview's update, then Revisely Dev's. Until
  # Nov 23 2026 these were four jobs, each waiting for a machine and installing the app again (16.8
  # minutes for one publish on Nov 22, 9.9 of them waiting). Builds use the branch as it is now
  # (ios-build.yml and android-build.yml check out this run's commit), so they run only if what goes
  # into the app there is what was tested; otherwise a newer push changed the app, and its own run builds.
  # When a store build is needed, preview's update waits for it (the job `update`). Revisely Dev's part
  # is handed to its own lane at the end, so nothing on the Dev side can stop or delay preview.
  publish:
    name: Tested? Fingerprint and publish to preview
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # reads the scenario artifact, and starts Revisely Dev's half
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      hash: ${{ steps.fp.outputs.hash }}
      android_hash: ${{ steps.android.outputs.hash }}
      build_ios: ${{ steps.plan.outputs.build_ios }}
      build_android: ${{ steps.plan.outputs.build_android }}
      update_after_build: ${{ steps.plan.outputs.update_after_build }}
    steps:
      - name: Require an Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tested?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED: ${{ inputs.publish }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: sh .github/scripts/publish-check.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      # Resolving the native config needs the plist, which is gitignored.
      - name: Write the Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$PLIST" | base64 -d > GoogleService-Info.plist

      # A fingerprint has a build if a runner build tagged it (ios-fp/<hash>), or if EAS built it
      # (build 11 and earlier; new, queued and running builds count too).
      - name: Look for a build
        id: fp
        run: |
          HASH=$(eas env:exec production 'npx expo-updates fingerprint:generate --platform ios' --non-interactive | grep '^{' | jq -r .hash)
          if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
            echo "::error::Could not compute the fingerprint."
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/ios-fp/$HASH")" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "A runner build exists for $HASH, publishing an update only."
            exit 0
          fi
          FOUND=$(eas build:list --platform ios --buildProfile production --runtimeVersion "$HASH" \
            --limit 5 --json --non-interactive \
            | jq '[.[] | select(.status == "NEW" or .status == "IN_QUEUE" or .status == "IN_PROGRESS" or .status == "FINISHED")] | length')
          if [ "$FOUND" != "0" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "An EAS build exists for $HASH, publishing an update only."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=New iOS build::Native code changed (fingerprint $HASH). Building on the runner and submitting to TestFlight."
          fi

      # Android (opt-in). Only a runner build counts: there were never EAS builds for Android.
      - name: Look for an Android build
        id: android
        if: ${{ vars.ANDROID_RELEASES == 'true' }}
        run: |
          HASH=$(eas env:exec production 'npx expo-updates fingerprint:generate --platform android' --non-interactive | grep '^{' | jq -r .hash)
          if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
            echo "::error::Could not compute the Android fingerprint."
            exit 1
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/android-fp/$HASH")" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "An Android build exists for $HASH, publishing an update only."
          elif [ "${{ vars.ANDROID_SUBMIT }}" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=New Android build::Native code changed (fingerprint $HASH). Building on a Linux runner."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android build by hand::No Play build is tagged for fingerprint $HASH and ANDROID_SUBMIT is off. If native code changed since the build on Play, run EAS Build (android) and upload it in Play Console; the update reaches only binaries with this fingerprint."
          fi

      # What this run builds for the store app, and so whether preview's update goes out here or
      # after the build (the job `update`).
      - name: Builds, or publish now
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          CAN_BUILD: ${{ steps.check.outputs.can_build }}
          IOS: ${{ steps.fp.outputs.needs_build }}
          ANDROID: ${{ steps.android.outputs.needs_build }}
          ANDROID_RELEASES: ${{ vars.ANDROID_RELEASES }}
          ANDROID_SUBMIT: ${{ vars.ANDROID_SUBMIT }}
          REF: ${{ github.ref_name }}
        run: |
          build_ios=false; build_android=false
          if [ "$CAN_BUILD" = true ] && [ "$DRY_RUN" != true ]; then
            [ "$IOS" = true ] && build_ios=true
            [ "$ANDROID_RELEASES" = true ] && [ "$ANDROID_SUBMIT" = true ] && [ "$ANDROID" = true ] && build_android=true
          fi
          if [ "$CAN_BUILD" != true ] && { [ "$IOS" = true ] || { [ "$ANDROID_SUBMIT" = true ] && [ "$ANDROID" = true ]; }; }; then
            echo "::notice title=No build here::Native code changed, and $REF has moved on with other app changes: the newer push's run builds. This update waits for that build."
          fi
          update_after_build=false
          if [ "$build_ios" = true ] || [ "$build_android" = true ]; then update_after_build=true; fi
          echo "iOS build: $build_ios, Android build: $build_android, preview's update after them: $update_after_build"
          { echo "build_ios=$build_ios"; echo "build_android=$build_android"; echo "update_after_build=$update_after_build"; } >> "$GITHUB_OUTPUT"

      - name: eas update (preview)
        id: preview
        if: ${{ steps.plan.outputs.update_after_build == 'false' }}
        env:
          MESSAGE: ${{ inputs.message }}
          PLATFORM: ${{ vars.ANDROID_RELEASES == 'true' && 'all' || 'ios' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: sh "$RUNNER_TEMP/publish-update.sh" preview production

      # Revisely Dev (DEV_APP): its runtimes, from its own config, after preview's update. A failure
      # here leaves the dev side out of this run and never fails preview's.
      - name: Clear preview's bundle
        if: ${{ !cancelled() && vars.DEV_APP == 'true' && steps.plan.outcome == 'success' }}
        run: rm -rf dist .expo

      - name: Look for Revisely Dev builds
        id: dev
        if: ${{ !cancelled() && vars.DEV_APP == 'true' && steps.plan.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          APP_VARIANT: dev
          ANDROID_RELEASES: ${{ vars.ANDROID_RELEASES }}
        run: |
          for P in ios android; do
            if [ "$P" = android ] && [ "$ANDROID_RELEASES" != true ]; then continue; fi
            HASH=$(eas env:exec development "npx expo-updates fingerprint:generate --platform $P" --non-interactive | grep '^{' | jq -r .hash)
            if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
              echo "::error::Could not compute Revisely Dev's $P fingerprint."
              exit 1
            fi
            echo "${P}_hash=$HASH" >> "$GITHUB_OUTPUT"
            if [ -n "$(git ls-remote --tags origin "refs/tags/$P-dev-fp/$HASH")" ]; then
              echo "${P}_needs_build=false" >> "$GITHUB_OUTPUT"
              echo "A Revisely Dev $P build exists for $HASH."
            else
              echo "${P}_needs_build=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=New Revisely Dev build ($P)::Fingerprint $HASH has no build yet."
            fi
          done

      # Whether Dev still needs anything for this commit. It usually has it (dev-at-merge.yml): then
      # nothing more runs.
      - name: Does Revisely Dev need a build or this update
        id: plan-dev
        if: ${{ !cancelled() && vars.DEV_APP == 'true' && steps.plan.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED: ${{ steps.check.outputs.sha }}
          DEV_IOS: ${{ steps.dev.outputs.ios_needs_build }}
          DEV_ANDROID: ${{ steps.dev.outputs.android_needs_build }}
          ANDROID_RELEASES: ${{ vars.ANDROID_RELEASES }}
          DEV_ANDROID_SUBMIT: ${{ vars.DEV_ANDROID_SUBMIT }}
          AFTER_BUILD: ${{ steps.plan.outputs.update_after_build }}
          PREVIEW: ${{ steps.preview.outcome }}
          PLATFORM: ${{ vars.ANDROID_RELEASES == 'true' && 'all' || 'ios' }}
          DEV_IOS_RUNTIME: ${{ steps.dev.outputs.ios_hash }}
          DEV_ANDROID_RUNTIME: ${{ steps.dev.outputs.android_hash }}
        run: |
          build=false
          [ "$DEV_IOS" = true ] && build=true
          [ "$ANDROID_RELEASES" = true ] && [ "$DEV_ANDROID_SUBMIT" = true ] && [ "$DEV_ANDROID" = true ] && build=true
          dev_needed=true
          if [ "$AFTER_BUILD" != true ] && [ "$PREVIEW" != success ]; then
            dev_needed=false # preview's update failed: Dev doesn't go first
          elif [ "$build" = false ]; then
            going=$(gh api "repos/$REPO/actions/workflows/dev-at-merge.yml/runs?head_sha=$TESTED&per_page=10" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            if [ "$going" -gt 0 ]; then
              dev_needed=false
              echo "Revisely Dev at merge is publishing this commit."
            elif sh "$RUNNER_TEMP/publish-update.sh" dev development check | grep -qx 'needed=false'; then
              dev_needed=false
              echo "The dev channel already has this commit or a newer one."
            fi
          fi
          echo "Revisely Dev: a build needed: $build, its lane needed: $dev_needed"
          echo "dev_needed=$dev_needed" >> "$GITHUB_OUTPUT"

      # The last step: this run doesn't wait for Dev, and a failure here changes nothing for preview.
      - name: Hand Revisely Dev's part to its own lane
        if: ${{ steps.plan-dev.outputs.dev_needed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ steps.check.outputs.sha }}
          MESSAGE: ${{ inputs.message }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          gh workflow run preview.yml --repo "$REPO" --ref "$REF" \
            -f dev="$SHA" -f message="$MESSAGE" -f dry_run="$DRY_RUN"
          echo "::notice title=Revisely Dev::Its builds and update for $SHA are queued (Preview · Dev $SHA)."

  build:
    name: Build
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.build_ios == 'true' }}
    permissions:
      contents: write # pushes the ios-fp/<hash> tag
    uses: ./.github/workflows/ios-build.yml
    with:
      submit: true
      fingerprint: ${{ needs.publish.outputs.hash }}
    secrets: inherit

  # Only once builds go to Google Play by themselves (ANDROID_SUBMIT): a build is tagged when it is
  # uploaded, so before that every push would build again, and no tester would get it. Until then a
  # native change needs EAS Build (android) by hand and an upload in Play Console (the notice says so).
  android-build:
    name: Build (android)
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.build_android == 'true' }}
    permissions:
      contents: write # pushes the android-fp/<hash> tag
      id-token: write # android-build.yml's available job proves itself to playBuildAvailable
    uses: ./.github/workflows/android-build.yml
    with:
      submit: true
      fingerprint: ${{ needs.publish.outputs.android_hash }}
    secrets: inherit

  # Preview's update when this run built for the store app. Published even when the build failed: an
  # update for a fingerprint with no build reaches nobody, and does no harm.
  update:
    name: Publish update (after the build)
    needs: [publish, build, android-build]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.update_after_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # The run's own commit first, for its copy of the script; then the commit being published.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          cp .github/scripts/publish-update.sh "$RUNNER_TEMP/"
          git checkout -q "$SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write the Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$PLIST" | base64 -d > GoogleService-Info.plist

      - name: eas update (preview)
        env:
          MESSAGE: ${{ inputs.message }}
          PLATFORM: ${{ vars.ANDROID_RELEASES == 'true' && 'all' || 'ios' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: sh "$RUNNER_TEMP/publish-update.sh" preview production

  # Revisely Dev's half (a run with `dev`), in its own lane: is that commit tested, which platforms lack
  # a build, those builds, then Dev's update. The lane is the workflow's concurrency group, so builds
  # go one run at a time, and a run that waited sees the tags the run before it pushed: a native build
  # never starts twice.
  dev-plan:
    name: 'Revisely Dev: tested? Fingerprints'
    if: ${{ inputs.dev && vars.DEV_APP == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      ios_hash: ${{ steps.fp.outputs.ios_hash }}
      android_hash: ${{ steps.fp.outputs.android_hash }}
      build_ios: ${{ steps.plan.outputs.build_ios }}
      build_android: ${{ steps.plan.outputs.build_android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tested?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED: ${{ inputs.dev }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: sh .github/scripts/publish-check.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write Revisely Dev's Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV }}
        run: |
          if [ -z "$PLIST" ]; then
            echo "::error::Add the GOOGLE_SERVICE_INFO_PLIST_DEV repository secret (base64 of the dev project's plist), or turn DEV_APP off."
            exit 1
          fi
          echo "$PLIST" | base64 -d > GoogleService-Info.plist

      - name: Look for Revisely Dev builds
        id: fp
        env:
          APP_VARIANT: dev
          ANDROID_RELEASES: ${{ vars.ANDROID_RELEASES }}
        run: |
          for P in ios android; do
            if [ "$P" = android ] && [ "$ANDROID_RELEASES" != true ]; then continue; fi
            HASH=$(eas env:exec development "npx expo-updates fingerprint:generate --platform $P" --non-interactive | grep '^{' | jq -r .hash)
            if [ -z "$HASH" ] || [ "$HASH" = "null" ]; then
              echo "::error::Could not compute Revisely Dev's $P fingerprint."
              exit 1
            fi
            echo "${P}_hash=$HASH" >> "$GITHUB_OUTPUT"
            if [ -n "$(git ls-remote --tags origin "refs/tags/$P-dev-fp/$HASH")" ]; then
              echo "${P}_needs_build=false" >> "$GITHUB_OUTPUT"
              echo "A Revisely Dev $P build exists for $HASH."
            else
              echo "${P}_needs_build=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=New Revisely Dev build ($P)::Fingerprint $HASH has no build yet."
            fi
          done

      - name: What this run builds
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          CAN_BUILD: ${{ steps.check.outputs.can_build }}
          IOS: ${{ steps.fp.outputs.ios_needs_build }}
          ANDROID: ${{ steps.fp.outputs.android_needs_build }}
          ANDROID_RELEASES: ${{ vars.ANDROID_RELEASES }}
          DEV_ANDROID_SUBMIT: ${{ vars.DEV_ANDROID_SUBMIT }}
        run: |
          build_ios=false; build_android=false
          if [ "$CAN_BUILD" = true ] && [ "$DRY_RUN" != true ]; then
            [ "$IOS" = true ] && build_ios=true
            [ "$ANDROID_RELEASES" = true ] && [ "$DEV_ANDROID_SUBMIT" = true ] && [ "$ANDROID" = true ] && build_android=true
          fi
          echo "Revisely Dev: iOS build $build_ios, Android build $build_android"
          { echo "build_ios=$build_ios"; echo "build_android=$build_android"; } >> "$GITHUB_OUTPUT"

  dev-build:
    name: Build Revisely Dev
    needs: dev-plan
    if: ${{ !cancelled() && needs.dev-plan.outputs.build_ios == 'true' }}
    permissions:
      contents: write # pushes the ios-dev-fp/<hash> tag
    uses: ./.github/workflows/ios-build.yml
    with:
      submit: true
      fingerprint: ${{ needs.dev-plan.outputs.ios_hash }}
      variant: dev
    secrets: inherit

  dev-android-build:
    name: Build Revisely Dev (android)
    needs: dev-plan
    if: ${{ !cancelled() && needs.dev-plan.outputs.build_android == 'true' }}
    permissions:
      contents: write # pushes the android-dev-fp/<hash> tag
      id-token: write # asked for by android-build.yml's available job, which never runs for dev
    uses: ./.github/workflows/android-build.yml
    with:
      submit: true
      fingerprint: ${{ needs.dev-plan.outputs.android_hash }}
      variant: dev
    secrets: inherit

  # The same commit on the `dev` channel, with the dev project's config (EAS development environment)
  # and APP_VARIANT=dev, so it runs only on Revisely Dev's runtime. Published even when its build failed,
  # as preview's is. It takes eas-dev's turn, then publish-update.sh checks whether Dev has it already.
  dev-update:
    name: Publish Revisely Dev update
    needs: [dev-plan, dev-build, dev-android-build]
    if: ${{ !cancelled() && needs.dev-plan.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.dry_run && 'eas-dev-dry-run' || 'eas-dev' }}
      cancel-in-progress: false
    env:
      APP_VARIANT: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          SHA: ${{ needs.dev-plan.outputs.sha }}
        run: |
          cp .github/scripts/publish-update.sh "$RUNNER_TEMP/"
          git checkout -q "$SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write Revisely Dev's Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV }}
        run: |
          if [ -z "$PLIST" ]; then
            echo "::error::Add the GOOGLE_SERVICE_INFO_PLIST_DEV repository secret (base64 of the dev project's plist), or turn DEV_APP off."
            exit 1
          fi
          echo "$PLIST" | base64 -d > GoogleService-Info.plist

      - name: eas update (dev)
        env:
          MESSAGE: ${{ inputs.message }}
          PLATFORM: ${{ vars.ANDROID_RELEASES == 'true' && 'all' || 'ios' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          DEV_IOS_RUNTIME: ${{ needs.dev-plan.outputs.ios_hash }}
          DEV_ANDROID_RUNTIME: ${{ needs.dev-plan.outputs.android_hash }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: sh "$RUNNER_TEMP/publish-update.sh" dev development
