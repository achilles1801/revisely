name: Android build

# Builds the production Android app bundle (.aab) on a GitHub Linux runner (`eas build --local`)
# (or, with variant `dev`, Revisely Dev's: CLAUDE.md "Dev stack"; its own Play app, google-services.json
# from GOOGLE_SERVICES_JSON_DEV, profile `dev`, uploads only when DEV_ANDROID_SUBMIT is 'true', tag
# android-dev-fp/<hash>, and never the "offer it to testers" job, which writes production's config/app)
# and uploads it to Google Play's internal testing track (`eas submit`), released to its testers at
# once, as TestFlight's Team (Expo) group gets every iOS build. Local builds use no EAS build credits,
# and Linux runners cost nothing on a public repository. Called by Preview (preview.yml, native code
# changed on develop) and by EAS Build (by hand). See "Android" in CLAUDE.md.
#
# Signing: the upload keystore stays on EAS and is fetched with EXPO_TOKEN (created once with
# `eas credentials --platform android`). Google Play: the service account key (eas-play-submit,
# testing tracks only, no production rights) is the PLAY_SERVICE_ACCOUNT_JSON repository secret
# (base64). It is written to a file only for the upload step, after the build, so no code from the
# repository runs while it is on disk, and eas.json reads its path from PLAY_SERVICE_ACCOUNT_KEY_PATH.
# Submission runs only when the repository variable ANDROID_SUBMIT is 'true'.
# Once submitted, the available job tells phones (config/app testing.android, see below).
# google-services.json is gitignored, so it comes from the GOOGLE_SERVICES_JSON repository secret
# (base64) and is passed by path (GOOGLE_SERVICES_JSON, app.config.js); fingerprint.config.js ignores
# it wherever it is, so the runtime matches the one Preview computed.
on:
  workflow_call:
    inputs:
      submit:
        description: Upload the bundle to Google Play (internal testing)
        type: boolean
        default: true
      fingerprint:
        description: Android fingerprint of this commit; tagged android-fp/<hash> (android-dev-fp/<hash>) once submitted
        type: string
        default: ''
      variant:
        description: store (Revisely) or dev (Revisely Dev)
        type: string
        default: store
    secrets:
      EXPO_TOKEN:
        required: true
      GOOGLE_SERVICES_JSON:
        required: true
      GOOGLE_SERVICES_JSON_DEV:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false

jobs:
  build:
    name: Build and submit (android${{ inputs.variant == 'dev' && ', Revisely Dev' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Revisely Dev: app.config.js reads it wherever the config is resolved here. Empty: the store app.
      APP_VARIANT: ${{ inputs.variant == 'dev' && 'dev' || '' }}
      PROFILE: ${{ inputs.variant == 'dev' && 'dev' || 'production' }}
      TAG_PREFIX: ${{ inputs.variant == 'dev' && 'android-dev-fp' || 'android-fp' }}
      # Uploads to Google Play: the store app's when ANDROID_SUBMIT is on, Revisely Dev's when
      # DEV_ANDROID_SUBMIT is (its first upload goes through Play Console by hand).
      SUBMIT_ON: ${{ (inputs.variant == 'dev' && vars.DEV_ANDROID_SUBMIT == 'true') || (inputs.variant != 'dev' && vars.ANDROID_SUBMIT == 'true') }}
    steps:
      - name: Require the Firebase config
        env:
          VARIANT: ${{ inputs.variant }}
          JSON: ${{ inputs.variant == 'dev' && secrets.GOOGLE_SERVICES_JSON_DEV || secrets.GOOGLE_SERVICES_JSON }}
        run: |
          case "$VARIANT" in store|dev) ;; *) echo "::error::variant: store or dev, not '$VARIANT'"; exit 1 ;; esac
          if [ -z "$JSON" ]; then
            echo "::error::Add the repository secret with base64 of google-services.json (Firebase Console > Project settings > the Android app): GOOGLE_SERVICES_JSON, or GOOGLE_SERVICES_JSON_DEV for Revisely Dev."
            exit 1
          fi

      # An Android build needs about 15 GB; the image ships tools this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/emulator "$AGENT_TOOLSDIRECTORY/CodeQL" && df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # React Native 0.81 builds with JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle's default 2 GB ran out of memory in lint (lintVitalAnalyzeRelease) on a release build.
      # The user-level file wins over the project's gradle.properties, which prebuild writes.
      - name: Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write google-services.json
        env:
          JSON: ${{ inputs.variant == 'dev' && secrets.GOOGLE_SERVICES_JSON_DEV || secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$JSON" | base64 -d > "$RUNNER_TEMP/google-services.json"

      - name: eas build --local
        env:
          GOOGLE_SERVICES_JSON: ${{ runner.temp }}/google-services.json
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: revisely
          SENTRY_PROJECT: react-native
          SENTRY_URL: https://sentry.io/
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
          # A failed upload costs readable stack traces, not the release.
          SENTRY_ALLOW_FAILURE: 'true'
        run: eas build --local --profile "$PROFILE" --platform android --non-interactive --output "$RUNNER_TEMP/revisely.aab"

      # For the first upload, which Google Play takes only through Play Console, and for a look
      # without Play. The repository is public, so anyone signed in to GitHub can download it while
      # it is kept (an .aab holds nothing that the app on Play won't).
      - uses: actions/upload-artifact@v4
        with:
          name: revisely-${{ inputs.variant == 'dev' && 'dev-' || '' }}android-${{ github.sha }}
          path: ${{ runner.temp }}/revisely.aab
          retention-days: 7

      # Released to internal testers at once (releaseStatus completed in eas.json). Closed testing and
      # production take the same bundle later, by hand: scripts/play.js promote (CLAUDE.md, Android).
      - name: eas submit (Google Play, internal testing)
        if: ${{ inputs.submit && env.SUBMIT_ON == 'true' }}
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add a PLAY_SERVICE_ACCOUNT_JSON repository secret: base64 of the eas-play-submit service account key (CLAUDE.md, Android)."
            exit 1
          fi
          export PLAY_SERVICE_ACCOUNT_KEY_PATH="$RUNNER_TEMP/play-service-account.json"
          trap 'rm -f "$PLAY_SERVICE_ACCOUNT_KEY_PATH"' EXIT
          (umask 077 && echo "$KEY" | base64 -d > "$PLAY_SERVICE_ACCOUNT_KEY_PATH")
          eas submit --platform android --profile "$PROFILE" --path "$RUNNER_TEMP/revisely.aab" --non-interactive

      # The marker preview.yml looks for: local builds are not listed by `eas build:list`, so this tag
      # is how it knows the fingerprint has a build on Play.
      - name: Tag the fingerprint
        if: ${{ inputs.submit && env.SUBMIT_ON == 'true' && inputs.fingerprint != '' }}
        env:
          FP: ${{ inputs.fingerprint }}
        run: |
          if [ -z "$(git ls-remote --tags origin "refs/tags/$TAG_PREFIX/$FP")" ]; then
            git tag "$TAG_PREFIX/$FP"
            git push origin "refs/tags/$TAG_PREFIX/$FP"
          fi
          echo "::notice title=Google Play::Bundle uploaded to internal testing (released to its testers) for fingerprint $FP."

      - name: Not submitted
        if: ${{ !(inputs.submit && env.SUBMIT_ON == 'true') }}
        run: echo "::notice title=Not submitted::The .aab is attached to this run (Artifacts). Google Play submission is off (repository variable ${{ inputs.variant == 'dev' && 'DEV_ANDROID_SUBMIT' || 'ANDROID_SUBMIT' }})."

  # Phones offer a new build ("New version available", src/lib/updates/storeUpdates.ts) once
  # Firestore config/app says Google Play has it. Internal testing has no review: a completed
  # release there reaches its testers within minutes, so after a wait this reads what the track
  # holds (Play's answer, not what this run built) and hands it to the playBuildAvailable function.
  # The function takes this job's GitHub OIDC token as proof (this repository's android-build.yml,
  # develop or a release branch) and writes config/app testing.android, only ever forwards. No
  # Firestore credential exists in GitHub. Only previewTester accounts are offered these builds.
  # No dependencies are installed here: play.js uses Node's own modules.
  available:
    name: Offer it to testers (config/app)
    needs: build
    # The store app only: playBuildAvailable writes production's config/app.
    if: ${{ inputs.submit && inputs.variant != 'dev' && vars.ANDROID_SUBMIT == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/play.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Give Play time to serve it
        run: sleep 600

      - name: Read the internal testing track
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          PLAY_SERVICE_ACCOUNT_JSON="$(echo "$KEY" | base64 -d)" node scripts/play.js latest internal --json > "$RUNNER_TEMP/build.json"
          cat "$RUNNER_TEMP/build.json"

      - name: Tell phones
        env:
          URL: https://us-central1-revision-buddy-3a398.cloudfunctions.net/playBuildAvailable
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=revisely-play-available" | jq -r .value)
          echo "::add-mask::$TOKEN"
          RESULT=$(curl -sS --fail-with-body --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/build.json" "$URL")
          echo "$RESULT"
          echo "::notice title=config/app::$RESULT"
