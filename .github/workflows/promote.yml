name: Promote to production

# App Store users get JavaScript only from here, and only an update that TestFlight already had.
#
# develop publishes every push to the `preview` channel (preview.yml), which TestFlight installs follow.
# Once it has been tried there, develop is merged into main; this then finds the preview update built
# from exactly what main holds (the "[app <hash>]" in its message, .github/scripts/app-hash.sh: every
# file that goes into the app) and republishes that same update (the same bundle and assets, not a new
# build of them) to `production`. If main's app was never published to preview (a change made on main
# directly, or main ahead of develop), nothing is promoted and the run fails: make the change on
# develop, try it in TestFlight, merge again. Docs, store and scripts changes don't count.
#
# The promote job waits for approval in the `production` environment (Actions > the run > Review
# deployments): the TestFlight sign-off. An update promoted for a runtime that the App Store doesn't
# have yet (a new version in review) reaches App Store users when that version is released.
#
# Release health: before the approval, the candidate update must have run at least `min_sessions`
# sessions on preview (TestFlight testers) at `min_crash_free` crash-free or better, read from Sentry
# (scripts/sentry/gate.js; sessions are labelled per update, src/lib/releaseInfo.ts). Below that,
# nothing is promoted. A run by hand can lower the bar or skip the check (`skip_health_check`).
#
# workflow_dispatch can promote a given update group instead (e.g. a fix for an older binary, published
# to preview from a branch cut before a native change); it goes through the same approval.
#
# Rolling back: run it by hand with `group` = the previous production update group and `rollback` =
# true. That group is looked up on production as well as preview, the health check is skipped (it
# already ran in production), and the approval still applies.
#
# Android is opt-in (repository variable ANDROID_RELEASES, as in preview.yml): off, only the group's
# iOS update is republished, so nothing reaches Android's production channel until it is turned on.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'functions/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.maestro/**'
      - 'store/**'
      - 'scripts/**'
      - '**/*.md'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/**'
  workflow_dispatch:
    inputs:
      group:
        description: Update group to promote (empty = the preview update with main's app hash)
        type: string
        required: false
      rollback:
        description: Roll back to an earlier production update (group required; skips the health check)
        type: boolean
        default: false
      skip_health_check:
        description: Promote without the preview crash-free check
        type: boolean
        default: false
      min_sessions:
        description: Preview sessions the update must have run
        type: string
        default: '5'
      min_crash_free:
        description: Crash-free sessions needed (0-1)
        type: string
        default: '0.99'

concurrency:
  group: eas-promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  find:
    name: Find the tested update
    runs-on: ubuntu-latest
    outputs:
      group: ${{ steps.find.outputs.group }}
      runtime: ${{ steps.find.outputs.runtime }}
      message: ${{ steps.find.outputs.message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # eas reads app.config.js, which needs the project's packages and the Firebase plist.
      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write the Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$PLIST" | base64 -d > GoogleService-Info.plist

      - name: Find it on preview
        id: find
        env:
          GROUP: ${{ inputs.group }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          APP=$(.github/scripts/app-hash.sh)
          eas update:list --branch preview --limit 50 --json --non-interactive > preview.json
          if [ "$ROLLBACK" = "true" ]; then
            if [ -z "$GROUP" ]; then echo "::error::A rollback needs the group to roll back to."; exit 1; fi
            eas update:list --branch production --limit 50 --json --non-interactive > production.json
            jq -s '{currentPage: (.[0].currentPage + .[1].currentPage)}' preview.json production.json > preview.json.tmp
            mv preview.json.tmp preview.json
          fi
          if [ -n "$GROUP" ]; then
            MATCH=$(jq -c --arg g "$GROUP" '[.currentPage[] | select(.group == $g)][0] // empty' preview.json)
            WHAT="update group $GROUP"
          else
            MATCH=$(jq -c --arg t "[app $APP]" '[.currentPage[] | select((.message // "") | contains($t))][0] // empty' preview.json)
            WHAT="main's app (hash $APP)"
          fi
          if [ -z "$MATCH" ]; then
            echo "::error title=Not tested in TestFlight::No preview update found for $WHAT. Nothing was promoted. Make the change on develop (it publishes to preview), try it in TestFlight, then merge develop into main again."
            exit 1
          fi
          {
            echo "group=$(jq -r .group <<<"$MATCH")"
            echo "runtime=$(jq -r .runtimeVersion <<<"$MATCH")"
            # Listed as "<message>" (N minutes ago by X): keep the message, without its [app ...].
            echo "message=$(jq -r '(.message // "") | sub("^\""; "") | sub("\" \\([^)]*\\)$"; "") | sub(" \\[app [0-9a-f]+\\]$"; "")' <<<"$MATCH" | head -n 1 | cut -c 1-200)"
          } >> "$GITHUB_OUTPUT"
          echo "### Ready to promote" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- group `\(.group)`\n- runtime `\(.runtimeVersion)`\n- \(.message)"' <<<"$MATCH" >> "$GITHUB_STEP_SUMMARY"

  health:
    name: Release health on preview
    needs: find
    if: ${{ !inputs.rollback && !inputs.skip_health_check }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Crash-free sessions of the candidate update
        env:
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
          MIN_SESSIONS: ${{ inputs.min_sessions || '5' }}
          MIN_CRASH_FREE: ${{ inputs.min_crash_free || '0.99' }}
          GROUP: ${{ needs.find.outputs.group }}
        run: |
          if [ -z "$SENTRY_API_TOKEN" ]; then
            echo "::error title=No release health::Add the SENTRY_API_TOKEN secret (read access to Sentry), or run this by hand with skip_health_check. Nothing was promoted."
            exit 1
          fi
          node scripts/sentry/gate.js "$GROUP"

  promote:
    name: Promote (after TestFlight sign-off)
    needs: [find, health]
    # The health check passed, or was skipped on purpose (a rollback or a run by hand that skips it).
    if: ${{ !cancelled() && needs.find.result == 'success' && (needs.health.result == 'success' || needs.health.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # eas reads app.config.js, which needs the project's packages and the Firebase plist.
      - run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # No caches where release secrets are (CLAUDE.md, Health).
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write the Firebase plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$PLIST" | base64 -d > GoogleService-Info.plist

      - name: Republish to production
        env:
          GROUP: ${{ needs.find.outputs.group }}
          MESSAGE: ${{ needs.find.outputs.message }}
          PLATFORM: ${{ vars.ANDROID_RELEASES == 'true' && 'all' || 'ios' }}
        run: |
          eas update:republish --group "$GROUP" --destination-branch production --platform "$PLATFORM" \
            --message "Promoted from preview: $MESSAGE" --non-interactive
          echo "Promoted $GROUP ($PLATFORM, runtime ${{ needs.find.outputs.runtime }}) to production." >> "$GITHUB_STEP_SUMMARY"
