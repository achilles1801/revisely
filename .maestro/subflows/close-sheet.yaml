# Closes the v2/Sheet on show by its handle (id sheet-handle). Not by "Close": the full-screen backdrop
# carries that label too and comes first, so Maestro tapped the middle of the screen, which on a tall,
# scrolling sheet (the juz sheet) is the sheet itself: a page of its strip or a surah row opened the
# reader (E2E 09, iOS and Android, Nov 8 2026).
appId: com.revisionbuddy.app
---
- tapOn:
    id: sheet-handle
