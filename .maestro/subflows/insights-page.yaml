# One Insights page from its row on the one Activity tab, if the row is there: the top, then the end, then back to the
# list. Screenshots 09-insights-<SECTION>-<THEME> and 09-insights-<SECTION>-end-<THEME>. Run by insights-pages.yaml.
#   env SECTION: the section's id (coverage, consistency, gaps, weak, recitation, memorization, pace)
#   env THEME:   the screenshots' names' last part
appId: com.revisionbuddy.app
---
- scrollUntilVisible:
    element:
      id: insights-row-${SECTION}
    direction: DOWN
    centerElement: true
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: insights-row-${SECTION}
    commands:
      - runFlow:
          file: tap-to-open.yaml
          env:
            ID: insights-row-${SECTION}
            OPENS: activity-section
      - runFlow:
          file: shot.yaml
          env:
            NAME: 09-insights-${SECTION}-${THEME}
      # The end: three long swipes reach it on every page at the seed's length.
      - repeat:
          times: 3
          commands:
            - swipe:
                start: 50%, 80%
                end: 50%, 20%
                duration: 500
      - runFlow:
          file: shot.yaml
          env:
            NAME: 09-insights-${SECTION}-end-${THEME}
      - runFlow:
          file: tap-to-open.yaml
          env:
            ID: back
            OPENS: activity-blocks-views
