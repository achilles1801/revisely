# Settings → Start day at fajr, switched (with the location the simulator has),
# then back to Home. RESETS: what the row then says ("Resets at 5:2… AM" or
# "Resets at midnight"), as a regex.
appId: com.revisionbuddy.app
---
- tapOn:
    id: open-settings
# Centred: found at the screen's foot, a row can sit under the tab bar, which takes the tap
# (on iOS Maestro counts a row cut off there as visible).
# Settings is long: on the iOS runner a swipe and a look take 4–6 s (.maestro/README.md, Time limits).
- scrollUntilVisible:
    element:
      id: fajr-boundary-switch
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: fajr-boundary-switch
- extendedWaitUntil:
    visible:
      id: fajr-resets-at
      text: ${RESETS}
    timeout: 15000
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 10000
