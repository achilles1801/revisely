# Swipes the session on to its next page and waits until the app has counted
# the page it left: the day's count (".*· 2/10" as the quiet header or the title
# shows it, whichever is up) goes up by one. For a page not yet revised only
# (swiping off one already revised changes no count). The mushaf runs right to
# left: the next page comes in from the left.
#
# The count is read again only once the app has had time to count the swipe
# (seconds, on a busy emulator): reading it straight away once gave the count
# from before, and a swipe made on that went a page too far (02 on Android,
# Nov 6 2026). A swipe can also be lost: on the Android emulator, offline (06),
# the first swipe in a session left the page where it was, with nothing on
# screen moving. So if the count hasn't moved after 10 s, the page didn't turn,
# and it is swiped once more; that swipe must count.
#
# TEMPORARY: the second swipe stays only until the cause of that lost first
# swipe offline is found and fixed (being looked into: whether the app stops
# drawing while it retries page downloads offline; no frames for ~15 s after
# the swipe in run 42322437281). Then remove it, and a lost swipe fails here.
appId: com.revisionbuddy.app
---
- copyTextFrom:
    text: ".*· [0-9]+/[0-9]+"
# "Juz 30 · 2/10" gives "3/10". (No `$` here: Maestro's ${…} can't hold one.)
- evalScript: ${output.nextCount = (Number(maestro.copiedText.split('/')[0].split(' ').pop()) + 1) + '/' + maestro.copiedText.split('/')[1]}
- swipe:
    start: 12%, 50%
    end: 88%, 50%
    duration: 300
# Until the app counts it, or 10 s: the count read next says which.
- extendedWaitUntil:
    visible:
      text: ".*· ${output.nextCount}"
    timeout: 10000
    optional: true
- copyTextFrom:
    text: ".*· [0-9]+/[0-9]+"
- evalScript: ${output.swipeLost = maestro.copiedText.split(' ').pop() !== output.nextCount}
# TEMPORARY (see the top): the second swipe, until the offline lost swipe is fixed.
- runFlow:
    when:
      true: ${output.swipeLost}
    commands:
      - evalScript: "${console.log('WARNING swipe-page - the page did not turn 10 s after the swipe; swiping again')}"
      - swipe:
          start: 12%, 50%
          end: 88%, 50%
          duration: 300
- extendedWaitUntil:
    visible:
      text: ".*· ${output.nextCount}"
    timeout: 15000
# And the page done moving, before the next swipe starts.
- waitForAnimationToEnd:
    timeout: 3000
