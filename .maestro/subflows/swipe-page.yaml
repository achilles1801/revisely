# Swipes the session on to its next page and waits until the app has counted
# the page it left: the day's count (".*· 2/10" as the quiet header or the title
# shows it, whichever is up) goes up by one. For a page not yet revised only
# (swiping off one already revised changes no count). The mushaf runs right to
# left: the next page comes in from the left.
#
# The count is read again only once the app has had time to count the swipe
# (seconds, on a busy emulator): reading it straight away once gave the count
# from before, and a swipe made on that went a page too far (02 on Android,
# Nov 6 2026).
#
# A swipe that doesn't turn the page fails here. On Nov 7 the first swipe of 06
# (offline) was lost on several Android runs, and for a few hours a second swipe
# stood in for it (#304). After 04:20Z, 06 passed its first attempt in all 37
# runs. In the twelve that kept every attempt's logs (runs 42347411310 and
# 42350210847: 06 after the daily log, on a tester account with Revo mounted, and
# first in a job), the second swipe never fired, and the pager logged each swipe
# starting, handing over to the native scroll and settling on the next page. If
# it comes back, the attempt fails and its logcat is kept.
appId: com.revisionbuddy.app
---
- copyTextFrom:
    text: ".*· [0-9]+/[0-9]+"
# "Juz 30 · 2/10" gives "3/10". (No `$` here: Maestro's ${…} can't hold one.)
- evalScript: ${output.nextCount = (Number(maestro.copiedText.split('/')[0].split(' ').pop()) + 1) + '/' + maestro.copiedText.split('/')[1]}
- swipe:
    start: 12%, 50%
    end: 88%, 50%
    duration: 300
# Until the app counts it.
- extendedWaitUntil:
    visible:
      text: ".*· ${output.nextCount}"
    timeout: 15000
# And the page done moving, before the next swipe starts.
- waitForAnimationToEnd:
    timeout: 3000
