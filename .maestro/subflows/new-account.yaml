# A fresh install, its clock at CLOCK, signed up and onboarded (onboard.yaml,
# BOUNDARY midnight or fajr), on Home.
appId: com.revisionbuddy.app
---
- runFlow:
    file: launch.yaml
    env:
      CLOCK: ${CLOCK}
- runFlow: signup.yaml
# SYNC-4: the new account loads at once, with no relaunch, in every flow that starts
# with one. (Until #613 a new account could wait on loading for as long as the server
# took to acknowledge its 604 pages, and these flows relaunched past it.)
- assertVisible:
    id: welcome
- runFlow:
    file: onboard.yaml
    env:
      BOUNDARY: ${BOUNDARY}
