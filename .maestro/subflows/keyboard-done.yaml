# Puts the keyboard away on the daily log the app's own way: the top bar's Done, there while the keyboard is up
# for the composer, on both platforms. It must be there: after typing, the keyboard is up. Before Nov 16 2026
# the Done was a bar above the keyboard that iOS 26 didn't show (the tap here was optional and found nothing),
# and on an iPhone SE an edited note's Save stayed under the keyboard (E2E run 43873599186).
appId: ${APP_ID}
---
- tapOn:
    id: journal-keyboard-done
- extendedWaitUntil:
    notVisible:
      id: journal-keyboard-done
    timeout: 5000
