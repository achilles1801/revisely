# Settings → Theme → THEME ("Light" or "Dark"), back on Home.
#   env THEME
appId: com.revisionbuddy.app
---
- tapOn:
    id: open-settings
# Centred: stopped at its first sight, the row sat behind the tab bar and the tap opened Insights.
- scrollUntilVisible:
    element: "Theme"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "${THEME}(, selected)?"
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 10000
