# Settings → Theme → THEME ("Light" or "Dark"), back on Home.
#   env THEME
appId: com.revisionbuddy.app
---
- tapOn:
    id: open-settings
# Swipes first, counted, not timed, then centred, as settings-row.yaml does (the row has no id):
# a loaded iOS runner took 20 s a swipe (#328's run 42565390013), and stopped at its first sight, the
# row sat behind the tab bar and the tap opened Insights.
- repeat:
    while:
      notVisible: "Theme"
    times: 12
    commands:
      - scroll
- scrollUntilVisible:
    element: "Theme"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "${THEME}(, selected)?"
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 10000
