# Gives this flow's account the history the Revo mocks show (scripts/seed-revo.js): Juz 28 at 20
# pages a day, 548–549 weak, a month of sessions, today 6 of 20. The account is the one signup.yaml
# made. Waits for Home to show today from it ("Continue at Al-Hashr, ayah 17": page 548, NAME-1).
#
# Seeded once, after the app has sent its own changes (app-sent.yaml). A page write of sign-up's
# still on the phone when the seed landed put Al-Fatihah and Juz 28 back as they were (iOS, Nov 7
# 2026); seeding until Home showed it hid that instead of preventing it.
appId: com.revisionbuddy.app
---
- runFlow: app-sent.yaml
- runScript:
    file: ../scripts/seed-revo.js
- extendedWaitUntil:
    visible:
      id: today-title
      text: "Continue at Al.Hashr, ayah.17[^0-9]*"
    timeout: 20000
