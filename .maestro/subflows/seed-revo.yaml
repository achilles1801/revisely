# Gives this flow's account the history the Revo mocks show (scripts/seed-revo.js): Juz 28 at 20
# pages a day, 548–549 weak, a month of sessions, today 6 of 20. The account is the one signup.yaml
# made. Waits for Home to show today from it ("Continue at Al-Hashr, p. 548").
#
# Seeded again if Home doesn't show it: the app can still be sending sign-up's pages when the seed
# lands, and a page write of its own arriving after it put Al-Fatihah and Juz 28 back as they were
# (iOS, Nov 7 2026). The seed writes the same documents each time, and by the second pass the app's
# writes have gone out.
appId: com.revisionbuddy.app
---
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: ../scripts/seed-revo.js
      - extendedWaitUntil:
          visible:
            id: today-title
            text: "Continue at .*548.*"
          timeout: 20000
