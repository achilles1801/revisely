# Edit sections on Insights (ACT-29; the account is a tester), from anywhere on Activity: the editor, then Insights
# without Consistency and Memorization. Last in a flow: the layout stays on the phone.
#   env THEME  light or dark (in the screenshots' names)
# Screenshots 09-activity-sections-insights-<THEME> and 09-activity-sections-insights-edited-<THEME>.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: activity-edit-sections
    direction: UP
    timeout: 20000
- tapOn:
    id: pill-insights
- extendedWaitUntil:
    visible:
      id: activity-insights
    timeout: 10000
- tapOn:
    id: activity-edit-sections
- extendedWaitUntil:
    visible:
      id: sections-item-pace
    timeout: 10000
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-activity-sections-insights-${THEME}
- tapOn:
    id: sections-item-consistency
- tapOn:
    id: sections-item-memorization
- tapOn:
    id: sections-done
- extendedWaitUntil:
    notVisible:
      id: sections-done
    timeout: 10000
- assertNotVisible:
    id: insights-consistency
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-activity-sections-insights-edited-${THEME}
