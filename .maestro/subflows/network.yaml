# The phone's connection off (OFFLINE=1) or back on (OFFLINE=0). Android: real
# airplane mode. iOS: the Simulator has none, so the E2E build makes the
# emulators unreachable (src/lib/e2e/network.ts) and NetInfo with them.
appId: com.revisionbuddy.app
---
- runFlow:
    when:
      platform: Android
      true: ${OFFLINE == '1'}
    commands:
      - setAirplaneMode: enabled
- runFlow:
    when:
      platform: Android
      true: ${OFFLINE == '0'}
    commands:
      - setAirplaneMode: disabled
- runFlow:
    when:
      platform: iOS
    commands:
      - openLink: revisely://e2e/network?offline=${OFFLINE}
      - runFlow: open-link-prompt.yaml
