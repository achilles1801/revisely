# Onboarding as a user does it: in progress, Juz 30 marked memorized (pages
# 582–604) beside Al-Fatihah (page 1, marked for you): 24 pages. 10 pages a
# day (the default), the day resetting at BOUNDARY (midnight | fajr). The days
# (SCHED-1): 1, 582–590 | 591–600 | 601–604, 1, 582–586 | 587–596 …
# For fajr, set the location first (setLocation) and launch with location allowed.
appId: com.revisionbuddy.app
---
- tapOn:
    id: welcome-begin
- tapOn:
    id: journey-in_progress
- tapOn:
    id: journey-continue
- extendedWaitUntil:
    visible:
      id: juz-selection
    timeout: 10000
# The list by juz (a tap made while the screen is still settling can be lost: check it took).
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: pill-juz
      - assertVisible:
          id: pill-juz
          text: "Juz, selected"
- scrollUntilVisible:
    element:
      id: juz-30-check
    direction: DOWN
    timeout: 30000
# The check. iOS decides by the check's own state ("checkbox, checked"): a tap
# toggles it, and tapping again because the count below was slow to show (or,
# on iOS, missing from the accessibility tree while on screen; CI, Nov 4)
# unchecked it. Android reads the count, as before.
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  visible:
                    id: juz-30-check
                    text: ".*unchecked"
                commands:
                  - tapOn:
                      id: juz-30-check
            - extendedWaitUntil:
                visible:
                  id: juz-30-check
                  text: "checkbox, checked"
                timeout: 10000
      - extendedWaitUntil:
          visible:
            id: juz-selection-summary
            text: "24 of 604 pages memorized"
          timeout: 15000
          optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  notVisible:
                    id: juz-selection-summary
                    text: "24 of 604 pages memorized"
                commands:
                  - tapOn:
                      id: juz-30-check
            - extendedWaitUntil:
                visible:
                  id: juz-selection-summary
                  text: "24 of 604 pages memorized"
                timeout: 10000
- tapOn:
    id: juz-continue
- extendedWaitUntil:
    visible:
      id: schedule
    timeout: 10000
- assertVisible:
    id: schedule-amount
    text: "10"
- tapOn:
    id: pill-${BOUNDARY}
- tapOn:
    id: schedule-start
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 30000
# Juz 30 memorized (24 pages, 4.0%): what onboarding saved, on Home.
- extendedWaitUntil:
    visible:
      text: ".*4.0% of the Quran memorized.*"
    timeout: 15000
