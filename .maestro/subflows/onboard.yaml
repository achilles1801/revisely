# Onboarding as a user does it, one question a screen (ONBOARD-3): Part of it, Juz 30 tapped in the grid
# (pages 582–604) beside Al-Fatihah (page 1, chosen for you): 24 pages. 10 pages a day (the default), the day
# starting at BOUNDARY (midnight | fajr), reminders on. The days (SCHED-1): 1, 582–590 | 591–600 | 601–604, 1,
# 582–586 | 587–596 …
# For fajr, set the location first (setLocation) and launch with location allowed.
# env SHOTS: "yes" takes a screenshot of each question (01-onboarding only).
appId: com.revisionbuddy.app
---
- runFlow:
    when:
      true: ${typeof SHOTS !== 'undefined' && SHOTS === 'yes'}
    file: shot.yaml
    env:
      NAME: 01-onboarding-welcome
- tapOn:
    id: welcome-begin
- extendedWaitUntil:
    visible:
      id: journey-select
    timeout: 15000
- runFlow:
    when:
      true: ${typeof SHOTS !== 'undefined' && SHOTS === 'yes'}
    file: shot.yaml
    env:
      NAME: 01-onboarding-memorized
# One tap answers it and moves on. Tapped again only while the question is still the one on screen
# (a tap made while the screen is settling can be lost).
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: juz-selection
          commands:
            - tapOn:
                id: journey-part
                retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: juz-selection
          timeout: 15000
# The starting selection, which comes when the account's pages have loaded: a juz marked before
# then was dropped when they arrived (fixed in #216).
- extendedWaitUntil:
    visible:
      id: juz-selection-summary
      text: "Al.Fatihah chosen"
    timeout: 30000
# Tapped only while the line still says Al-Fatihah alone, and again only if a tap was lost: a tap
# toggles the juz, so a second one would clear it.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: juz-selection-summary
              text: "Al.Fatihah chosen"
          commands:
            - tapOn:
                id: juz-cell-30
                retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: juz-selection-summary
            text: "Al.Fatihah and Juz.30 chosen"
          timeout: 5000
- runFlow:
    when:
      true: ${typeof SHOTS !== 'undefined' && SHOTS === 'yes'}
    file: shot.yaml
    env:
      NAME: 01-onboarding-juz
# The list by surah, on the same selection (ONBOARD-4): opened and closed, changing nothing.
- runFlow:
    when:
      true: ${typeof SHOTS !== 'undefined' && SHOTS === 'yes'}
    commands:
      - tapOn:
          id: juz-by-surah
      - extendedWaitUntil:
          visible:
            id: juz-by-surah-done
          timeout: 10000
      - runFlow:
          file: shot.yaml
          env:
            NAME: 01-onboarding-by-surah
      - tapOn:
          id: juz-by-surah-done
      - extendedWaitUntil:
          notVisible:
            id: juz-by-surah-done
          timeout: 10000
# Continue waits for the account's pages (a new account's arrive in two batches): until then it
# reads "Loading your pages…" and is disabled (ONBOARD-1). A tap then did nothing (E2E run
# 42124077552, Nov 5 2026).
- extendedWaitUntil:
    visible:
      id: juz-continue
      text: "Continue"
      enabled: true
    timeout: 30000
- tapOn:
    id: juz-continue
# As long as the other screens here get: the next screen had come up, but the CI Simulator stalled
# for 20 s just after the tap (every process on it went quiet), so the one look a 10 s wait had
# came back without it (run 42169518547).
- extendedWaitUntil:
    visible:
      id: daily-amount
    timeout: 30000
- assertVisible:
    id: amount-value
    text: "10"
- runFlow:
    when:
      true: ${typeof SHOTS !== 'undefined' && SHOTS === 'yes'}
    file: shot.yaml
    env:
      NAME: 01-onboarding-amount
- tapOn:
    id: amount-continue
- extendedWaitUntil:
    visible:
      id: day-start
    timeout: 30000
- runFlow:
    when:
      true: ${typeof SHOTS !== 'undefined' && SHOTS === 'yes'}
    file: shot.yaml
    env:
      NAME: 01-onboarding-day-start
# When the day starts: one tap, and on. At Fajr gets its location first, which can take a few seconds.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: reminder
          commands:
            - tapOn:
                id: day-${BOUNDARY}
                retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: reminder
          timeout: 20000
- runFlow:
    when:
      true: ${typeof SHOTS !== 'undefined' && SHOTS === 'yes'}
    file: shot.yaml
    env:
      NAME: 01-onboarding-reminder
# Remind me, again only while it can still be tapped: a tap that took makes it busy (and it ignores
# taps), so a second tap never starts a second save. Under load the simulator held one tap down for
# half a second and iOS cancelled the touch on release: no press, the screen stayed (02 on iOS, run
# 43619892917).
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: reminder-on
              enabled: true
          commands:
            - tapOn:
                id: reminder-on
                retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: today-post
          timeout: 30000
# Juz 30 memorized (24 pages, 4.0%): what onboarding saved, on Home.
- extendedWaitUntil:
    visible:
      text: ".*4.0% of the Quran memorized.*"
    timeout: 15000
