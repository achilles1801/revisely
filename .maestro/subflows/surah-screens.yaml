# The screens that name the Qur'an by surah and juz (NAME-1), from Home, each captured as
# 11-<screen>${SUFFIX}: Home, Jump to (juz and surah; today's line opens it, HOME-3), All activity, the schedule
# (Settings → Revision → Schedule, SET-1) and the memorized pages. Starts and ends on Home.
#   env SUFFIX: "" (light) or "-dark"
appId: com.revisionbuddy.app
---
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 15000
- runFlow:
    file: shot.yaml
    env:
      NAME: 11-home${SUFFIX}

# Jump to, straight from today's line (HOME-3): each juz by its surahs, each surah by its juz.
- tapOn:
    id: today-summary
- extendedWaitUntil:
    visible:
      id: jump-juz-list
    timeout: 10000
- runFlow:
    file: shot.yaml
    env:
      NAME: 11-jump-juz${SUFFIX}
- tapOn:
    id: pill-surah
- extendedWaitUntil:
    visible:
      id: jump-surah-list
    timeout: 10000
- runFlow:
    file: shot.yaml
    env:
      NAME: 11-jump-surah${SUFFIX}
# The handle closes on a drag down (a tap does nothing; VoiceOver's activate does).
- swipe:
    from:
      id: sheet-handle
    direction: DOWN
    duration: 400
- extendedWaitUntil:
    notVisible:
      id: jump-sheet
    timeout: 10000

# All activity (See all): each session by its surahs.
- scrollUntilVisible:
    element:
      id: see-all
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: see-all
- extendedWaitUntil:
    visible: "All activity"
    timeout: 10000
- runFlow:
    file: shot.yaml
    env:
      NAME: 11-see-all${SUFFIX}
- runFlow: back-home.yaml

# The schedule, from Settings → Revision → Schedule (SET-1): each day by its juz and surahs.
- scrollUntilVisible:
    element:
      id: open-settings
    direction: UP
    timeout: 15000
- runFlow:
    file: tap-to-open.yaml
    env:
      ID: open-settings
      OPENS: back
- runFlow:
    file: settings-row.yaml
    env:
      PAGE: revision
      ROW: settings-schedule
- tapOn:
    id: settings-schedule
- extendedWaitUntil:
    visible:
      id: plan-edit
    timeout: 15000
- runFlow:
    file: shot.yaml
    env:
      NAME: 11-schedule${SUFFIX}
# Its own Back, on Android too (#348: the top bar sat under the status bar there, out of reach).
- runFlow: back-home.yaml

# The memorized pages: each juz by its surahs (the Juz tab; Surahs lists page counts).
- tapOn:
    id: today-memorized
- extendedWaitUntil:
    visible: "Memorization"
    timeout: 15000
- tapOn:
    id: pill-juz
# By id: iOS reads the row with its surahs ("Juz 1, Al-Fatihah to Al-Baqarah, ayah 141").
- extendedWaitUntil:
    visible:
      id: juz-1
    timeout: 10000
- runFlow:
    file: shot.yaml
    env:
      NAME: 11-memorized${SUFFIX}
- runFlow: back-home.yaml
