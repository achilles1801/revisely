# Signs up with email and password (the Auth emulator), on to onboarding.
# Leaves the address in output.email.
appId: com.revisionbuddy.app
---
- evalScript: ${output.email = 'e2e' + Date.now() + '@example.com'}
# Sign up (a tap made while the screen settles can be lost: check it took).
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: auth-name
          commands:
            - tapOn:
                id: auth-switch-mode
      - extendedWaitUntil:
          visible:
            id: auth-name
          timeout: 10000
# Each field is checked once typed and typed again if the keyboard dropped keys (type-in-field.yaml).
# The passwords are shown first, so their text can be read like the others'.
- tapOn:
    id: auth-password-reveal
- tapOn:
    id: auth-confirm-password-reveal
- runFlow:
    file: type-in-field.yaml
    env:
      ID: auth-name
      TEXT: E2E
- runFlow:
    file: type-in-field.yaml
    env:
      ID: auth-email
      TEXT: ${output.email}
- runFlow:
    file: type-in-field.yaml
    env:
      ID: auth-password
      TEXT: e2e-password
- runFlow:
    file: type-in-field.yaml
    env:
      ID: auth-confirm-password
      TEXT: e2e-password
# Maestro's hideKeyboard can't dismiss it here: a tap on the title does. The form moves as the
# keyboard goes (a KeyboardAvoidingView): wait for it to stop, or the tap lands where Sign up was.
# On iOS in run 42573714262 (04) the tap reached the window and no sign-up reached the Auth emulator.
- tapOn:
    id: auth-title
- waitForAnimationToEnd
- tapOn:
    id: auth-submit
# SYNC-4: the new account loads at once, with no relaunch. (Asserted by the
# caller: 01-onboarding fails on it; other flows go on, see new-account.yaml.)
# The wait also ends on the app's error (an id is a regex), and a sign-up the
# app refused fails here with its message on the screen, not as SYNC-4 after a
# relaunch that clears it. (Keys the simulator's keyboard dropped are typed
# again above; before that, runs 42403217365 and 43583371303 failed here on
# "Invalid email address".)
- extendedWaitUntil:
    visible:
      id: "welcome|auth-error"
    timeout: 60000
    optional: true
- assertNotVisible:
    id: auth-error
