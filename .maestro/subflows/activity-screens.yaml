# The Activity screens for the visual check (gap audit; activity-redesign/verify): Overview's month (with
# Today, since October isn't today's month), its Week | Month menu and the week, a day, the day's block menu, the add sheets and Insights, each a screenshot named
# 09-<screen>-${THEME}. The day as d1 (top, then scrolled), its menu (d10a), the + (d5), its Revised,
# Memorized and Note sheets (d6–d8), a light day (d2), and Insights (d4: top, Weak spots, the end).
# Run by 09-activity-light.yaml and 09-activity-dark.yaml, after seed-activity.yaml.
appId: com.revisionbuddy.app
---
- tapOn:
    id: open-activity
- extendedWaitUntil:
    visible:
      id: activity-blocks-views
    timeout: 20000
# As the mock (d3): October, with the 28th picked.
- tapOn: "Previous month"
- tapOn:
    id: calendar-day-2026-10-28
# The day's recording (the app writes the demo ones after the relaunch): its mic and count.
- extendedWaitUntil:
    visible:
      id: preview-recordings-revised
    timeout: 30000
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-overview-month-${THEME}
# Week | Month is the chip beside the title (ACT-18): its menu, then the week holding the picked day.
- tapOn:
    id: calendar-span
- extendedWaitUntil:
    visible:
      id: sheet-action-week
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-overview-span-menu-${THEME}
- tapOn:
    id: sheet-action-week
- extendedWaitUntil:
    visible:
      id: calendar-week
    timeout: 10000
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-overview-week-${THEME}
- tapOn:
    id: calendar-span
- extendedWaitUntil:
    visible:
      id: sheet-action-month
    timeout: 10000
- tapOn:
    id: sheet-action-month
- extendedWaitUntil:
    visible:
      id: calendar-totals
    timeout: 10000
# As the mock (d1): today, Tuesday 3 November. Today brings back today's month with today picked; the
# picked day's rows open it (ACT-18).
- tapOn:
    id: calendar-today
- extendedWaitUntil:
    notVisible:
      id: calendar-today
    timeout: 10000
- tapOn:
    id: calendar-day-2026-11-03
- tapOn:
    id: preview-row-revised
- extendedWaitUntil:
    visible:
      id: activity-day-v2
    timeout: 15000
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-day-${THEME}
# The Revised block's menu (d10a): a hold on its header.
- longPressOn:
    id: activity-block-revised-header
    optional: true
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-menu-revised-${THEME}
- tapOn:
    text: "Close menu"
    optional: true
# The + (d5): add to today.
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-add-menu-${THEME}
# Revised elsewhere (the trimmed +, Nov 7 2026): today's two pages not revised (At-Taghabun), ticked.
- tapOn:
    id: sheet-action-revised
- extendedWaitUntil:
    visible:
      id: add-revised-info
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-add-revised-${THEME}
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible:
      id: add-revised-sheet
    timeout: 10000
# Memorized (d7): "From your reading" (p. 563, read at 8:05), nothing typed yet.
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- tapOn:
    id: sheet-action-memorized
- extendedWaitUntil:
    visible:
      id: add-memorized-from-reading
    timeout: 10000
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-add-memorized-${THEME}
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible:
      id: add-memorized-sheet
    timeout: 10000
# Note (d8): typed, and shown under Revised. (ASCII only: Android's input can't type an en dash.)
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- tapOn:
    id: sheet-action-note
- extendedWaitUntil:
    visible:
      id: add-note-text
    timeout: 10000
- tapOn:
    id: add-note-text
- inputText: "548-549 keep slipping at the turn. Read them twice before Fajr."
- tapOn:
    id: add-note-tag-revised
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-add-note-${THEME}
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible:
      id: add-note-sheet
    timeout: 10000
# The rest of the day (d1 is taller than a screen): Read, Notes and the footer. (After the sheets,
# whose mocks show the day's top behind them.)
- scrollUntilVisible:
    element:
      id: activity-day-footer
    direction: DOWN
    timeout: 10000
    optional: true
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-day-end-${THEME}
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: activity-blocks-views
    timeout: 10000
# A light day (d2): Sunday 1 November, stopped after 6 pages.
- tapOn:
    id: calendar-day-2026-11-01
- tapOn:
    id: preview-open
- extendedWaitUntil:
    visible:
      id: activity-day-v2
    timeout: 15000
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-day-sunday-${THEME}
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: activity-blocks-views
    timeout: 10000
- tapOn:
    id: pill-insights
- extendedWaitUntil:
    visible:
      id: activity-insights
    timeout: 15000
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-insights-${THEME}
# Weak spots in the middle of the screen, with Revo's Ask beside its title (d4's middle).
- scrollUntilVisible:
    element:
      id: insights-ask-revo
    direction: DOWN
    centerElement: true
    timeout: 15000
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-insights-weak-${THEME}
# The rest of Insights (d4 is taller than a screen): Weak spots to Pace.
- scrollUntilVisible:
    element:
      id: insights-pace
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
    optional: true
- runFlow:
    file: shot.yaml
    env:
      NAME: 09-insights-end-${THEME}
