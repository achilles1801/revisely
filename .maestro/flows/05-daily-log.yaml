# A day's notes: two added from the day's +, one edited and the other deleted from its menu, each
# change kept across a cold start, and the other note left as it was.
# Rules (BEHAVIOUR.md): LOG-1, LOG-2, ACT-5, ACT-6
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T20:00
      BOUNDARY: midnight
- runFlow: ../subflows/open-day.yaml

# LOG-1: two notes, each its own entry.
- runFlow:
    file: ../subflows/add-day-note.yaml
    env:
      TEXT: Juz 30 felt steady today
- extendedWaitUntil:
    visible:
      id: day-note-.*
      text: "Note, Juz 30 felt steady today, .*"
    timeout: 15000
- runFlow:
    file: ../subflows/add-day-note.yaml
    env:
      TEXT: Repeat Al-Mutaffifin twice
# The first note is checked with a wait: the second note's send can still be
# landing, and a note that truly vanished still fails after the timeout.
- extendedWaitUntil:
    visible:
      id: day-note-.*
      text: "Note, Juz 30 felt steady today, .*"
    timeout: 15000

# Kept: a cold start, then back to the day.
- runFlow: ../subflows/relaunch.yaml
- runFlow: ../subflows/open-day.yaml
- extendedWaitUntil:
    visible:
      id: day-note-.*
      text: "Note, Juz 30 felt steady today, .*"
    timeout: 30000
- assertVisible:
    id: day-note-.*
    text: "Note, Repeat Al-Mutaffifin twice, .*"
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: 05-day-notes

# LOG-2, ACT-6: editing one changes only it. Hold the note, Edit: the Note sheet, filled in.
- longPressOn:
    id: day-note-.*
    text: "Note, Juz 30 felt steady today, .*"
- tapOn: "Edit"
- extendedWaitUntil:
    visible:
      id: add-note-sheet
    timeout: 10000
- waitForAnimationToEnd
# The field has the focus as the sheet opens, with the note in it.
- eraseText: 80
- runFlow:
    file: ../subflows/type.yaml
    env:
      TEXT: An-Naba needs another look
- tapOn:
    id: add-note-add
- extendedWaitUntil:
    notVisible:
      id: add-note-sheet
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: day-note-.*
      text: "Note, An-Naba needs another look, .*"
    timeout: 10000
# Still so once the edit has been sent and the day read again.
- runFlow: ../subflows/wait-sync.yaml
- assertVisible:
    id: day-note-.*
    text: "Note, An-Naba needs another look, .*"
- assertNotVisible:
    text: "Note, Juz 30 felt steady today, .*"
- assertVisible:
    id: day-note-.*
    text: "Note, Repeat Al-Mutaffifin twice, .*"

# LOG-2, ACT-6: deleting one removes only it. Hold the note, Delete: it goes at once, with Undo
# for five seconds; then the delete is sent.
- longPressOn:
    id: day-note-.*
    text: "Note, Repeat Al-Mutaffifin twice, .*"
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible:
      text: "Note, Repeat Al-Mutaffifin twice, .*"
    timeout: 10000
- assertVisible:
    id: undo-toast-action
- extendedWaitUntil:
    notVisible:
      id: undo-toast-action
    timeout: 15000
# Still gone once the delete has been sent and the day read again.
- runFlow: ../subflows/wait-sync.yaml
- assertNotVisible:
    text: "Note, Repeat Al-Mutaffifin twice, .*"
- assertVisible:
    id: day-note-.*
    text: "Note, An-Naba needs another look, .*"

# Both changes kept across a cold start.
- runFlow: ../subflows/relaunch.yaml
- runFlow: ../subflows/open-day.yaml
- extendedWaitUntil:
    visible:
      id: day-note-.*
      text: "Note, An-Naba needs another look, .*"
    timeout: 30000
- assertNotVisible:
    text: "Note, Repeat Al-Mutaffifin twice, .*"
- assertNotVisible:
    text: "Note, Juz 30 felt steady today, .*"
