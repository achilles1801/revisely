# Recordings: one made in a session, found from "Recording saved · View", kept
# across a cold start, played, and deleted. The audio is whatever the device's
# microphone hears.
# Rules (BEHAVIOUR.md): none yet; recordings have no rule there.
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T12:00
      BOUNDARY: midnight
- runFlow:
    file: ../subflows/open-session.yaml
    env:
      QUIET: ".*"
- runFlow: ../subflows/show-controls.yaml
# While recording, the screen never settles (a live timer and waveform): don't
# wait for it after these taps.
- tapOn:
    id: record-start
    waitToSettleTimeoutMs: 500
# If the microphone's alert comes up (its grant didn't take: CI), Allow, as a
# user would, and record if that didn't start it.
- extendedWaitUntil:
    visible:
      id: record-stop
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible:
        id: record-stop
    commands:
      - runFlow: ../subflows/system-alert.yaml
      - extendedWaitUntil:
          visible:
            id: record-stop
          timeout: 3000
          optional: true
      - tapOn:
          id: record-start
          optional: true
          waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: record-stop
    timeout: 10000
# About three seconds of recording (Maestro has no sleep).
- extendedWaitUntil:
    visible:
      id: e2e-never-shown
    timeout: 3000
    optional: true
- tapOn:
    id: record-stop
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Recording saved"
    timeout: 10000
# The backup notice comes about now; a tap on View under it would be lost.
- runFlow: ../subflows/backup-notice.yaml
# "Recording saved · View" opens it in Activity, while the toast is up (6 s);
# otherwise the way a user finds it later: Home → Activity → the day. On a slow
# simulator the toast can go between seeing it and the tap (CI): the tap is
# then skipped and the way through Activity is taken.
- runFlow:
    when:
      visible: "Recording saved"
    commands:
      - tapOn:
          text: "View"
          optional: true
      - extendedWaitUntil:
          visible:
            text: "Revision recording, .*"
          timeout: 10000
          optional: true
- runFlow:
    when:
      notVisible:
        text: "Revision recording, .*"
    commands:
      - runFlow: ../subflows/show-controls.yaml
      - tapOn: "Back"
      - tapOn:
          id: open-activity
      # Until the calendar has loaded: a new account's first reads can wait behind its first writes.
      - extendedWaitUntil:
          visible:
            id: heat-2026-11-03
          timeout: 20000
      - tapOn:
          id: heat-2026-11-03
      - runFlow:
          when:
            visible:
              id: heat-day-line
          commands:
            - tapOn:
                id: heat-day-line
# Activity's day: the recording, at the app's time (12:00 on the test clock;
# Android writes "pm").
- extendedWaitUntil:
    visible:
      text: "(?i)Revision recording, 12:0[0-9].pm"
    timeout: 15000
# Not empty: a few seconds long (more on a slow machine).
- assertVisible:
    id: recording-time-.*
    text: "(0:0[1-9]|0:[1-5][0-9]|[1-9][0-9]*:[0-5][0-9])"
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: 07-activity-recording

# Kept across a cold start: Home → Activity → the day.
- runFlow: ../subflows/relaunch.yaml
- runFlow: ../subflows/backup-notice.yaml
- tapOn:
    id: open-activity
- extendedWaitUntil:
    visible:
      id: activity-v2
    timeout: 10000
# The calendar follows the test clock: November 3 holds the recording.
- assertVisible:
    id: heat-2026-11-03
    text: ".*1 recording"
- tapOn:
    id: heat-2026-11-03
- runFlow:
    when:
      visible:
        id: heat-day-line
    commands:
      - tapOn:
          id: heat-day-line
- extendedWaitUntil:
    visible:
      text: "(?i)Revision recording, 12:0[0-9].pm"
    timeout: 15000

# Play, then pause.
- tapOn:
    id: recording-play-.*
- extendedWaitUntil:
    visible: "Pause recording"
    timeout: 10000
- tapOn: "Pause recording"
- extendedWaitUntil:
    visible: "Play recording"
    timeout: 10000

# Delete: hold the recording, Delete recording, confirm.
- longPressOn:
    text: "Revision recording, .*"
- tapOn: "Delete recording"
- extendedWaitUntil:
    visible: "Delete this recording\\?"
    timeout: 5000
- tapOn:
    text: "(?i)delete"
    below:
      text: "Delete this recording\\?"
- extendedWaitUntil:
    notVisible:
      text: "Revision recording, .*"
    timeout: 10000
