# Activity's screens in light, for the visual check against the mocks (gap audit). Its screenshots are
# the run's artifacts; scripts/verify/activity-boards.py puts them beside the mocks.
# Rules (BEHAVIOUR.md): ACT-12 at the end (a tester's tab bar is Home and Read; Weak spots' "See all"
# opens Pages by strength, subflows/tabs-merge-screens.yaml). The rest looks; it doesn't test the rules.
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T20:00
      BOUNDARY: midnight
- runFlow: ../subflows/seed-activity.yaml
# The account's new settings (the Fajr boundary, 20 pages a day) load at the next start, and the app
# puts the mocks' recordings in place.
- runFlow:
    file: ../subflows/relaunch-recordings.yaml
    env:
      SET: activity
- runFlow: ../subflows/backup-notice.yaml
- runFlow:
    file: ../subflows/activity-screens.yaml
    env:
      THEME: light
- runFlow:
    file: ../subflows/tabs-merge-screens.yaml
    env:
      THEME: light
