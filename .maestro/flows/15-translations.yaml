# QuranEnc's translations in the verse sheet (testers; TRANS-*), on both platforms: Saheeh
# International as everyone has it, the testers' picker and its search, then Al-Ikhlas 2 in one
# translation per script the app shows (right to left: Urdu, Persian, Kurdish, Pashto, Uyghur,
# N'Ko). E2E builds fetch nothing, so they write the recorded translations to the phone and open the
# real verse sheet by a link (src/lib/e2e/demoTranslations.ts). Nobody signs in: the sheet opens over
# the sign-in screen of a fresh install, which is what shows behind it in the screenshots. The screenshots are the proof that
# every script renders with the system fonts and lays out the right way.
# Rules (BEHAVIOUR.md): TRANS-1, TRANS-2, TRANS-3, TRANS-5, TRANS-8
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/launch.yaml
    env:
      CLOCK: 2026-11-08T10:00

# Saheeh International, as everyone has it: its footnote under the verse, its credit.
- runFlow:
    file: ../subflows/verse-link.yaml
    env:
      THEME: light
      T: en.sahih
      CREDIT: "Saheeh International, issued by Noor International Center.*"
- assertVisible:
    id: verse-footnotes
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: t01-saheeh

# The testers' picker: ⋯ → Select translation. Selected first, then every language.
- tapOn:
    id: verse-more
- tapOn:
    id: verse-select-translation
- extendedWaitUntil:
    visible:
      id: translation-picker
    timeout: 5000
- assertVisible:
    id: translation-section-selected
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: t02-picker

# Favorites: French and Turkish starred, listed under Selected in that order; then Edit.
- tapOn:
    id: translation-search
- inputText: "rashid"
- tapOn:
    id: translation-star-qe.french_rashid
- tapOn:
    id: translation-search-clear
- tapOn:
    id: translation-search
- inputText: "shaban"
- tapOn:
    id: translation-star-qe.turkish_shaban
- tapOn:
    id: translation-search-clear
# The keyboard away: the Search key on iOS (a single-line field), hideKeyboard on Android.
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- extendedWaitUntil:
    visible:
      id: translation-section-favorites
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: t02b-favorites
- tapOn:
    id: translation-edit
- extendedWaitUntil:
    visible:
      id: translation-up-qe.turkish_shaban
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: t02c-edit
- tapOn:
    id: translation-edit

# A search by the language's own name, then the choice: the verse in Urdu, right to left.
- tapOn:
    id: translation-search
- inputText: "urdu"
- extendedWaitUntil:
    visible:
      id: translation-row-qe.urdu_junagarhi
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: t03-search
- tapOn:
    id: translation-row-qe.urdu_junagarhi
- extendedWaitUntil:
    visible:
      text: "Translated by Muhammad Ibrahim Junagarhi.*"
    timeout: 10000
- assertVisible:
    id: verse-footnotes
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: t04-urdu-chosen

# Every script.
