# Revo, the assistant (previewTester accounts; an E2E build shows it to every account, with an
# in-memory stand-in for its server: src/lib/e2e/revoFake.ts). Takes a screenshot of each
# screen the mocks show (~/Documents/revisely-today-mocks/revo), for the screenshot-vs-mock boards,
# in light and then in dark (…-dark), and the sheet with the keyboard up (r5k-keyboard).
# Rules (BEHAVIOUR.md): REVO-20, REVO-21, REVO-22, REVO-24, REVO-25
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T21:41
      BOUNDARY: midnight

# REVO-21: the button on Home; its first tap opens the opt-in.
- extendedWaitUntil:
    visible:
      id: revo-button
    timeout: 15000
- tapOn:
    id: revo-button
- extendedWaitUntil:
    visible: "Meet Revo"
    timeout: 10000
- assertVisible: "Your notes and recordings stay private"
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r9-opt-in
- tapOn:
    id: revo-turn-on

# REVO-20: the greeting, from today's plan, and suggestions.
- extendedWaitUntil:
    visible:
      id: revo-greeting
    timeout: 10000
- assertVisible:
    id: revo-greeting
    text: "Salaam.* Today is .* pages, starting at p\\. .*"
# By id: on iOS a chip's accessibility label ("Ask: How was my week?") stands for its text. The id
# is a pattern (Maestro reads it as one), so not its "?".
- assertVisible:
    id: "revo-chip-How was my week.*"
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r4-sheet

# + : a day attached, the menu open over it.
- tapOn:
    id: revo-plus
- tapOn:
    id: revo-add-day
- tapOn:
    id: revo-pick-day-0
- extendedWaitUntil:
    visible:
      id: revo-context-chip
    timeout: 5000
- tapOn:
    id: revo-plus
- assertVisible: "Add to your question"
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r6-context
- tapOn:
    id: revo-plus
- tapOn:
    id: revo-context-remove

# A conversation: a chart and one plan that waits for a tap.
- tapOn:
    id: revo-input
- inputText: "Why do these two keep slipping?"
# REVO-24: with the keyboard up the header and the greeting stay on screen; the composer rides up.
- assertVisible:
    id: revo-history
- assertVisible:
    id: revo-greeting
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r5k-keyboard
- tapOn:
    id: revo-send
- extendedWaitUntil:
    visible:
      id: revo-plan
    timeout: 15000
- assertVisible:
    id: revo-chart-pageRatings
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r5-conversation
- tapOn:
    id: revo-plan-do
- extendedWaitUntil:
    visible:
      id: revo-plan-added
    timeout: 10000

# Tonight's Day in review written, and a few things Revo remembers.
- runFlow:
    file: ../subflows/revo-link.yaml
    env:
      QUERY: review=1&memory=1&day=2026-11-03

# History: the conversation and the Day in review.
- tapOn:
    id: revo-history
- extendedWaitUntil:
    # The row's label on iOS is "Day in review, <its line>".
    visible: "Day in review.*"
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r7-history
- tapOn:
    id: revo-back

# Memory: the items, the switch, Clear.
- tapOn:
    id: revo-memory
- extendedWaitUntil:
    visible: "Let Revo remember"
    timeout: 5000
- assertVisible: "You like short, practical plans."
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r8-memory
- tapOn:
    id: revo-back

# REVO-22: the day's questions used.
- runFlow:
    file: ../subflows/revo-link.yaml
    env:
      QUERY: left=0&day=2026-11-03
- extendedWaitUntil:
    visible:
      id: revo-limit
    timeout: 10000
- assertVisible: "Revo is back at midnight. Your conversations stay in History."
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r10-limit

# Closed (a drag down halves a full sheet, a second closes it): the button on Home, its dot
# for the Day in review not opened yet.
- repeat:
    while:
      visible:
        id: revo-sheet-handle
    times: 3
    commands:
      - swipe:
          from:
            id: revo-sheet-handle
          direction: DOWN
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible:
      id: revo-button-dot
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r1-fab-home

# The button on Activity too.
- tapOn:
    id: open-activity
- extendedWaitUntil:
    visible:
      id: revo-button
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r2-fab-activity

# The same screens in dark: Settings → Theme → Dark, then Revo off (as Settings → Revo AI would
# turn it off) so its opt-in shows again, with the day's questions back.
- runFlow:
    file: ../subflows/back-home.yaml
- tapOn:
    id: open-settings
# Centred: stopped at its first sight, the row sat behind the tab bar and the tap opened Insights.
- scrollUntilVisible:
    element: "Theme"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Dark"
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 10000
- runFlow:
    file: ../subflows/revo-link.yaml
    env:
      QUERY: optin=0&left=20&day=2026-11-03
- extendedWaitUntil:
    visible:
      id: revo-button
    timeout: 10000
- tapOn:
    id: revo-button
- extendedWaitUntil:
    visible: "Meet Revo"
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r9-opt-in-dark
- tapOn:
    id: revo-turn-on
- extendedWaitUntil:
    visible:
      id: revo-greeting
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r4-sheet-dark
- tapOn:
    id: revo-input
- inputText: "Why do these two keep slipping?"
- assertVisible:
    id: revo-history
- assertVisible:
    id: revo-greeting
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r5k-keyboard-dark
- tapOn:
    id: revo-send
- extendedWaitUntil:
    visible:
      id: revo-plan
    timeout: 15000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r5-conversation-dark
- repeat:
    while:
      visible:
        id: revo-sheet-handle
    times: 3
    commands:
      - swipe:
          from:
            id: revo-sheet-handle
          direction: DOWN
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible:
      id: revo-button
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: r1-fab-home-dark
