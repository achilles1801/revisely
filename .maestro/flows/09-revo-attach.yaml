# Revo's Add to chat (+, REVO-32, REVO-33): one sheet for a surah, a juz, days or pages, several at
# once, each row with a line of the account's own data. The account has the Revo mocks' history
# (Juz 28, 548–549 weak, today 6 of 20: scripts/seed-revo.js), and every screen of the approved
# mocks (~/Documents/revisely-today-mocks/revo/attach, a1–a7) is taken in light and then in dark,
# for the screenshot-vs-mock boards (revo/attach/scripts/boards.py there).
# Rules (BEHAVIOUR.md): REVO-32, REVO-33
# Then Insights' Recitation section (Revisely Dev, RINS-2) for an account that recites: takes kept by Recite's memory
# (scripts/seed-recite-takes.js: An-Naba 1–16 slipping at ayahs 9 and 14, Al-Infitar 14 going on with Al-Mutaffifin
# 23, Al-Falaq 3 ended as ayah 5 ends, then cleared), the Dev UI on with `e2e/recite-live`. Screenshots
# 09-activity-recitation-*: the section's top and end, Smart Tracking on in light and dark, then off in dark (no strength:
# rows say when a passage was last recited). Its rules: RecitationInsights.test.tsx and reciteInsights.property.ts.
# It was at the end of 09-insights-history, which it took past iOS's 20 minutes (#663's run 43842097868); here it sits
# beside what Revo makes of the same takes.
appId: ${APP_ID}
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T21:41
      BOUNDARY: midnight
- runScript:
    file: ../scripts/server-revo.js
    env:
      MODE: tester
# Revo's functions run once each first, changing nothing (as in 09-revo): a function's first
# signed-in call in the emulator is slow on a CI macOS runner (17–22 s).
- runScript:
    file: ../scripts/server-revo.js
    env:
      MODE: warm
- runFlow: ../subflows/seed-revo.yaml
# Tue 27 October with ratings, a timed read and two notes: every row of the day preview (a4).
- runScript: ../scripts/seed-revo-day.js

# Revo on (its opt-in), then Add to chat in light.
- extendedWaitUntil:
    visible:
      id: revo-button
    timeout: 15000
- runFlow:
    file: ../subflows/tap-to-open.yaml
    env:
      ID: revo-button
      OPENS: "whats-new-moment-skip|whats-new-revo-moment|revo-optin"
# REVO-39: the first open while Revo is off plays Revo's moment, then its opt-in. Skip ends it; while
# it plays the screen never settles, so these taps don't wait for it (.maestro/README.md).
- runFlow: ../subflows/revo-moment-skip.yaml
- extendedWaitUntil:
    visible: "Meet Revo"
    timeout: 40000
- tapOn:
    id: revo-turn-on
# Once revoSetOptions has answered: 30 s, as in 09-revo.
- extendedWaitUntil:
    visible:
      id: revo-greeting
    timeout: 30000
- runFlow:
    file: ../subflows/revo-attach-screens.yaml
    env:
      SUFFIX: ""

# The same in dark: Revo's sheet down, Settings → Theme → Dark, Revo again.
- runFlow: ../subflows/revo-close.yaml
- runFlow:
    file: ../subflows/theme.yaml
    env:
      THEME: Dark
- extendedWaitUntil:
    visible:
      id: revo-button
    timeout: 10000
- runFlow:
    file: ../subflows/tap-to-open.yaml
    env:
      ID: revo-button
      OPENS: revo-input
- extendedWaitUntil:
    visible:
      id: revo-input
    timeout: 10000
- runFlow:
    file: ../subflows/revo-attach-screens.yaml
    env:
      SUFFIX: "-dark"
# An account that recites (Revisely Dev): a fresh install, so light.
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-16T20:00
      BOUNDARY: midnight
- runScript:
    file: ../scripts/seed-recite-takes.js
- runFlow: ../subflows/relaunch.yaml
- runFlow: ../subflows/backup-notice.yaml
- openLink:
    link: revisely://e2e/recite-live?on=1
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- runFlow:
    file: ../subflows/recitation-insights.yaml
    env:
      NAME: 09-activity-recitation-light
- assertVisible:
    id: insights-recitation-strong-82-14
- runFlow: ../subflows/back-home.yaml
- runFlow:
    file: ../subflows/theme.yaml
    env:
      THEME: Dark
- runFlow:
    file: ../subflows/recitation-insights.yaml
    env:
      NAME: 09-activity-recitation-dark
- runFlow: ../subflows/back-home.yaml
# Smart Tracking off: the account written again, the app opened again (the Dev UI's switch is kept in memory only).
- runScript:
    file: ../scripts/seed-recite-takes.js
    env:
      SMART: "off"
- runFlow: ../subflows/relaunch.yaml
- openLink:
    link: revisely://e2e/recite-live?on=1
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- runFlow:
    file: ../subflows/recitation-insights.yaml
    env:
      NAME: 09-activity-recitation-off-dark
- assertNotVisible:
    id: insights-recitation-strong-82-14
