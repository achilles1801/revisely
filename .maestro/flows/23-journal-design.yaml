# The journal's new look (Revisely Dev; `e2e/journal-design` turns it on here): Home's row, the day's entry under the
# calendar, and Revised elsewhere's search and juz grid. Every screen in light and dark, each beside its mock in
# ~/Documents/revisely-today-mocks/journal-and-elsewhere/png.
# Rules (BEHAVIOUR.md): ACT-33, ACT-34, HOME-2
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T20:00
      BOUNDARY: midnight
- runFlow: ../subflows/seed-activity.yaml
- runFlow:
    file: ../subflows/relaunch-recordings.yaml
    env:
      SET: activity
- runFlow: ../subflows/backup-notice.yaml
- openLink:
    link: revisely://e2e/journal-design?on=1
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- extendedWaitUntil:
    visible:
      id: today-journal
    timeout: 20000
- runFlow:
    file: ../subflows/journal-design-screens.yaml
    env:
      THEME: light
- runFlow:
    file: ../subflows/theme.yaml
    env:
      THEME: Dark
- runFlow:
    file: ../subflows/journal-design-screens.yaml
    env:
      THEME: dark
