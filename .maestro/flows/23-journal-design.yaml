# The journal's new look and Home, version 3 (Revisely Dev; `e2e/journal-design` and `e2e/home-v3` turn them on here):
# Home with no journal row or Recent sessions, the day's entry under the calendar, and Revised elsewhere's search and juz
# grid. Every screen in light and dark, each beside its mock in ~/Documents/revisely-today-mocks/journal-and-elsewhere/png
# (Home: ~/Documents/revisely-today-mocks/home-v3/png/v2).
# Rules (BEHAVIOUR.md): ACT-33, ACT-34, HOME-4
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T20:00
      BOUNDARY: midnight
- runFlow: ../subflows/seed-activity.yaml
- runFlow:
    file: ../subflows/relaunch-recordings.yaml
    env:
      SET: activity
- runFlow: ../subflows/backup-notice.yaml
- openLink:
    link: revisely://e2e/journal-design?on=1
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- openLink:
    link: revisely://e2e/home-v3?on=1
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: home-recent
    timeout: 10000
- runFlow:
    file: ../subflows/journal-design-screens.yaml
    env:
      THEME: light
- runFlow:
    file: ../subflows/theme.yaml
    env:
      THEME: Dark
- runFlow:
    file: ../subflows/journal-design-screens.yaml
    env:
      THEME: dark
