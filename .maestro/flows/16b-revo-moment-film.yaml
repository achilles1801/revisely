# TEMPORARY, never merged (branch claude/whats-new-revo-moment-film): a filmstrip of What's new's
# Revo moment for review, about a frame a second. Light as App Store users will see it (Show What's new
# at launch), then dark from the replay. waitForAnimationToEnd never settles while it plays, so each one
# is a pause of its timeout.
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T19:00
      BOUNDARY: midnight
- runScript:
    file: ../scripts/server-revo.js
    env:
      MODE: tester
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 20000
- tapOn:
    id: open-settings
- scrollUntilVisible:
    element:
      id: settings-whats-new-launch
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: settings-whats-new-launch
- runFlow: ../subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: whats-new-forced
    timeout: 20000
- tapOn:
    id: whats-new-next
- tapOn:
    id: whats-new-next
- tapOn:
    id: whats-new-next
    waitToSettleTimeoutMs: 100
    retryTapIfNoChange: false
- takeScreenshot: rm-light-01
- waitForAnimationToEnd:
    timeout: 600
- takeScreenshot: rm-light-02
- waitForAnimationToEnd:
    timeout: 600
