# Activity's "Add to today" (the day's +, as trimmed on Nov 7 2026): Revised elsewhere logs today's
# pages not revised and the day shows them at once, then has none left to offer; Memorized and a note
# show at once; the Memorized picker has its wheel; pages logged by hand are deleted from the Revised
# block's menu; yesterday's + says "Add to yesterday"; an older day's + opens a note straight away.
# Rules (BEHAVIOUR.md): ACT-5, ACT-13, ACT-14, ACT-17
# The account is the Activity mocks' (scripts/seed-activity.js): today is Tuesday 3 November, its
# session 18 of 20 with At-Taghabun (556–557) not revised, p. 562 memorized, 562–563 read at 8:05.
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T20:00
      BOUNDARY: midnight
- runFlow: ../subflows/seed-activity.yaml
# The seeded settings (20 pages a day, the Fajr boundary) load at the next start.
- runFlow: ../subflows/relaunch.yaml
- runFlow: ../subflows/backup-notice.yaml
- tapOn:
    id: open-activity
- extendedWaitUntil:
    visible:
      id: activity-blocks-views
    timeout: 20000
- tapOn:
    id: calendar-day-2026-11-03
- tapOn: "Open the day"
# A block's header is one element for VoiceOver: its title and figure read together ("Revised, 18 of 20").
- extendedWaitUntil:
    visible: "Revised, 18 of 20"
    timeout: 15000

# The + for today: Revised elsewhere, Memorized, Note; no Read.
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- assertVisible: "Add to today"
- assertNotVisible:
    id: sheet-action-read

# Revised elsewhere (ACT-5, ACT-13): today's two pages not revised, ticked; Add: 20 of 20 at once.
- tapOn:
    id: sheet-action-revised
- extendedWaitUntil:
    visible:
      id: add-revised-page-557
    timeout: 10000
# Each sheet slides up; a tap while it moves can miss (iOS).
- waitForAnimationToEnd
- assertVisible:
    id: add-revised-page-556
- tapOn:
    id: add-revised-add
- extendedWaitUntil:
    notVisible:
      id: add-revised-sheet
    timeout: 10000
- extendedWaitUntil:
    visible: "Revised, 20 of 20"
    timeout: 10000

# Nothing left to offer.
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- tapOn:
    id: sheet-action-revised
- extendedWaitUntil:
    visible:
      id: add-revised-none
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible:
      id: add-revised-sheet
    timeout: 10000

# Memorized (ACT-5, ACT-13): "From your reading" (p. 563), Add: the block reads 2 pages at once.
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- tapOn:
    id: sheet-action-memorized
- extendedWaitUntil:
    visible:
      id: add-memorized-from-reading
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: add-memorized-from-reading-action
- tapOn:
    id: add-memorized-add
- extendedWaitUntil:
    notVisible:
      id: add-memorized-sheet
    timeout: 10000
- extendedWaitUntil:
    visible: "Memorized, 2 pages"
    timeout: 10000

# Note (ACT-13): shows in the day's Notes at once.
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- tapOn:
    id: sheet-action-note
- extendedWaitUntil:
    visible:
      id: add-note-sheet
    timeout: 10000
- waitForAnimationToEnd
# The field takes focus as the sheet opens (a multiline field's testID doesn't reach iOS).
- inputText: "Added from the plus"
- tapOn:
    id: add-note-add
- extendedWaitUntil:
    notVisible:
      id: add-note-sheet
    timeout: 10000
# The seeded day has one note; the header reads its count (a note row is a button to the log on iOS).
- scrollUntilVisible:
    element: "Notes, 2"
    direction: DOWN
    timeout: 10000

# The Memorized picker (ACT-5): its wheel shows, and Use fills the surah's pages. It opens on
# Al-Fatihah (its rows can't be tapped by id on iOS: the wheel is one adjustable element).
- scrollUntilVisible:
    element:
      id: activity-block-revised
    direction: UP
    timeout: 10000
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- tapOn:
    id: sheet-action-memorized
- extendedWaitUntil:
    visible:
      id: add-memorized-sheet
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: add-memorized-tab-surah
- extendedWaitUntil:
    visible:
      id: range-wheel
    timeout: 10000
- tapOn:
    id: range-use
- extendedWaitUntil:
    visible:
      id: add-memorized-from
      text: "1"
    timeout: 10000
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible:
      id: add-memorized-sheet
    timeout: 10000

# ACT-14: the pages logged by hand go from the Revised block's menu, confirmed: 18 of 20 again.
- longPressOn:
    id: activity-block-revised-header
- tapOn: "Delete At.Taghabun, added by hand"
- tapOn: "(?i)delete"
- extendedWaitUntil:
    visible: "Revised, 18 of 20"
    timeout: 10000

# Yesterday: its + says so. (The screen's own back button: iOS has no system back.)
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: activity-blocks-views
    timeout: 20000
- tapOn:
    id: calendar-day-2026-11-02
- tapOn: "Open the day"
- extendedWaitUntil:
    visible:
      id: activity-day-v2
    timeout: 15000
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible: "Add to yesterday"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "Close"

# ACT-17: Sunday, before yesterday: the + opens a note at once, no menu.
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: activity-blocks-views
    timeout: 20000
- tapOn:
    id: calendar-day-2026-11-01
- tapOn: "Open the day"
- extendedWaitUntil:
    visible: "Revised, 6 of 20"
    timeout: 15000
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: add-note-sheet
    timeout: 10000
- assertNotVisible:
    id: activity-add-menu
