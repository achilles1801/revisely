# Activity's "Add to today" (the day's +): each row's sheet saves, and the day shows the add the
# moment the sheet closes; what was added isn't offered again; the Surah picker has its wheel; a page
# added by hand is deleted from the Revised block's menu; a past day's + says its day.
# Rules (BEHAVIOUR.md): ACT-5, ACT-13, ACT-14
# The account is the Activity mocks' (scripts/seed-activity.js): today is Tuesday 3 November, its
# session 18 of 20 with At-Taghabun (556–557) skipped, p. 562 memorized, 562–563 read at 8:05.
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T20:00
      BOUNDARY: midnight
- runFlow: ../subflows/seed-activity.yaml
# The seeded settings (20 pages a day, the Fajr boundary) load at the next start.
- runFlow: ../subflows/relaunch.yaml
- runFlow: ../subflows/backup-notice.yaml
- tapOn:
    id: open-activity
- extendedWaitUntil:
    visible:
      id: activity-blocks-views
    timeout: 20000
- tapOn:
    id: calendar-day-2026-11-03
- tapOn: "Open the day"
# A block's header is one element for VoiceOver: its title and figure read together ("Revised, 18 of 20").
- extendedWaitUntil:
    visible: "Revised, 18 of 20"
    timeout: 15000

# Revised (ACT-5, ACT-13): the session's skipped pages, Weak, Add: the day reads 20 of 20 at once.
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- assertVisible: "Add to today"
- tapOn:
    id: sheet-action-revised
- extendedWaitUntil:
    visible:
      id: add-revised-from-session
    timeout: 10000
# Each sheet slides up; a tap while it moves can miss (iOS).
- waitForAnimationToEnd
- tapOn:
    id: add-revised-from-session
- tapOn:
    id: add-revised-strength-weak
- assertVisible: "Adding these makes today 20 of 20."
- tapOn:
    id: add-revised-add
- extendedWaitUntil:
    notVisible:
      id: add-revised-sheet
    timeout: 10000
- extendedWaitUntil:
    visible: "Revised, 20 of 20"
    timeout: 10000

# Added, so no longer offered: no "From your session" in the menu.
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- assertNotVisible:
    id: add-from-session

# Memorized (ACT-5, ACT-13): "From your reading" (p. 563), Add: the block reads 2 pages at once.
- tapOn:
    id: sheet-action-memorized
- extendedWaitUntil:
    visible:
      id: add-memorized-from-reading
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: add-memorized-from-reading-action
- tapOn:
    id: add-memorized-add
- extendedWaitUntil:
    notVisible:
      id: add-memorized-sheet
    timeout: 10000
# The block's header reads its title and figure together.
- extendedWaitUntil:
    visible: "Memorized, 2 pages"
    timeout: 10000

# Note (ACT-13): shows in the day's Notes at once.
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- tapOn:
    id: sheet-action-note
- extendedWaitUntil:
    visible:
      id: add-note-sheet
    timeout: 10000
- waitForAnimationToEnd
# The field takes focus as the sheet opens (a multiline field's testID doesn't reach iOS).
- inputText: "Added from the plus"
- tapOn:
    id: add-note-add
- extendedWaitUntil:
    notVisible:
      id: add-note-sheet
    timeout: 10000
# The seeded day has one note; the header reads its count (a note row is a button to the log on iOS).
- scrollUntilVisible:
    element: "Notes, 2"
    direction: DOWN
    timeout: 10000

# The Surah picker (ACT-5): its wheel shows, and Use fills the surah's pages.
- scrollUntilVisible:
    element:
      id: activity-block-revised
    direction: UP
    timeout: 10000
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible:
      id: activity-add-menu
    timeout: 10000
- tapOn:
    id: sheet-action-revised
- extendedWaitUntil:
    visible:
      id: add-revised-sheet
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: add-revised-what-surah
- extendedWaitUntil:
    visible:
      id: range-wheel
    timeout: 10000
# The wheel opens on Al-Fatihah. (Its rows can't be tapped by id on iOS: the wheel is one adjustable
# element for VoiceOver.)
- tapOn:
    id: range-use
- extendedWaitUntil:
    visible:
      id: add-revised-range
      text: "Al.Fatihah · 1 page"
    timeout: 10000
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible:
      id: add-revised-sheet
    timeout: 10000

# ACT-14: the pages added by hand go from the Revised block's menu, confirmed: 18 of 20 again.
- longPressOn:
    id: activity-block-revised-header
- tapOn: "Delete At.Taghabun, added by hand"
- tapOn: "(?i)delete"
- extendedWaitUntil:
    visible: "Revised, 18 of 20"
    timeout: 10000

# A past day: its + says its day. (The screen's own back button: iOS has no system back.)
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: activity-blocks-views
    timeout: 20000
- tapOn:
    id: calendar-day-2026-11-01
- tapOn: "Open the day"
- extendedWaitUntil:
    visible: "Revised, 6 of 20"
    timeout: 15000
- tapOn:
    id: day-add
- extendedWaitUntil:
    visible: "Add to Sunday"
    timeout: 10000
