# The help buttons, for a previewTester account (marked one through the emulator, as the owner's script
# does): Home's ? on the Today post opens "How Home works"; the sheet closes; "Hide help buttons" takes the
# ? away with a toast and Undo; hidden it stays hidden after a relaunch, until Settings → Support → Help
# buttons brings it back. Screenshots of the button, the sheet and the toast (h1–h3).
# Rules (BEHAVIOUR.md): HELP-1, HELP-2
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T19:00
      BOUNDARY: midnight
# A tester (help is theirs only, for now): the app sees it when its user document changes.
- runScript:
    file: ../scripts/server-revo.js
    env:
      MODE: tester

# HELP-1: the ? at the right of the Today post's header, and its sheet.
- extendedWaitUntil:
    visible:
      id: help-button-home
    timeout: 20000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: h1-home-help-button
- tapOn:
    id: help-button-home
- extendedWaitUntil:
    visible:
      id: help-sheet-home
    timeout: 10000
- assertVisible: "How Home works"
# A topic is one element (iOS reads it whole), so by id: its label starts with its title.
- assertVisible:
    id: help-topic-home.missed
    text: "Missed days, .*"
- assertVisible:
    id: help-topic-home.streak
    text: "Streak, .*"
- assertVisible:
    id: help-ask-revo
- assertVisible:
    id: help-hide
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: h2-help-sheet
# Closed (a tap on the backdrop), the ? stays.
- runFlow: ../subflows/close-sheet.yaml
- extendedWaitUntil:
    notVisible:
      id: help-sheet-home
    timeout: 10000
- assertVisible:
    id: help-button-home

# HELP-2: Hide help buttons, with Undo; then hidden for good (until Settings).
- tapOn:
    id: help-button-home
- extendedWaitUntil:
    visible:
      id: help-hide
    timeout: 10000
# The sheet slides up; a tap while it moves can miss (iOS).
- waitForAnimationToEnd
- tapOn:
    id: help-hide
# Undo at once: its toast lasts six seconds, and with the checks and the screenshot before it the
# tap came after them on iOS (#328's run 42483723092). They are on the second hide, below.
- tapOn:
    id: undo-toast-action
- extendedWaitUntil:
    visible:
      id: help-button-home
    timeout: 10000
# Hidden again: the ? goes, Home says how to bring it back, and it stays hidden after a relaunch.
- tapOn:
    id: help-button-home
- extendedWaitUntil:
    visible:
      id: help-hide
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: help-hide
- extendedWaitUntil:
    visible: "Help buttons hidden.*"
    timeout: 10000
- assertNotVisible:
    id: help-button-home
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: h3-help-hidden
- runFlow: ../subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 20000
- assertNotVisible:
    id: help-button-home

# Settings → Support → Help buttons: off; turned on, the ? is back on Home.
- tapOn:
    id: open-settings
- runFlow:
    file: ../subflows/settings-row.yaml
    env:
      ROW: settings-help-buttons
- tapOn:
    id: settings-help-buttons
- runFlow: ../subflows/back-home.yaml
- extendedWaitUntil:
    visible:
      id: help-button-home
    timeout: 10000
