# The help buttons, for an account that isn't a tester (help is every account's since the November
# 2026 release, HELP_FOR_EVERYONE): Home's ? on the Today post opens "How Home works"; the sheet
# closes; "Hide help buttons" takes the ? away with a toast and Undo; hidden it stays hidden after a
# relaunch, until Settings → Support → Help buttons brings it back. Screenshots of the button, the
# sheet and the toast (h1–h3).
# Rules (BEHAVIOUR.md): HELP-1, HELP-2
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T19:00
      BOUNDARY: midnight

# HELP-1: the ? at the right of the Today post's header, and its sheet.
- extendedWaitUntil:
    visible:
      id: help-button-home
    timeout: 20000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: h1-home-help-button
- tapOn:
    id: help-button-home
- extendedWaitUntil:
    visible:
      id: help-sheet-home
    timeout: 10000
- assertVisible: "How Home works"
# A topic is one element (iOS reads it whole), so by id: its label starts with its title.
- assertVisible:
    id: help-topic-home.missed
    text: "Missed days, .*"
- assertVisible:
    id: help-topic-home.streak
    text: "Streak, .*"
# "Ask Revo ›" only while Revo is on for the account: Revo follows config/app.revo, unset here
# (testers), so not for this one.
- assertNotVisible:
    id: help-ask-revo
- assertVisible:
    id: help-hide
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: h2-help-sheet
# Closed (a tap on the backdrop), the ? stays.
- runFlow: ../subflows/close-sheet.yaml
- extendedWaitUntil:
    notVisible:
      id: help-sheet-home
    timeout: 10000
- assertVisible:
    id: help-button-home

# HELP-2: Hide help buttons, with Undo; then hidden for good (until Settings).
- tapOn:
    id: help-button-home
- extendedWaitUntil:
    visible:
      id: help-hide
    timeout: 10000
# The sheet slides up; a tap while it moves can miss (iOS).
- waitForAnimationToEnd
- tapOn:
    id: help-hide
# Undo at once: its toast lasts six seconds, and with the checks and the screenshot before it the
# tap came after them on iOS (#328's run 42483723092). They are on the second hide, below.
- tapOn:
    id: undo-toast-action
- extendedWaitUntil:
    visible:
      id: help-button-home
    timeout: 10000
# Hidden again: the ? goes, Home says how to bring it back, and it stays hidden after a relaunch.
- tapOn:
    id: help-button-home
- extendedWaitUntil:
    visible:
      id: help-hide
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: help-hide
- extendedWaitUntil:
    visible: "Help buttons hidden.*"
    timeout: 10000
- assertNotVisible:
    id: help-button-home
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: h3-help-hidden
- runFlow: ../subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 20000
- assertNotVisible:
    id: help-button-home

# Settings → Support → Help buttons: off; turned on, the ? is back on Home.
- tapOn:
    id: open-settings
- runFlow:
    file: ../subflows/settings-row.yaml
    env:
      ROW: settings-help-buttons
- tapOn:
    id: settings-help-buttons
# The switch reads on before Home is looked at: a tap that didn't take (the list still moving) fails here
# as what it is, and a ? missing from Home with the switch on would be the app's.
- extendedWaitUntil:
    visible:
      id: settings-help-buttons
      checked: true
    timeout: 5000
- runFlow: ../subflows/back-home.yaml
- extendedWaitUntil:
    visible:
      id: help-button-home
    timeout: 10000
