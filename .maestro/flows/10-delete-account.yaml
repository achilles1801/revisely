# Delete account: Settings → your account → Delete account, confirmed twice. The real deleteUserAccount function
# (in the functions emulator) removes the account and its data from the server, and the app is
# back at sign-in.
# Rules (BEHAVIOUR.md): ACCOUNT-1
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T20:00
      BOUNDARY: midnight
# The function once first, as an account of its own, so the flow's call finds its worker started: the
# first call took 47 s on iOS (run 42594658944), past the app's 30 s (scripts/warm-delete.js).
- runScript: ../scripts/warm-delete.js
# The app sends the new account's pages from its outbox once onboarding is done: look again until
# they are on the server (about 2 s a look; they went out 19 s after Home showed on iOS in run
# 42573714262), then check.
- repeat:
    while:
      true: ${!(output.serverPagesCount > 0)}
    times: 20
    commands:
      - runScript: ../scripts/server-account.js
      - runFlow:
          when:
            true: ${!(output.serverPagesCount > 0)}
          commands:
            - extendedWaitUntil:
                visible:
                  id: e2e-never-shown
                timeout: 2000
                optional: true
- assertTrue:
    condition: ${output.accountExists && output.userDocExists && output.serverPagesCount > 0}
    label: The server has the new account, its user document and its pages

- tapOn:
    id: open-settings
# Settings → your account (SET-1: the first level's top row) → Delete account, at the Account page's foot.
- runFlow:
    file: ../subflows/tap-to-open.yaml
    env:
      ID: settings-account
      OPENS: settings-delete-account
- tapOn:
    id: settings-delete-account
# Two confirmations (Settings), then the server deletes.
- extendedWaitUntil:
    visible:
      text: Delete account\?
    timeout: 10000
- tapOn:
    text: (?i)Delete
- extendedWaitUntil:
    visible:
      text: Are you absolutely sure\?
    timeout: 10000
- tapOn:
    text: (?i)I understand, delete
- extendedWaitUntil:
    visible:
      text: Account deleted
    timeout: 60000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: 10-account-deleted
- tapOn:
    text: (?i)OK
# Signed out: the sign-in screen.
- extendedWaitUntil:
    visible:
      id: auth-title
    timeout: 20000

# Gone on the server: the sign-in, the user document and its pages.
- runScript: ../scripts/server-account.js
- assertTrue:
    condition: ${!output.accountExists && !output.userDocExists && output.serverPagesCount == 0}
    label: The account, its user document and its pages are gone from the server
