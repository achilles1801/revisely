# The Dev app's one mic and live check on the reader (Revisely Dev only; src/lib/reciteLive), for a
# previewTester account. E2E builds have no microphone or checker: `e2e/recite-live` turns the Dev
# UI on and a take plays a recorded event log (src/lib/e2e/reciteLive.ts: An-Naml 23–24 on page
# 379 with a wrong word and a haraka slip, the moment of Majd's Tarteel screenshots of Nov 14 2026).
# Screenshots of each state for the mocks (~/Documents/revisely-recite-mocks/option-A-final-2.png and
# mistakes-toggle-after.png): the reader with the mic, the mic's menu (Mark mistakes off, then on),
# following, a mark and the score, the hidden view, done, reciting the mistakes again, and the locked switch's
# Premium page. Last, a Recite take begun in the middle of the page (An-Naml 25), as a take can start anywhere on it.
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-14T10:00
      BOUNDARY: midnight
- runScript:
    file: ../scripts/server-revo.js
    env:
      MODE: tester
# Get Premium (and Settings' Premium switch later) call devGrantPremium and devRevokePremium, and Apply for support calls
# supportLink: start their workers first, as a throwaway account (scripts/warm-premium.js), or the app's first call can
# pass its 20 s (or the flow's wait) on a CI runner.
- runScript:
    file: ../scripts/warm-premium.js
# Page 379 (An-Naml, juz 19) memorized beside the onboarding's Juz 30, for Test me below. Written by an admin, so a
# relaunch reads it (as other flows' seeds do), before the Dev UI's link, which the app keeps in memory.
- runScript:
    file: ../scripts/server-memorized.js
    env:
      PAGES: '379'
- runFlow: ../subflows/relaunch.yaml

# The Dev UI, then the reader at An-Naml 23.
- openLink:
    link: revisely://e2e/recite-live?on=1
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- openLink:
    link: revisely://read?page=379
    optional: true
- repeat:
    while:
      notVisible:
        id: reader-background
    times: 6
    commands:
      - runFlow: ../subflows/open-link-prompt.yaml
      - extendedWaitUntil:
          visible:
            id: reader-background
          timeout: 4000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: reader-background
          commands:
            - openLink:
                link: revisely://read?page=379
                optional: true

# The controls: one mic (no record button) and the eye.
- runFlow: ../subflows/reader-controls.yaml
- assertNotVisible: "Record your recitation"
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl01-reader

# The reader's help, with Recite: its recording topic tells of holding the mic for Recite (lib/help/topics).
- tapOn:
    id: help-button-reader
- extendedWaitUntil:
    visible:
      id: help-sheet-reader
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl01b-help-reader
- tapOn:
    id: help-done
- extendedWaitUntil:
    notVisible:
      id: help-sheet
    timeout: 5000

# Hold the mic: Record and Recite. A new account has no Premium: Mark mistakes is locked, and a tap opens the
# Premium page. Get Premium (Revisely Dev's free grant, devGrantPremium in the functions emulator) turns it on.
- longPressOn:
    id: recite-mic
- extendedWaitUntil:
    visible:
      id: recite-mode-menu
    timeout: 5000
- assertVisible:
    id: recite-mistakes-locked
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl02-menu
- tapOn:
    id: recite-mistakes
- extendedWaitUntil:
    visible:
      id: check-intro
    timeout: 5000
- tapOn:
    id: check-intro-get
- extendedWaitUntil:
    visible: "Turn on"
    timeout: 5000
- assertVisible: "Premium in Revisely Dev"
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl02a-premium-free
- tapOn: "Turn on"
- extendedWaitUntil:
    notVisible:
      id: check-intro
    timeout: 30000

# Premium on: Mark mistakes unlocks. Switch it on (the menu stays), then Recite.
- longPressOn:
    id: recite-mic
- extendedWaitUntil:
    visible:
      id: recite-mistakes-off
    timeout: 10000
- tapOn:
    id: recite-mistakes
- assertVisible:
    id: recite-mistakes-on
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl02b-menu-marks
- tapOn:
    id: recite-mode-recite

# The AI notice, once; then the take.
- extendedWaitUntil:
    visible:
      id: recite-notice-agree
    timeout: 5000
- tapOn:
    id: recite-notice-agree
- extendedWaitUntil:
    visible:
      id: recite-words
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl03-following

# The wrong word marked, the score by the page.
- extendedWaitUntil:
    visible:
      id: live-mark-word
    timeout: 15000
- assertVisible:
    id: recite-score
# The marks are highlights behind their words, three colours at most (Majd, Nov 15 2026): red for words, amber for
# harakat and letters, violet for tajweed. This shot is the Premium page's preview (assets/recite/check-preview-*.png).
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl04-marks

# Tap the mark: its card (Expected and Recited), then Similar phrases (An-Naml 16 reads almost the same).
- tapOn:
    id: live-mark-word
- extendedWaitUntil:
    visible:
      id: mark-card
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl04b-card
- tapOn:
    id: mark-card-similar
- extendedWaitUntil:
    visible:
      id: similar-27-16
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl04c-similar
- runFlow: ../subflows/close-sheet.yaml

# The eye hides the page; ‹ shows the next word.
- tapOn:
    id: recite-eye
- assertVisible:
    id: recite-eye-group
- tapOn:
    id: recite-next-word
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl05-hidden
- tapOn:
    id: recite-eye

# While a take is open, the reader's ? tells how Recite works (Majd, Nov 15 2026: the help in line with Dev's Recite).
- tapOn:
    id: help-button-reader
- extendedWaitUntil:
    visible:
      id: help-sheet-recite
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl05b-help-recite
- tapOn:
    id: help-done
- extendedWaitUntil:
    notVisible:
      id: help-sheet
    timeout: 5000

# Stop: the final answer and its summary; then the page with its marks, and ✕.
- tapOn:
    id: recite-stop
- extendedWaitUntil:
    visible:
      id: take-summary
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl06-summary
- tapOn:
    id: take-summary-done
- extendedWaitUntil:
    visible:
      id: recite-close
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl07-review
- tapOn:
    id: recite-close
- assertVisible:
    id: recite-mic
# The take was kept as a recording (Save recordings, on by default; the E2E take records a tone). It stays on the
# phone (never uploaded), so no backup notice comes.
- extendedWaitUntil:
    visible: "Recording saved"
    timeout: 8000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl07b-recording-saved

# Recite's memory (RMEM-3): with the take closed, its word mistake stays on the page, lighter. A tap on it shows its
# history: this take, wrong, and the clear rule. Clear now takes it off; Undo puts it back. (The "Recording saved" note
# goes first: its View sits where Undo will.)
- extendedWaitUntil:
    notVisible: "Recording saved"
    timeout: 12000
- extendedWaitUntil:
    visible:
      id: past-mark-word
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rm01-past-marks
- tapOn:
    id: past-mark-word
- extendedWaitUntil:
    visible:
      id: past-card
    timeout: 5000
- assertVisible:
    id: past-try-wrong
- assertVisible: "Say it right on 2 different days to clear it."
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rm02-past-card
- tapOn:
    id: past-card-clear
- extendedWaitUntil:
    notVisible:
      id: past-mark-word
    timeout: 5000
- tapOn: "Undo"
- extendedWaitUntil:
    visible:
      id: past-mark-word
    timeout: 5000

# Test me (Majd, Nov 15 2026): random places in what's memorized, or in one juz of it. Page 379 (An-Naml, juz 19) was
# marked memorized at the start, beside the onboarding's Juz 30, and the test is given Juz 19, so its places are on the
# one page E2E has. At each place the page is hidden but for its ayah's first two words; the E2E take (lib/e2e/
# reciteLive's placeTake) carries on from there to the place's end, where it stops by itself: "Clean · 1 of N" and
# Next. ✕ after the second place ends the test: its summary. (Recording saved's note has gone, above: it sat over the
# mic, and a long press there was its View.)
- runFlow: ../subflows/reader-controls.yaml
- longPressOn:
    id: recite-mic
- extendedWaitUntil:
    visible:
      id: recite-mode-test
    timeout: 5000
- tapOn:
    id: recite-mode-test
- extendedWaitUntil:
    visible:
      id: test-me-juz-19
    timeout: 15000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl08a-test-me-where
- tapOn:
    id: test-me-juz-19
- extendedWaitUntil:
    visible:
      id: recite-eye-group
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl08b-test-me-place
- extendedWaitUntil:
    visible:
      id: recite-next
    timeout: 45000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl08c-test-me-clean
- tapOn:
    id: recite-next
- extendedWaitUntil:
    visible:
      id: recite-next
    timeout: 45000
- tapOn:
    id: recite-close
- extendedWaitUntil:
    visible:
      id: test-summary
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl08d-test-me-summary
- tapOn:
    id: test-summary-done
- extendedWaitUntil:
    visible:
      id: recite-mic
    timeout: 8000

# In dark: a take marking mistakes again (Mark mistakes stays on). Back from the reader is the Read tab.
- tapOn:
    id: reader-back
- tapOn:
    id: tab-Home
- runFlow:
    file: ../subflows/theme.yaml
    env:
      THEME: Dark
- openLink:
    link: revisely://read?page=379
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- extendedWaitUntil:
    visible:
      id: reader-background
    timeout: 10000
- runFlow: ../subflows/reader-controls.yaml
- tapOn:
    id: recite-mic
- extendedWaitUntil:
    visible:
      id: live-mark-word
    timeout: 20000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl08-marks-dark
- tapOn:
    id: recite-eye
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl09-hidden-dark
- tapOn:
    id: recite-eye
- tapOn:
    id: recite-stop
- extendedWaitUntil:
    visible:
      id: take-summary
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl10-summary-dark
# Recite's memory (RMEM-4): the passage's second take, so its summary has Your progress here; it opens the passage's
# progress, and Done comes back to the summary.
- extendedWaitUntil:
    visible:
      id: take-summary-progress
    timeout: 5000
- tapOn:
    id: take-summary-progress
- extendedWaitUntil:
    visible:
      id: progress-sheet
    timeout: 8000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rm03-progress-dark
- tapOn: "Done"
- extendedWaitUntil:
    visible:
      id: take-summary-drill
    timeout: 8000

# Recite the mistakes again (Majd, Nov 15 2026): one take over the stretch from the first mistake to the last, from the
# ayah before (An-Naml 22–23). It stops by itself once the checker has decided the stretch's last word, and its summary
# says what the take before found there.
- tapOn:
    id: take-summary-drill
# No wait for the bar between: the drill is short and stops by itself, so on Android its summary can be up before
# Maestro has seen the bar (#632's run 43770950205). Only the drill's summary has "Before:".
- extendedWaitUntil:
    visible:
      id: take-summary-before
    timeout: 30000
- assertVisible:
    id: take-summary-before
    text: "Before: 1 wrong word, 1 harakat slip"
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl10b-drill-summary-dark
- tapOn:
    id: take-summary-done
- tapOn:
    id: recite-close

# Premium off again (Settings → Testing → Premium: devRevokePremium): Mark mistakes is locked, and a tap opens the
# Premium page.
- tapOn:
    id: reader-back
- tapOn:
    id: tab-Home
- tapOn:
    id: open-settings
- runFlow:
    file: ../subflows/settings-row.yaml
    env:
      ROW: settings-premium
- tapOn:
    id: settings-premium
- extendedWaitUntil:
    visible:
      id: settings-premium
      checked: false
      enabled: true
    timeout: 30000
- tapOn:
    id: back
- openLink:
    link: revisely://read?page=379
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- extendedWaitUntil:
    visible:
      id: reader-background
    timeout: 10000
- runFlow: ../subflows/reader-controls.yaml
- longPressOn:
    id: recite-mic
- assertVisible:
    id: recite-mistakes-locked
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl11-menu-locked-dark
- tapOn:
    id: recite-mistakes
- extendedWaitUntil:
    visible:
      id: check-intro
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl12-check-page-dark
# Apply for support asks supportLink for the account's one-time link. The emulators' project has no program page
# (only revisely-dev has one), so the app says so in one line instead of opening the browser.
- tapOn:
    id: check-intro-support
- extendedWaitUntil:
    visible: "Applying for support isn’t open yet."
    timeout: 15000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl12b-support-dark
- tapOn: "OK"
- tapOn:
    id: check-intro-close

# Start anywhere on the page (Majd, Nov 14 2026): a take from page 379 begun at An-Naml 25, its third ayah. Mark
# mistakes is locked now, so the mic starts Recite, whose recorded take begins there: "Listening…" until the checker
# has found where (`locked`), then the cursor at An-Naml 25, and the summary names what was recited from there, not
# from the page's top.
- runFlow: ../subflows/reader-controls.yaml
- tapOn:
    id: recite-mic
- extendedWaitUntil:
    visible:
      id: recite-words
    timeout: 20000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl13-started-mid-page-dark
# An immersive page (Majd, Nov 15 2026): a tap during the take puts the header and the bar away (the status bar stays,
# the take's time by the page number); another tap brings them back.
- tapOn:
    id: reader-background
- extendedWaitUntil:
    visible:
      id: reader-take-activity
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl13b-immersive-dark
- tapOn:
    id: reader-take-activity
- extendedWaitUntil:
    visible:
      id: recite-stop
    timeout: 5000
- tapOn:
    id: recite-stop
- extendedWaitUntil:
    visible:
      id: take-summary-passage
      # iOS matches the spoken label ("ayahs 25 to 26, 7 seconds", #592), Android the text ("ayahs 25–26 · 0:07").
      text: "An.Naml,.ayahs.25.{1,4}26.*"
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl14-summary-mid-page-dark
# Without Premium the summary offers "See your mistakes": the Premium page opens once the summary has gone. Opened while
# it was still closing, iOS refused it and its invisible host took every touch: the reader froze (Majd's Dev take,
# Nov 15 2026; SHEET-1). The reader must still take taps after it.
- tapOn:
    id: take-summary-check
- extendedWaitUntil:
    visible:
      id: check-intro
    timeout: 5000
- tapOn:
    id: check-intro-close
- extendedWaitUntil:
    notVisible:
      id: check-intro
    timeout: 5000
- tapOn:
    id: recite-close
- extendedWaitUntil:
    visible:
      id: recite-mic
    timeout: 5000

# Recite's memory (RMEM-5): the day's takes in a Recited block, and Show on the page (a take on its page with its marks).
- tapOn:
    id: reader-back
- tapOn:
    id: tab-Home
- tapOn:
    id: open-activity
- extendedWaitUntil:
    visible:
      id: activity-blocks-views
    timeout: 15000
- tapOn:
    id: calendar-day-2026-11-14
- tapOn:
    id: preview-open
# The block's header, not the block: by now the day holds Test me's takes too, and the block (899pt high on the iOS
# runner, run 43843930204) is taller than the screen, so the whole of it is never visible.
- scrollUntilVisible:
    element:
      id: activity-block-recited-header
    direction: DOWN
    centerElement: true
    timeout: 15000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rm04-day-recited-dark
- scrollUntilVisible:
    element:
      id: activity-take-show
    direction: DOWN
    timeout: 10000
- tapOn:
    id: activity-take-show
- extendedWaitUntil:
    visible:
      id: shown-take-bar
    timeout: 10000
# ▶ for the take's recording, which is on the phone (the day lists it).
- extendedWaitUntil:
    visible:
      id: shown-take-play
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rm05-shown-take-dark
- tapOn:
    id: shown-take-done
- extendedWaitUntil:
    notVisible:
      id: shown-take-bar
    timeout: 5000

# A voice search with one result opens the reader reciting there (Majd, Nov 15 2026). E2E builds have no microphone or
# speech model: the search hears An-Naml 25's opening words (lib/e2e/voiceSearch), its one result opens page 379 with a
# Recite take already listening (no tap on the reader's mic), and the recorded take, begun at An-Naml 25, follows.
- openLink:
    link: revisely://e2e/voice-search?heard=%D8%A3%D9%84%D8%A7%20%D9%8A%D8%B3%D8%AC%D8%AF%D9%88%D8%A7%20%D9%84%D9%84%D9%87%20%D8%A7%D9%84%D8%B0%D9%8A%20%D9%8A%D8%AE%D8%B1%D8%AC%20%D8%A7%D9%84%D8%AE%D8%A8%D8%A1
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
# From the take shown on its page (Home's stack, above): its controls, back to the day, then Read's search.
- runFlow: ../subflows/reader-controls.yaml
- tapOn:
    id: reader-back
- tapOn:
    id: tab-Read
- tapOn:
    id: read-search
- extendedWaitUntil:
    visible:
      id: search-mic
    timeout: 10000
# The waveform moves for as long as it listens: a tap that waits for the screen to settle returned only once the
# scripted listening had ended (Android, Nov 16 2026).
- tapOn:
    id: search-mic
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: search-listening
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl15-voice-search-listening-dark
- extendedWaitUntil:
    visible:
      id: recite-bar
    timeout: 15000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl16-voice-search-reciting-dark
- extendedWaitUntil:
    visible:
      id: recite-words
    timeout: 20000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl17-voice-search-following-dark
- tapOn:
    id: recite-stop
- extendedWaitUntil:
    visible:
      id: take-summary-passage
      text: "An.Naml,.ayahs.25.{1,4}26.*"
    timeout: 10000
- tapOn:
    id: take-summary-done
- tapOn:
    id: recite-close
- extendedWaitUntil:
    visible:
      id: recite-mic
    timeout: 5000
# The search's results (Majd, Nov 16 2026: the field and the mic at the bottom, clearer results). With the live check off a
# voice search's one result stays on the results: Al-Ikhlas 1, whose Saheeh International E2E builds carry
# (lib/e2e/demoTranslations), so its card shows the ayah, the translation and its credit, Share, Copy and Open.
- openLink:
    link: revisely://e2e/recite-live?on=0
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- openLink:
    link: revisely://e2e/voice-search?heard=%D9%82%D9%84%20%D9%87%D9%88%20%D8%A7%D9%84%D9%84%D9%87%20%D8%A3%D8%AD%D8%AF
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- runFlow:
    when:
      notVisible:
        id: reader-back
    commands:
      - tapOn:
          id: reader-background
# Back from a reader the voice search opened is the search screen itself; from any other, the Read tab.
- tapOn:
    id: reader-back
- runFlow:
    when:
      notVisible:
        id: search-bar
    commands:
      - tapOn:
          id: read-search
- extendedWaitUntil:
    visible:
      id: search-bar
    timeout: 10000
- runFlow:
    when:
      visible:
        id: search-clear
    commands:
      - tapOn:
          id: search-clear
      - runFlow: ../subflows/keyboard-away.yaml
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl18-search-dark
- tapOn:
    id: search-mic
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: search-verse-112-1
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: search-verse-translation
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl19-search-result-dark
- tapOn:
    id: search-back
- openLink:
    link: revisely://e2e/voice-search?off=1
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
