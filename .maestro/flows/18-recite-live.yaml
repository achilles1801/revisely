# The Dev app's one mic and live check on the reader (Revisely Dev only; src/lib/reciteLive), for a
# previewTester account. E2E builds have no microphone or checker: `e2e/recite-live` turns the Dev
# UI on and a take plays a recorded event log (src/lib/e2e/reciteLive.ts: An-Naml 23–24 on page
# 379 with a wrong word and a haraka slip, the moment of Majd's Tarteel screenshots of Nov 14 2026).
# Screenshots of each state for the mocks (~/Documents/revisely-recite-mocks/option-A-final-2.png):
# the reader with the mic, the mic's menu, following, a mark and the score, the hidden view, done.
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-14T10:00
      BOUNDARY: midnight
- runScript:
    file: ../scripts/server-revo.js
    env:
      MODE: tester

# The Dev UI, then the reader at An-Naml 23.
- openLink:
    link: revisely://e2e/recite-live?on=1
    optional: true
- runFlow: ../subflows/open-link-prompt.yaml
- openLink:
    link: revisely://read?page=379
    optional: true
- repeat:
    while:
      notVisible:
        id: reader-background
    times: 6
    commands:
      - runFlow: ../subflows/open-link-prompt.yaml
      - extendedWaitUntil:
          visible:
            id: reader-background
          timeout: 4000
          optional: true
      - runFlow:
          when:
            notVisible:
              id: reader-background
          commands:
            - openLink:
                link: revisely://read?page=379
                optional: true

# The controls: one mic (no record button) and the eye.
- tapOn:
    id: reader-background
- extendedWaitUntil:
    visible:
      id: recite-mic
    timeout: 10000
- assertNotVisible: "Record your recitation"
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl01-reader

# Hold the mic: Record, Recite, Check.
- longPressOn:
    id: recite-mic
- extendedWaitUntil:
    visible:
      id: recite-mode-menu
    timeout: 5000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl02-menu
- tapOn:
    id: recite-mode-check

# The AI notice, once; then the take.
- extendedWaitUntil:
    visible:
      id: recite-notice-agree
    timeout: 5000
- tapOn:
    id: recite-notice-agree
- extendedWaitUntil:
    visible:
      id: recite-words
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl03-following

# The wrong word marked, the score by the page.
- extendedWaitUntil:
    visible:
      id: live-mark-word
    timeout: 15000
- assertVisible:
    id: recite-score
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl04-marks

# The eye hides the page; ‹ shows the next word.
- tapOn:
    id: recite-eye
- assertVisible:
    id: recite-eye-group
- tapOn:
    id: recite-next-word
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl05-hidden
- tapOn:
    id: recite-eye

# Stop: the final answer, then ✕.
- tapOn:
    id: recite-stop
- extendedWaitUntil:
    visible:
      id: recite-close
    timeout: 10000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: rl06-done
- tapOn:
    id: recite-close
- assertVisible:
    id: recite-mic
