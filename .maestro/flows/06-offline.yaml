# Offline: a session revised with no connection is kept on the phone, survives a
# cold start offline, and reaches the server once the phone is back online.
# Rules (BEHAVIOUR.md): SYNC-1, SYNC-2, SESS-3
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T12:00
      BOUNDARY: midnight

- runFlow:
    file: ../subflows/network.yaml
    env:
      OFFLINE: 1
- extendedWaitUntil:
    visible:
      id: offline-note
    timeout: 30000

# Three pages (1, 582, 583), offline.
- tapOn:
    id: today-cta
- extendedWaitUntil:
    visible:
      id: session-quiet-count
      text: "Juz 1 · 0/10"
    timeout: 15000
- runFlow:
    file: ../subflows/swipe-pages.yaml
    env:
      UNTIL: 3/10
- runFlow: ../subflows/show-controls.yaml
- tapOn: "Back"
# SYNC-1: the phone's copy shows it at once, and says it waits to sync.
- extendedWaitUntil:
    visible:
      id: today-title
      text: "Continue at An.Nazi.at, p..584.*"
    timeout: 10000
- assertVisible:
    id: offline-note
    text: ".*changes are saved on this phone.*"
- runFlow:
    file: ../subflows/server-session-is.yaml
    env:
      DAY: 2026-11-03
      PAGES: -1

# SYNC-2: a cold start, still offline, shows the account with the change.
- runFlow: ../subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: today-title
      text: "Continue at An.Nazi.at, p..584.*"
    timeout: 20000
- assertVisible:
    id: offline-note

# SYNC-1: back online, the change reaches the server.
- runFlow:
    file: ../subflows/network.yaml
    env:
      OFFLINE: 0
- extendedWaitUntil:
    notVisible:
      id: offline-note
    timeout: 60000
- runFlow:
    file: ../subflows/server-session-is.yaml
    env:
      DAY: 2026-11-03
      PAGES: 3
- assertVisible:
    id: today-title
    text: "Continue at An.Nazi.at, p..584.*"
