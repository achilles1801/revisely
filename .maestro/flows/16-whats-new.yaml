# "What's new" for a previewTester account (marked one through the emulator, as the owner's script
# does). The release is live, but an account made here is new and never sees it (onboarding marks it
# seen; an account from before the release sees it once at launch, NEW-1, which the scenarios check for
# an account that isn't a tester). So this goes in the testers' way, which runs the same screen:
# Settings → About → What's new replays the cards with a ✕; Settings → Testing → Show What's new at
# launch runs it from the next launch as App Store users will see it. It resumes on the card it was
# left on after a relaunch, Android's back goes to the card before, and after Done it doesn't come back.
# The current release is 1.0.5 (mistake detection), five cards: the Recite moment (ReciteMoment: a take plays by
# itself; Skip takes it to its end, its screenshot is that end), the marks, Recite the mistakes again, Gaps in Insights,
# and Also new. The Recite cards need a phone that can run Recite (the microphone stream: both E2E builds have it).
# A card's title reads "Step 1 of 5. <title>" to VoiceOver, and iOS matches that label: titles are
# matched by id, with .* before them.
# Screenshots: the replay, each card of the run, Home after (w1–w7).
# Rules (BEHAVIOUR.md): NEW-2, NEW-3
appId: com.revisionbuddy.app
---
- runFlow:
    file: ../subflows/new-account.yaml
    env:
      CLOCK: 2026-11-03T19:00
      BOUNDARY: midnight
# A tester (the replay and the run at launch are theirs until the release): the app sees it when its
# user document changes.
- runScript:
    file: ../scripts/server-revo.js
    env:
      MODE: tester
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 20000

# NEW-3: Settings → About → What's new, with a ✕ (on the moment too).
- tapOn:
    id: open-settings
- runFlow:
    file: ../subflows/settings-row.yaml
    env:
      ROW: settings-whats-new
- tapOn:
    id: settings-whats-new
- extendedWaitUntil:
    visible:
      id: whats-new-replay
    timeout: 10000
- assertVisible:
    id: whats-new-close
- runFlow: ../subflows/recite-moment-skip.yaml
- extendedWaitUntil:
    visible:
      id: whats-new-title
      text: '.*Recite, and see your mistakes'
    timeout: 20000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: w1-replay
- tapOn:
    id: whats-new-next
- assertVisible:
    id: whats-new-title
    text: '.*Every mistake, explained'
- tapOn:
    id: whats-new-close
- extendedWaitUntil:
    notVisible:
      id: whats-new-replay
    timeout: 10000

# NEW-3: Testing → Show What's new at launch, from the next launch.
- runFlow:
    file: ../subflows/settings-row.yaml
    env:
      ROW: settings-whats-new-launch
- tapOn:
    id: settings-whats-new-launch
- runFlow: ../subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: whats-new-forced
    timeout: 20000
# NEW-2: required, so no ✕; one Next a card. The moment first.
- assertNotVisible:
    id: whats-new-close
- runFlow: ../subflows/recite-moment-skip.yaml
- extendedWaitUntil:
    visible:
      id: whats-new-title
      text: '.*Recite, and see your mistakes'
    timeout: 20000
- assertNotVisible:
    id: whats-new-close
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: w2-recite
- tapOn:
    id: whats-new-next
- assertVisible:
    id: whats-new-title
    text: '.*Every mistake, explained'
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: w3-marks
- tapOn:
    id: whats-new-next
- assertVisible:
    id: whats-new-title
    text: '.*Until it sticks'
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: w4-again
# Android's back goes to the card before (between two pictures: back onto the moment would play it again).
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - assertVisible:
          id: whats-new-title
          text: '.*Every mistake, explained'
      - tapOn:
          id: whats-new-next
      - assertVisible:
          id: whats-new-title
          text: '.*Until it sticks'

# NEW-2: leaving part way reopens it on the card it was on.
- runFlow: ../subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: whats-new-forced
    timeout: 20000
- assertVisible:
    id: whats-new-title
    text: '.*Until it sticks'
- tapOn:
    id: whats-new-next
- assertVisible:
    id: whats-new-title
    text: '.*Gaps, in Insights'
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: w5-gaps
- tapOn:
    id: whats-new-next
- assertVisible:
    id: whats-new-title
    text: '.*Also new'
- assertVisible:
    id: whats-new-row-test
- assertVisible:
    id: whats-new-row-search
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: w6-also-new
- tapOn:
    id: whats-new-done
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 20000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: w7-home-after

# Done turned the switch off: the next launch goes straight to Home.
- runFlow: ../subflows/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: today-post
    timeout: 20000
- assertNotVisible:
    id: whats-new-forced
